<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3D Cartoon Dance</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
    }
    model-viewer {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1f2937 0%, #0d1117 100%);
      --poster-color: transparent;
      --progress-bar-color: #60a5fa;
    }
    #status {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font: 14px/1.4 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
    }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <model-viewer
    id="viewer"
    src="./wee.glb"
    alt="3D cartoon characters dancing"
    autoplay
    camera-controls
    touch-action="none"
    interaction-prompt="none"
    interpolation-decay="100"
    camera-orbit="0deg 78deg 105%"
    min-camera-orbit="auto 45deg auto"
    max-camera-orbit="auto 95deg auto"
    field-of-view="32deg"
    shadow-intensity="1"
    shadow-softness="1"
    exposure="1.1"
    environment-image="neutral">
  </model-viewer>
  <div id="status" role="status">Loading…</div>

  <script>
    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');

    const show = (text) => {
      status.textContent = text;
      status.hidden = false;
    };

    if (location.protocol === 'file:') {
      show('Open this page through a local server, not by double-clicking it.');
    }

    viewer.addEventListener('progress', (e) => {
      const p = e.detail.totalProgress;
      if (p < 1 && location.protocol !== 'file:') {
        show(`Loading ${Math.round(p * 100)}%`);
      }
    });

    viewer.addEventListener('load', () => {
      if (viewer.availableAnimations.length === 0) {
        show('Model loaded, but it contains no animation.');
        return;
      }
      console.log('Animations:', viewer.availableAnimations);
      status.hidden = true;
      viewer.play();
    });

    viewer.addEventListener('error', () => {
      show(location.protocol === 'file:'
        ? 'Model blocked. Run a local server and open the page from it.'
        : 'Could not load wee.glb. Check the file name and folder.');
    });
  </script>
</body>
</html>
