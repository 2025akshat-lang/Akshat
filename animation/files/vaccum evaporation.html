<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacuum Evaporation Animation - Milk Powder Process</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h2 {
      color: #1e293b;
      margin-bottom: 5px;
      text-align: center;
    }
    p.subtitle {
      color: #64748b;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Vacuum Chamber Visual */
    .chamber {
      width: 280px;
      height: 320px;
      border: 4px solid #334155;
      border-radius: 140px 140px 20px 20px;
      position: relative;
      background: linear-gradient(to bottom, #e2e8f0, #ffffff);
      overflow: hidden;
      display: flex;
      justify-content: center;
    }
    /* Liquid/Milk Container */
    .beaker {
      width: 180px;
      height: 120px;
      border: 3px solid #64748b;
      border-top: none;
      border-radius: 0 0 10px 10px;
      position: absolute;
      bottom: 20px;
      background: rgba(255,255,255,0.5);
      overflow: hidden;
    }
    /* Milk Content */
    .milk {
      width: 100%;
      height: 80%;
      background-color: #fff8dc; /* Milk Color */
      position: absolute;
      bottom: 0;
      transition: height 0.5s, background-color 0.5s;
    }
    /* Powder Formed */
    .powder {
      width: 100%;
      height: 15px;
      background-color: #fef08a; /* Powder Color */
      position: absolute;
      bottom: 0;
      opacity: 0;
      transition: opacity 0.5s;
      border-radius: 5px;
    }
    /* Bubbles Animation */
    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      bottom: 0;
      animation: rise 1s infinite ease-in;
      display: none;
    }
    @keyframes rise {
      0% { bottom: 0; opacity: 1; transform: scale(0.5); }
      100% { bottom: 100%; opacity: 0; transform: scale(1.2); }
    }
    /* Vapour Particles */
    .vapour {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(148, 163, 184, 0.6);
      border-radius: 50%;
      bottom: 140px;
      animation: floatUp 1.5s infinite linear;
      display: none;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-120px) scale(2); opacity: 0; }
    }
    /* Controls Section */
    .controls {
      width: 100%;
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-weight: bold;
      color: #334155;
    }
    input[type=range] {
      width: 100%;
      cursor: pointer;
    }
    /* Dashboard Data */
    .dashboard {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .data-box {
      text-align: center;
    }
    .data-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2563eb;
    }
    .status-msg {
      margin-top: 15px;
      font-weight: bold;
      color: #059669;
      text-align: center;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <h2></h2>
  <p class="subtitle"></p>

  <div class="container">
    <!-- Visual Chamber -->
    <div class="chamber">
      <!-- Vapour Dots -->
      <div class="vapour" style="left: 100px; animation-delay: 0s;"></div>
      <div class="vapour" style="left: 130px; animation-delay: 0.3s;"></div>
      <div class="vapour" style="left: 160px; animation-delay: 0.6s;"></div>

      <!-- Milk Beaker -->
      <div class="beaker">
        <div class="milk" id="milk">
          <div class="bubble" style="left: 20%; width: 10px; height: 10px; animation-delay: 0s;"></div>
          <div class="bubble" style="left: 50%; width: 14px; height: 14px; animation-delay: 0.2s;"></div>
          <div class="bubble" style="left: 70%; width: 8px; height: 8px; animation-delay: 0.4s;"></div>
        </div>
        <div class="powder" id="powder"></div>
      </div>
    </div>

    <!-- Live Data Readings -->
    <div class="dashboard" style="margin-top: 20px;">
      <div class="data-box">
        <div>Chamber Pressure</div>
        <div class="data-value" id="pressureVal">1.0 atm (Normal)</div>
      </div>
      <div class="data-box">
        <div>Boiling Point</div>
        <div class="data-value" id="boilVal">100 °C</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="slider-group">
        <label for="pressureSlider">Vacuum Pump (Pressure Kam Karo):</label>
        <input type="range" id="pressureSlider" min="0.1" max="1.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- Info Status -->
    <div class="status-msg" id="statusMsg">Pressure normal hai. Doodh ko boil karne ke liye 100°C chahiye (Ghar wala tareeka).</div>
  </div>

  <script>
    const pressureSlider = document.getElementById('pressureSlider');
    const pressureVal = document.getElementById('pressureVal');
    const boilVal = document.getElementById('boilVal');
    const statusMsg = document.getElementById('statusMsg');
    const milk = document.getElementById('milk');
    const powder = document.getElementById('powder');
    const bubbles = document.querySelectorAll('.bubble');
    const vapours = document.querySelectorAll('.vapour');

    pressureSlider.addEventListener('input', (e) => {
      const p = parseFloat(e.target.value);
      
      // Calculate Boiling Point roughly based on pressure
      // Normal: 1 atm = 100°C, Low: 0.1 atm = ~45°C
      const bp = Math.round(40 + (p - 0.1) * (60 / 0.9));

      pressureVal.innerText = `${p.toFixed(1)} atm ${p < 1.0 ? '(Vacuum On)' : '(Normal)'}`;
      boilingPointDisplay(bp, p);
    });

    function boilingPointDisplay(bp, p) {
      boilVal.innerText = `${bp} °C`;

      if (p <= 0.3) {
        // High Vacuum State
        statusMsg.innerText = `⚡ Wah! Pressure bohot kam ho gaya! Ab doodh sirf ${bp}°C par hi bina jale boil hone laga aur Milk Powder ban raha hai!`;
        statusMsg.style.color = "#059669";
        
        // Evaporation Animation Active
        milk.style.height = "15%";
        powder.style.opacity = "1";
        
        bubbles.forEach(b => b.style.display = 'block');
        vapours.forEach(v => v.style.display = 'block');

      } else if (p < 1.0) {
        // Medium Vacuum State
        statusMsg.innerText = `🌀 Pressure kam ho raha hai... Boiling temperature girkar ${bp}°C aa gaya hai!`;
        statusMsg.style.color = "#d97706";

        milk.style.height = "50%";
        powder.style.opacity = "0";

        bubbles.forEach(b => b.style.display = 'block');
        vapours.forEach(v => v.style.display = 'block');

      } else {
        // Normal State
        statusMsg.innerText = "Pressure normal hai. Doodh ko boil karne ke liye 100°C chahiye (Ghar wala tareeka - Milk jal sakta hai).";
        statusMsg.style.color = "#1e293b";

        milk.style.height = "80%";
        powder.style.opacity = "0";

        bubbles.forEach(b => b.style.display = 'none');
        vapours.forEach(v => v.style.display = 'none');
      }
    }
  </script>
</body>
</html>
