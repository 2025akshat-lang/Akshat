<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atom Lab 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Lexend:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Screen = only the 3D model. Everything else lives in one dropdown menu. */
:root{
  --panel:rgba(255,255,255,.95);--card:#ffffff;--ink:#0f2038;--muted:#475c78;--line:#bacce0;
  --accent:#0a67cc;--accent-ink:#ffffff;--good:#137a45;--bad:#c22a2a;--warn:#9a5500;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --ui:1;--lab:1;--cap:1;--touch:2.75rem;
  --f-d:'Lexend','Hind',system-ui,sans-serif;--f-b:'Hind','Lexend',system-ui,sans-serif;--f-m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:rgba(12,22,40,.95);--card:#14233f;--ink:#e7effa;--muted:#9bb0cc;--line:#27406a;
    --accent:#58b4ff;--accent-ink:#04101f;--good:#52d492;--bad:#ff7070;--warn:#ffb54d;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(12,22,40,.95);--card:#14233f;--ink:#e7effa;--muted:#9bb0cc;--line:#27406a;
  --accent:#58b4ff;--accent-ink:#04101f;--good:#52d492;--bad:#ff7070;--warn:#ffb54d;color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--ui))}
html,body{height:100%;margin:0}
body{background:#040a16;color:var(--ink);font:400 1rem/1.45 var(--f-b);overflow:hidden}
button,select,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0e1f3d,#040a16 75%);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-135%);font:600 calc(.85rem * var(--lab))/1.2 var(--f-d);padding:.2em .6em;border-radius:.5em;background:rgba(6,14,30,.78);border:1px solid rgba(130,180,240,.45);color:#e7effa;white-space:nowrap}

/* dropdown dock */
#dock{position:fixed;top:calc(.6rem + env(safe-area-inset-top,0px));left:.6rem;z-index:10;width:min(23rem,calc(100vw - 1.2rem));display:flex;flex-direction:column;gap:.45rem;max-height:calc(100% - 1.2rem - env(safe-area-inset-top,0px))}
.btn{min-height:var(--touch);padding:0 1rem;border-radius:.65rem;border:1.5px solid var(--line);background:var(--card);font:600 .95rem var(--f-d);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.4;cursor:default}
#menuBtn{align-self:flex-start;box-shadow:var(--shadow);background:var(--panel);backdrop-filter:blur(6px)}
#menu{background:var(--panel);border:1px solid var(--line);border-radius:.9rem;box-shadow:var(--shadow);backdrop-filter:blur(8px);overflow-y:auto;padding:.4rem .85rem .8rem}
.mode{display:grid;gap:.3rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.mode label,.row span{font:600 .72rem var(--f-d);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
select{min-height:var(--touch);border-radius:.6rem;border:1.5px solid var(--line);background:var(--card);padding:0 .5rem;font-size:.95rem;width:100%}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{min-height:var(--touch);display:flex;align-items:center;justify-content:space-between;font:600 .95rem var(--f-d);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'▾';color:var(--muted);transition:transform .2s}
details[open]>summary::after{transform:rotate(180deg)}
.body{display:flex;flex-direction:column;gap:.55rem;padding:.1rem 0 .8rem}
.row{display:grid;grid-template-columns:1fr;gap:.3rem}
.chk{display:flex;align-items:center;gap:.6rem;min-height:calc(var(--touch) * .8);cursor:pointer}
.chk input{width:1.35rem;height:1.35rem;accent-color:var(--accent);flex:none}
.rng{display:grid;grid-template-columns:1fr auto;gap:.15rem .5rem;align-items:center}
.rng input{grid-column:1/-1;width:100%;height:var(--touch);accent-color:var(--accent);margin:0}
.rng output{font:500 .85rem var(--f-m);color:var(--muted)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.note{font-size:.8rem;color:var(--muted);margin:0;line-height:1.35}
.capk{font:600 .72rem var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#capT{margin:0;font:700 calc(1.1rem * var(--cap))/1.25 var(--f-d)}
#capP{margin:0;font-size:calc(.98rem * var(--cap));line-height:1.45}
.capnav{display:flex;align-items:center;gap:.5rem}
.dots{flex:1;display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);transform:scale(1.25)}
.chip{align-self:flex-start;display:inline-flex;padding:.25rem .7rem;border-radius:99px;font:600 .85rem var(--f-d);border:1.5px solid currentColor}
.chip.good{color:var(--good)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}.chip.info{color:var(--accent)}
.meter{height:.55rem;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:#ff8a4c}
#info{margin:0;font:500 .85rem/1.5 var(--f-m);white-space:pre-wrap;color:var(--ink)}
#lvl{width:100%;height:auto;display:block}
#lvl .lv{stroke:var(--muted);stroke-width:1.5}
#lvl .on{stroke:var(--accent);stroke-width:2.5}
#lvl text{fill:var(--ink);font:600 11px var(--f-m)}
#lvl .en{fill:var(--muted);font-weight:500}
#lvl .dot{fill:#1469e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #lvl .dot{fill:#58b8ff}}
:root[data-theme="dark"] #lvl .dot{fill:#58b8ff}
/* lesson dock: bottom, collapsed by default, draggable */
#lesson{position:fixed;left:.6rem;bottom:calc(.6rem + env(safe-area-inset-bottom,0px));z-index:11;display:flex;flex-direction:column;gap:.4rem;align-items:flex-start;pointer-events:none;max-width:calc(100vw - 1.2rem)}
#lesson.open{width:min(26rem,calc(100vw - 1.2rem))}
#lesson>*{pointer-events:auto}
#lessonHead{display:inline-flex;align-items:center;gap:.2rem;min-height:var(--touch);padding:0 .6rem 0 .3rem;border-radius:.65rem;border:1.5px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);box-shadow:var(--shadow);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#lessonHead.drag{cursor:grabbing;border-color:var(--accent)}
#grip{font:700 1.25rem var(--f-d);color:var(--muted);padding:0 .3rem;line-height:1}
#lessonBtn{border:0;background:none;font:600 .95rem var(--f-d);display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;min-height:var(--touch);padding:0 .3rem;color:var(--ink)}
#lessonBtn small{font:500 .8rem var(--f-m);color:var(--muted)}
#lessonBtn::after{content:'\25B4';color:var(--muted);transition:transform .2s}
#lesson.open #lessonBtn::after{transform:rotate(180deg)}
#lessonBody{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:.9rem;box-shadow:var(--shadow);backdrop-filter:blur(8px);padding:.75rem .9rem;display:flex;flex-direction:column;gap:.55rem}
#backBtn{position:fixed;top:calc(.6rem + env(safe-area-inset-top,0px));right:.6rem;z-index:10;box-shadow:var(--shadow);background:var(--panel)}
</style>
</head>
<body>

<main id="stage">
  <canvas id="gl" aria-label="3D atom"></canvas>
  <div id="labels"></div>
</main>

<div id="dock">
  <button class="btn" id="menuBtn" aria-expanded="false" aria-controls="menu">☰ <span data-i="menu">Menu</span></button>
  <div id="menu" hidden>

    <div class="mode">
      <label for="mode" data-i="modeL">Model</label>
      <select id="mode">
        <option value="r" data-i="m_r">Rutherford (3D)</option>
        <option value="b" data-i="m_b">Bohr (3D)</option>
        <option value="q" data-i="m_q">Quantum cloud (4D: space + time)</option>
        <option value="f" data-i="m_f">5D: space + time + energy</option>
      </select>
    </div>

    <details id="dModel">
      <summary data-i="sModel">Model controls</summary>
      <div class="body">
        <label class="row" data-m="rb"><span data-i="element">Element</span><select id="zsel"></select></label>
        <p class="note" id="shellNote" data-m="rb"></p>

        <div data-m="r" class="body" style="padding:0">
          <label class="chk"><input type="checkbox" id="lossOn"><span data-i="loss">Electron loses energy (theory)</span></label>
          <label class="rng"><span data-i="collT">Collapse time</span><output id="Tout"></output><input type="range" id="T" min="3" max="30" step="1"></label>
          <label class="chk"><input type="checkbox" id="waves"><span data-i="waves">Show radiated energy</span></label>
          <label class="chk"><input type="checkbox" id="arrows"><span data-i="arrows">Show velocity and acceleration</span></label>
          <button class="btn" id="replay" data-i="replay">↺ Replay</button>
        </div>

        <div data-m="b" class="body" style="padding:0">
          <div class="btnrow"><button class="btn primary" id="exc" data-i="excite">⬆ Absorb energy</button><button class="btn" id="rel" data-i="relax">⬇ Emit energy</button></div>
          <label class="chk"><input type="checkbox" id="autoJ"><span data-i="autoJ">Automatic jumps</span></label>
          <label class="chk"><input type="checkbox" id="shellVis"><span data-i="shellVis">Show shells</span></label>
        </div>

        <div data-m="q" class="body" style="padding:0">
          <label class="row"><span data-i="qstate">Quantum state</span>
            <select id="qs"><option value="1s">1s</option><option value="2p">2p</option><option value="3d">3d</option><option value="1s+2p">1s + 2p</option><option value="2p+3d">2p + 3d</option></select></label>
        </div>

        <div data-m="f" class="body" style="padding:0">
          <label class="rng"><span data-i="energy">Energy dimension (n)</span><output id="enOut"></output><input type="range" id="en" min="1" max="3" step="0.01"></label>
          <label class="chk"><input type="checkbox" id="sweep"><span data-i="sweep">Sweep energy automatically</span></label>
        </div>

        <div data-m="qf" class="body" style="padding:0">
          <label class="chk"><input type="checkbox" id="play"><span data-i="play">Time running</span></label>
          <label class="rng"><span data-i="timeL">Time (4th dimension)</span><output id="tauOut"></output><input type="range" id="tau" min="0" max="60" step="0.1"></label>
          <label class="chk"><input type="checkbox" id="phase"><span data-i="phase">Colour by wave phase</span></label>
        </div>
      </div>
    </details>

    <details id="dEff">
      <summary data-i="sEff">Effects</summary>
      <div class="body">
        <label class="chk"><input type="checkbox" id="bloom"><span data-i="bloom">Glow (bloom)</span></label>
        <label class="rng"><span data-i="bloomAmt">Glow strength</span><output id="bloomOut"></output><input type="range" id="bloomAmt" min="0" max="250" step="5"></label>
        <label class="chk"><input type="checkbox" id="stars"><span data-i="stars">Starfield</span></label>
        <label class="chk"><input type="checkbox" id="trails"><span data-i="trails">Electron trails</span></label>
        <label class="chk"><input type="checkbox" id="shock"><span data-i="shock">Shockwave rings</span></label>
        <label class="chk"><input type="checkbox" id="shake"><span data-i="shake">Camera shake on collapse</span></label>
        <label class="chk"><input type="checkbox" id="pulse"><span data-i="pulse">Pulsing nucleus</span></label>
        <label class="chk" data-m="r"><input type="checkbox" id="orbits"><span data-i="orbits">Show orbit paths</span></label>
      </div>
    </details>

    <details id="dView">
      <summary data-i="sView">View</summary>
      <div class="body">
        <label class="rng"><span data-i="speed">Animation speed</span><output id="spdOut"></output><input type="range" id="spd" min="0.1" max="2" step="0.1"></label>
        <label class="chk"><input type="checkbox" id="labsOn"><span data-i="labsOn">Show labels</span></label>
        <label class="chk"><input type="checkbox" id="rot"><span data-i="rot">Auto-rotate</span></label>
        <div class="btnrow"><button class="btn" id="resetView" data-i="resetView">Reset camera</button><button class="btn" id="full" data-i="full">Full screen</button></div>
      </div>
    </details>

    <details id="dDisp">
      <summary data-i="sDisp">Screen, text and language</summary>
      <div class="body">
        <button class="btn" id="board" data-i="board">Smartboard size</button>
        <label class="rng"><span data-i="ui">Whole screen size</span><output id="uiOut"></output><input type="range" id="ui" min="70" max="220" step="5"></label>
        <label class="rng"><span data-i="cap">Lesson text size</span><output id="capOut"></output><input type="range" id="capS" min="70" max="260" step="5"></label>
        <label class="rng"><span data-i="lab">Label size</span><output id="labOut"></output><input type="range" id="labS" min="70" max="260" step="5"></label>
        <label class="row"><span data-i="theme">Theme</span><select id="theme"><option value="auto" data-i="tAuto">Auto</option><option value="light" data-i="tLight">Light</option><option value="dark" data-i="tDark">Dark</option></select></label>
        <label class="row"><span data-i="lang">Language</span><select id="lang"><option value="en">English</option><option value="hi">हिन्दी</option></select></label>
        <button class="btn" id="reset" data-i="reset">Reset all settings</button>
      </div>
    </details>

    <details id="dStat">
      <summary data-i="sStat">Status</summary>
      <div class="body">
        <span class="chip info" id="stat"></span>
        <div class="meter" data-m="r"><i id="mR"></i></div>
        <pre id="info"></pre>
        <svg id="lvl" data-m="b" viewBox="0 0 250 150" role="img" aria-label="Energy levels"></svg>
        <p class="note" id="hint"></p>
      </div>
    </details>

  </div>
</div>

<button class="btn" id="backBtn" hidden>← <span data-i="back">Back to main atom</span></button>

<div id="lesson">
  <div id="lessonBody" hidden>
    <div class="capk" id="capK"></div>
    <h2 id="capT"></h2>
    <p id="capP"></p>
    <div class="capnav">
      <button class="btn" id="prev" aria-label="Previous step">◀</button>
      <div class="dots" id="dots"></div>
      <button class="btn primary" id="next" aria-label="Next step">▶</button>
    </div>
  </div>
  <div id="lessonHead" title="Drag to move">
    <span id="grip" aria-hidden="true">⠿</span>
    <button id="lessonBtn" aria-expanded="false" aria-controls="lessonBody">📖 <span data-i="sLesson">Lesson</span> <small id="lessonStep"></small></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const root = document.documentElement;

/* ---------- settings (display + effect preferences are remembered) ---------- */
const DEF = { ui: 1, cap: 1, lab: 1, theme: 'auto', lang: 'en', speed: 1, trails: true, labels: true, rot: false,
  bloom: true, bloomAmt: 1, stars: true, shock: true, shake: true, pulse: true, orbits: true };
const S = Object.assign({}, DEF, { mode: 'r', zr: 1, zb: 11, loss: false, T: 10, waves: true, arrows: false, shells: true, auto: false,
  qs: '1s+2p', energy: 1.5, sweep: false, play: true, tau: 0, phase: true });
try { const k = JSON.parse(localStorage.getItem('atomlab3d') || '{}'); for (const key in DEF) if (key in k) S[key] = k[key]; } catch (e) {}
const save = () => { try { const o = {}; for (const key in DEF) o[key] = S[key]; localStorage.setItem('atomlab3d', JSON.stringify(o)); } catch (e) {} };

/* ---------- text: [English, Hindi] ---------- */
const L = {
  menu: ['Menu', 'मेन्यू'], modeL: ['Model', 'मॉडल'],
  m_r: ['Rutherford (3D)', 'रदरफ़ोर्ड (3D)'], m_b: ['Bohr (3D)', 'बोहर (3D)'],
  m_q: ['Quantum cloud (4D: space + time)', 'क्वांटम बादल (4D: स्थान + समय)'], m_f: ['5D: space + time + energy', '5D: स्थान + समय + ऊर्जा'],
  sLesson: ['Lesson', 'पाठ'], sModel: ['Model controls', 'मॉडल कंट्रोल'], sEff: ['Effects', 'इफ़ेक्ट'], sView: ['View', 'दृश्य'],
  sDisp: ['Screen, text and language', 'स्क्रीन, अक्षर और भाषा'], sStat: ['Status', 'स्थिति'],
  element: ['Element', 'तत्व'], loss: ['Electron loses energy (theory)', 'इलेक्ट्रॉन ऊर्जा खोता है (सिद्धांत)'], collT: ['Collapse time', 'गिरने का समय'],
  waves: ['Show radiated energy', 'विकिरित ऊर्जा दिखाएँ'], arrows: ['Show velocity and acceleration', 'वेग और त्वरण दिखाएँ'], replay: ['↺ Replay', '↺ दोबारा चलाएँ'],
  excite: ['⬆ Absorb energy', '⬆ ऊर्जा अवशोषित'], relax: ['⬇ Emit energy', '⬇ ऊर्जा उत्सर्जित'], autoJ: ['Automatic jumps', 'अपने आप कूदना'], shellVis: ['Show shells', 'कोश दिखाएँ'],
  qstate: ['Quantum state', 'क्वांटम अवस्था'], energy: ['Energy dimension (n)', 'ऊर्जा आयाम (n)'], sweep: ['Sweep energy automatically', 'ऊर्जा अपने आप बदलें'],
  play: ['Time running', 'समय चल रहा है'], timeL: ['Time (4th dimension)', 'समय (चौथा आयाम)'], phase: ['Colour by wave phase', 'तरंग की कला से रंग'],
  bloom: ['Glow (bloom)', 'चमक (ब्लूम)'], bloomAmt: ['Glow strength', 'चमक की तीव्रता'], stars: ['Starfield', 'तारों की पृष्ठभूमि'], trails: ['Electron trails', 'इलेक्ट्रॉन का पथ'],
  shock: ['Shockwave rings', 'शॉकवेव छल्ले'], shake: ['Camera shake on collapse', 'गिरने पर कैमरा हिले'], pulse: ['Pulsing nucleus', 'धड़कता नाभिक'], orbits: ['Show orbit paths', 'कक्षा पथ दिखाएँ'],
  speed: ['Animation speed', 'एनिमेशन की गति'], labsOn: ['Show labels', 'लेबल दिखाएँ'], rot: ['Auto-rotate', 'अपने आप घुमाएँ'], resetView: ['Reset camera', 'कैमरा रीसेट'], full: ['Full screen', 'फ़ुल स्क्रीन'],
  board: ['Smartboard size', 'स्मार्टबोर्ड साइज़'], ui: ['Whole screen size', 'पूरी स्क्रीन का आकार'], cap: ['Lesson text size', 'पाठ के अक्षर'], lab: ['Label size', 'लेबल का आकार'],
  theme: ['Theme', 'थीम'], tAuto: ['Auto', 'ऑटो'], tLight: ['Light', 'हल्का'], tDark: ['Dark', 'गहरा'], lang: ['Language', 'भाषा'], reset: ['Reset all settings', 'सभी सेटिंग रीसेट'],
  lNuc: ['Nucleus (+)', 'नाभिक (+)'], lElec: ['Electron (−)', 'इलेक्ट्रॉन (−)'], lPhoton: ['Photon', 'फ़ोटॉन'], lV: ['v  velocity', 'v  वेग'], lA: ['a  acceleration', 'a  त्वरण'],
  lProton: ['Proton (+)', 'प्रोटॉन (+)'], lEnergyAxis: ['Energy (5th dimension)', 'ऊर्जा (5वाँ आयाम)'],
  sStable: ['Stable orbit (no energy loss)', 'स्थिर कक्षा (ऊर्जा हानि नहीं)'], sLosing: ['Losing energy, spiralling in', 'ऊर्जा खो रहा है, अंदर गिर रहा है'],

Q.build = function () {
  if (Q.pts) { Q.group.remove(Q.pts); Q.pts.geometry.dispose(); }
  const N = Q.N, pos = new Float32Array(N * 3), th = 2.2, rmax = 15;
  Q.ps = [new Float32Array(N), new Float32Array(N), new Float32Array(N)];
  Q.re = new Float32Array(N); Q.im = new Float32Array(N); Q.dens = new Float32Array(N); Q.col = new Float32Array(N * 3);
  const tmp = [0, 0, 0];
  const trial = () => {
    const r = -th * Math.log(Math.random() * Math.random() * Math.random());
    if (r > rmax || r < 0.02) return null;
    const u = 2 * Math.random() - 1, ph = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    const x = r * s * Math.cos(ph), y = r * s * Math.sin(ph), z = r * u;
    let sum = 0;
    for (let k = 0; k < 3; k++) { tmp[k] = PSI[k](x, y, z, r) * NORM[k]; sum += Math.abs(tmp[k]); }
    return { x, y, z, w: sum * sum * Math.exp(r / th) };
  };
  let M = 0;
  for (let i = 0; i < 40000; i++) { const t = trial(); if (t && t.w > M) M = t.w; }
  M *= 1.2;
  let n = 0, guard = 0;
  while (n < N && guard++ < 3000000) {
    const t = trial(); if (!t || Math.random() > t.w / M) continue;
    pos[n * 3] = t.x * SC; pos[n * 3 + 1] = t.y * SC; pos[n * 3 + 2] = t.z * SC;
    Q.ps[0][n] = tmp[0]; Q.ps[1][n] = tmp[1]; Q.ps[2][n] = tmp[2];
    n++;
  }
  Q.N = n;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos.subarray(0, n * 3), 3));
  g.setAttribute('color', new THREE.BufferAttribute(Q.col.subarray(0, n * 3), 3));
  Q.pts = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.16, map: glowTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true }));
  Q.pts.frustumCulled = false; Q.group.add(Q.pts);
};

Q.update = function (dt) {

  if (S.mode === 'f' && S.sweep) { S.energy = 2 + 0.98 * Math.sin(S.tau * 0.22); }
  const amp = ampVec(), N = Q.N, ps = Q.ps, re = Q.re, im = Q.im, d = Q.dens, col = Q.col;
  const a0 = amp[0] * Math.cos(EK[0] * S.tau), a1 = amp[1] * Math.cos(EK[1] * S.tau), a2 = amp[2] * Math.cos(EK[2] * S.tau);
  const b0 = -amp[0] * Math.sin(EK[0] * S.tau), b1 = -amp[1] * Math.sin(EK[1] * S.tau), b2 = -amp[2] * Math.sin(EK[2] * S.tau);
  const p0 = ps[0], p1 = ps[1], p2 = ps[2];
  let mx = 1e-9;
  for (let i = 0; i < N; i++) {
    const x = a0 * p0[i] + a1 * p1[i] + a2 * p2[i], y = b0 * p0[i] + b1 * p1[i] + b2 * p2[i], v = x * x + y * y;
    re[i] = x; im[i] = y; d[i] = v; if (v > mx) mx = v;
  }
  const inv = 1 / mx, ph = S.phase, TAU2 = Math.PI * 2;
  for (let i = 0; i < N; i++) {
    const br = Math.pow(d[i] * inv, 0.6) * 1.1;
    if (ph) {
      let h = Math.atan2(im[i], re[i]) / TAU2; if (h < 0) h += 1;
      const c = HUE[(h * 72) | 0]; col[i * 3] = c[0] * br; col[i * 3 + 1] = c[1] * br; col[i * 3 + 2] = c[2] * br;
    } else { col[i * 3] = 0.45 * br; col[i * 3 + 1] = 0.8 * br; col[i * 3 + 2] = br; }
  }
  Q.pts.geometry.attributes.color.needsUpdate = true;
  pulseNucleus(Q.nuc, 0);
  Q.clkDot.position.set(Math.cos(S.tau * 0.9) * 3.6, 0, Math.sin(S.tau * 0.9) * 3.6);
  if (S.mode === 'f') {
    for (let k = 0; k < 3; k++) Q.ladDots[k].scale.setScalar(0.8 + 3.4 * amp[k] * amp[k]);

  setT('info', `ψ = ${terms}\nt = ${S.tau.toFixed(1)}` + (S.mode === 'f' ? `\nn = ${S.energy.toFixed(2)}` : ''));
  if (S.play) { const t = $('#tau'); if (document.activeElement !== t) t.value = S.tau.toFixed(1); setT('tauOut', S.tau.toFixed(1)); }
  if (S.mode === 'f' && S.sweep && document.activeElement !== $('#en')) { $('#en').value = S.energy; setT('enOut', S.energy.toFixed(2)); }
};

const NBS = [];

const NB_DEF = [

  { z: 2, en: 'Helium', hi: 'हीलियम', col: 0xff9ec4, a: -0.26, b: 0.2, D: 62 },

function makeNeighbour(d, pos) {
  const g = new THREE.Group(); g.position.copy(pos); scene.add(g);
  const col = new THREE.Color(d.col);
  const star = makeGlow(col, 2.6, 1), halo = makeGlow(col, 6, 0.35);
  g.add(halo, star);
  const det = new THREE.Group(); det.visible = false; det.scale.setScalar(0.001); g.add(det);
  const nuc = buildNucleus(d.z); nuc.scale.setScalar(0.6); det.add(nuc);
  const sh = shellsFor(d.z), els = [], rad = n => 1.7 + 1.25 * (n - 1);
  let R0 = 0;
  for (let n = 1; n <= 3; n++) {
    if (!sh[n - 1]) continue;
    R0 = rad(n);
    const ring = new THREE.LineLoop(circleGeo, new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending }));
    ring.scale.setScalar(rad(n)); det.add(ring);
    for (let k = 0; k < sh[n - 1]; k++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 8), new THREE.MeshStandardMaterial({ color: COL.el, emissive: COL.el, emissiveIntensity: 0.9 }));
      m.add(makeGlow(COL.el, 1.1, 0.7)); det.add(m);
      els.push({ m, r: rad(n), a: k * Math.PI * 2 / sh[n - 1] + n, w: 1.7 / Math.pow(n, 1.3) });
    }
  }
  return { g, star, halo, det, els, z: d.z, d, pos, reveal: 0, R: R0, cfg: sh.filter(x => x).join(', ') };
}
(() => {
  /* placed relative to the starting camera so a star sits in each visible corner area */
  const cp = new THREE.Vector3(HOME.d * Math.sin(HOME.ph) * Math.sin(HOME.th), HOME.d * Math.cos(HOME.ph), HOME.d * Math.sin(HOME.ph) * Math.cos(HOME.th));
  const fwd = cp.clone().negate().normalize(), right = new THREE.Vector3().crossVectors(fwd, Yaxis).normalize(), up = new THREE.Vector3().crossVectors(right, fwd).normalize();
  NB_DEF.forEach(d => {
    const pos = cp.clone().addScaledVector(fwd, d.D).addScaledVector(right, d.a * d.D).addScaledVector(up, d.b * d.D);
    NBS.push(makeNeighbour(d, pos));
  });
})();
function updNeighbours(dt) {
  NBS.forEach((n, i) => {
    const goal = visiting === n ? 1 : 0;
    n.reveal += clamp(goal - n.reveal, -dt * 0.9, dt * 0.9);
    const k = n.reveal * n.reveal * (3 - 2 * n.reveal);
    n.det.visible = n.reveal > 0.01; n.det.scale.setScalar(Math.max(0.001, k));
    n.star.material.opacity = 1 - k; n.halo.material.opacity = 0.35 * (1 - k);

function tapAt(cx, cy) {
  const rc = canvas.getBoundingClientRect();

    if (n === visiting) continue;

const num = k => t => +t.value / (k || 1), chk = t => t.checked, str = t => t.value;
bind('lossOn', 'loss', chk); bind('waves', 'waves', chk); bind('arrows', 'arrows', chk); bind('T', 'T', num());
bind('autoJ', 'auto', chk); bind('shellVis', 'shells', chk);
bind('qs', 'qs', str); bind('en', 'energy', num()); bind('sweep', 'sweep', chk); bind('play', 'play', chk); bind('phase', 'phase', chk);
bind('bloom', 'bloom', chk); bind('bloomAmt', 'bloomAmt', num(100)); bind('stars', 'stars', chk); bind('trails', 'trails', chk);
bind('shock', 'shock', chk); bind('shake', 'shake', chk); bind('pulse', 'pulse', chk); bind('orbits', 'orbits', chk);
bind('spd', 'speed', num()); bind('labsOn', 'labels', chk); bind('rot', 'rot', chk);
bind('ui', 'ui', num(100)); bind('capS', 'cap', num(100)); bind('labS', 'lab', num(100));
$('#en').addEventListener('input', () => { S.sweep = false; syncUI(); });
$('#tau').addEventListener('input', e => { S.play = false; S.tau = +e.target.value; syncUI(); });
$('#theme').addEventListener('change', e => { S.theme = e.target.value; save(); applyTheme(); });
$('#lang').addEventListener('change', e => { S.lang = e.target.value; save(); applyLang(); renderCap(); noteShells(); syncUI(); B.sig = ''; });
$('#mode').addEventListener('change', e => setMode(e.target.value));

$('#replay').addEventListener('click', () => { R.reset(); S.loss = true; syncUI(); });
$('#exc').addEventListener('click', () => B.excite());
$('#rel').addEventListener('click', () => B.relax());
$('#resetView').addEventListener('click', resetView);
$('#prev').addEventListener('click', () => showStep(si - 1));
$('#next').addEventListener('click', () => {
  const last = si === STEPS[S.mode].length - 1;
  if (!last) showStep(si + 1); else if (NEXTMODE[S.mode]) setMode(NEXTMODE[S.mode]); else setMode('r');
});
function toggleMenu(open) {
  const m = $('#menu'); m.hidden = open === undefined ? !m.hidden : !open;
  $('#menuBtn').setAttribute('aria-expanded', String(!m.hidden));
}
$('#menuBtn').addEventListener('click', () => toggleMenu());
$('#backBtn').addEventListener('click', leaveAtom);

/* lesson dock: collapsed by default; tap the bar to open, drag it anywhere */
const lessonEl = $('#lesson'), headEl = $('#lessonHead');
function clampDock() {
  const vw = innerWidth, vh = innerHeight, r = lessonEl.getBoundingClientRect();
  lessonEl.style.left = clamp(r.left, 4, Math.max(4, vw - r.width - 4)) + 'px';
  lessonEl.style.bottom = clamp(vh - r.bottom, 4, Math.max(4, vh - r.height - 4)) + 'px';
}
function toggleLesson(open) {
  const willOpen = open === undefined ? $('#lessonBody').hidden : open;
  $('#lessonBody').hidden = !willOpen; lessonEl.classList.toggle('open', willOpen);
  $('#lessonBtn').setAttribute('aria-expanded', String(willOpen));
  clampDock();
}
let drag = null;
headEl.addEventListener('pointerdown', e => {
  const r = lessonEl.getBoundingClientRect();
  drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, left: r.left, bottom: innerHeight - r.bottom, moved: false };
  headEl.setPointerCapture(e.pointerId);
});
headEl.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 8) return;
  drag.moved = true; headEl.classList.add('drag');
  lessonEl.style.left = (drag.left + dx) + 'px'; lessonEl.style.bottom = (drag.bottom - dy) + 'px';
  clampDock();
});
const dragEnd = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const moved = drag.moved; drag = null; headEl.classList.remove('drag');
  if (!moved && e.type === 'pointerup') toggleLesson();
};
headEl.addEventListener('pointerup', dragEnd); headEl.addEventListener('pointercancel', dragEnd);
$('#lessonBtn').addEventListener('click', e => { if (e.detail === 0) toggleLesson(); });
addEventListener('resize', clampDock);
/* full screen starts with everything closed */
document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) { toggleMenu(false); toggleLesson(false); } });
$('#full').addEventListener('click', () => {
  const p = document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen();
  if (p && p.catch) p.catch(() => alert(tr('noFull')));
});
$('#board').addEventListener('click', () => { Object.assign(S, { ui: 1.5, cap: 1.3, lab: 1.5 }); save(); applyScale(); syncUI(); });
$('#reset').addEventListener('click', () => { Object.assign(S, DEF); save(); applyScale(); applyTheme(); applyLang(); syncUI(); renderCap(); B.sig = ''; });
addEventListener('keydown', e => {
  if (e.key === 'Escape') { toggleMenu(false); toggleLesson(false); if (visiting) leaveAtom(); return; }
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') $('#next').click(); else if (e.key === 'ArrowLeft') $('#prev').click();
  else if (e.key === 'm' || e.key === 'M') toggleMenu(); else if (e.key === 'l' || e.key === 'L') toggleLesson();
});

/* main loop */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; clock += dt;
  stars.visible = S.stars; stars.rotation.y += dt * 0.01;
  placeCam(dt); cur().update(dt); updNeighbours(dt); if (visiting) visitStatus(); stepParts(dt); updLabels();
  if (composer && S.bloom) { bloomPass.strength = 0.9 * S.bloomAmt; composer.render(dt); } else renderer.render(scene, cam);
  requestAnimationFrame(frame);
}

/* start */
applyScale(); applyTheme(); applyLang(); resize();
R.build(); B.build();
setMode('r');
requestAnimationFrame(frame);
</script>
</body>
</html>
