<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MolVerse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg0:#0a1424;--bg1:#173556;--pn:rgba(12,24,42,.92);--fg:#e8f0f8;--mu:#97adc6;--bd:#2c4565;--ac:#e0527a;--ac2:#7fd6c2;--hl:#f2c35a;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 36%,var(--bg1),var(--bg0) 62%,#050d19);color:var(--fg);font:14px/1.4 Figtree,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:var(--fg);background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0);display:flex;gap:8px;align-items:center;padding:10px 14px;z-index:3}
#cr{flex:1;font:800 16px Bricolage Grotesque,sans-serif;color:var(--hl);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bk[hidden]{display:none}
#en{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0) + 58px);width:200px;height:100px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;display:none;z-index:2}
.bot{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0) + 12px);display:flex;flex-direction:column;gap:8px;z-index:3;max-width:640px;margin:auto}
#cap{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;font:800 16px Bricolage Grotesque,sans-serif;text-align:center}
#cap b{font-weight:800}#sw{display:none;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--ac);height:30px}
#mt{display:none;height:8px;background:var(--bd);border-radius:6px;overflow:hidden}#mt i{display:block;height:100%;background:var(--hl);width:100%}
#er{position:fixed;left:8px;right:8px;top:60px;background:#5a1a2a;color:#fff;font:12px monospace;padding:6px 8px;border-radius:8px;z-index:9;display:none}
</style></head><body>
<canvas id="c"></canvas><canvas id="en" width="400" height="200"></canvas><div id="er"></div>
<div class="top"><button id="bk" hidden aria-label="Wapas">←</button><span id="cr"></span><button id="cut">Cut</button></div>
<div class="bot"><div id="mt"><i></i></div><div id="sw"><input id="sl" type="range" min="0" max="1000" value="0" aria-label="Control"></div><div id="cap"></div></div>
<script>
const T=THREE,$=s=>document.querySelector(s);
onerror=(m,u,l)=>{const e=$('#er');e.style.display='block';e.textContent='Error: '+m+' (line '+l+')'};
const R=new T.WebGLRenderer({canvas:$('#c'),antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.localClippingEnabled=true;
const S=new T.Scene(),C=new T.PerspectiveCamera(42,1,.1,100),W=new T.Group();S.add(W);
S.add(new T.AmbientLight(0xffffff,.65));const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(3,5,7);S.add(dl);
const plane=new T.Plane(new T.Vector3(0,0,-1),99);
const BL=0x4f8fe8,RD=0xe8504a,TL=0x7fd6c2,AM=0xf2c35a,CC=0x9aa5b4,WH=0xf4f8ff,NU=0xe0527a;
const SPH=new T.SphereGeometry(1,28,20),Z=new T.Vector3(0,0,1),Y=new T.Vector3(0,1,0);
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ss=(a,b,x)=>{x=cl((x-a)/(b-a));return x*x*(3-2*x)};
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
let G=null,U=()=>{},pick=[],cur='',stack=[],auto=true,sv=0,rx=.3,ry=.5,rad=9,tm=0,CAPF=()=>'';
const mat=(c,o)=>new T.MeshStandardMaterial({color:c,transparent:true,opacity:o,roughness:.35,side:T.DoubleSide,depthWrite:false,clippingPlanes:[plane]});
const mesh=(geo,c,o,p,s,go,solid)=>{const m=new T.Mesh(geo,mat(c,o));m.position.set(p[0],p[1],p[2]);if(s)m.scale.set(s[0],s[1],s[2]);if(solid)m.material.depthWrite=true;m.userData={bo:o,go:go||''};if(go){m.material.emissive.setHex(0x1a2f4a);pick.push(m)}G.add(m);return m};
const atom=(c,p,r,go)=>mesh(SPH,c,1,p,[r,r,r],go,1);
const lobe=(c,cen,dir,len,w,o,go)=>{const d=new T.Vector3(...dir).normalize(),m=mesh(SPH,c,o,[cen[0]+d.x*len,cen[1]+d.y*len,cen[2]+d.z*len],[w,w,len],go);m.quaternion.setFromUnitVectors(Z,d);return m};
const tube=(a,b,r,c,o)=>{const A=new T.Vector3(...a),B=new T.Vector3(...b),d=B.clone().sub(A),m=mesh(new T.CylinderGeometry(r,r,d.length(),10),c,o||1,[0,0,0],null,'',o?0:1);m.position.copy(A.add(B).multiplyScalar(.5));m.quaternion.setFromUnitVectors(Y,d.normalize());return m};
const setO=(a,k)=>a.forEach(m=>{m.material.opacity=m.userData.bo*k;m.visible=k>.02});
const grp=f=>{const g=new T.Group(),o=G;G.add(g);G=g;f();G=o;return g};
const dots=(spec,col)=>{const Bs=[];spec.forEach(s=>{for(let i=0;i<s[6];i++){const g=()=>(rnd()+rnd()+rnd()-1.5)*.9;Bs.push([s[0]+g()*s[3],s[1]+g()*s[4],s[2]+g()*s[5]])}});
 const a=new Float32Array(Bs.length*3),geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(a,3));
 const p=new T.Points(geo,new T.PointsMaterial({color:col||0xffffff,size:.06,transparent:true,opacity:.85,clippingPlanes:[plane]}));G.add(p);
 const f=t=>{for(let i=0;i<Bs.length;i++){const b=Bs[i];a[i*3]=b[0]+.04*Math.sin(t*4+i);a[i*3+1]=b[1]+.04*Math.sin(t*5+i*2);a[i*3+2]=b[2]+.04*Math.sin(t*3+i*3)}geo.attributes.position.needsUpdate=true};f.p=p;f(0);return f};
const sg=c=>`<span style="color:${c}">●</span>`,SGc='#7fd6c2',PIc='#f2c35a';
const NAME={mol:'Ethene (C₂H₄)',atom:'Carbon atom',ch:'C–H bond',cc:'C=C double bond',sigma:'σ bond',pi:'π bond'};
const B={};
/* L0: whole molecule */
B.mol=()=>{rad=9;rx=.35;let ds=[];
 [-1,1].forEach(s=>{atom(CC,[s*.9,0,0],.3,'atom');[.866,-.866].forEach(y=>{const d=[s*.5,y,0],h=[s*.9+d[0]*1.7,y*1.7,0];tube([s*.9,0,0],h,.04,0x556070);atom(WH,h,.2,'ch');lobe(TL,[s*.9,0,0],d,.85,.3,.35,'ch');ds.push([s*.9+d[0]*.85,y*.85,0,.3,.3,.3,16])})});
 mesh(SPH,TL,.4,[0,0,0],[1,.35,.35],'cc');[.75,-.75].forEach(z=>{mesh(SPH,AM,.4,[0,0,z],[1.5,.42,.5],'cc');ds.push([0,0,z,1.3,.3,.35,40])});ds.push([0,0,0,.9,.25,.25,50]);
 const f=dots(ds);U=()=>f(tm);CAPF=()=>'Kisi bhi hisse par tap karo'};
/* L1: carbon atom, hybridization */
B.atom=()=>{rad=7;rx=.4;atom(NU,[0,0,0],.26);mesh(SPH,0x9fb4d0,.2,[0,0,0],[.5,.5,.5]);
 const s2=[mesh(SPH,AM,.35,[0,0,0],[.9,.9,.9])],pp=[],hy=[],es=[];
 [[1,0,0],[0,1,0]].forEach(v=>{s2.push(lobe(BL,[0,0,0],v,.95,.34,.5),lobe(RD,[0,0,0],v.map(q=>-q),.95,.34,.5))});
 const pz=[lobe(BL,[0,0,0],[0,0,1],.95,.34,.55,'pi'),lobe(RD,[0,0,0],[0,0,-1],.95,.34,.55,'pi')];
 [90,210,330].forEach(a=>{const d=[Math.cos(a*Math.PI/180),Math.sin(a*Math.PI/180),0];hy.push(lobe(TL,[0,0,0],d,1,.45,.65,'sigma'));es.push(mesh(new T.SphereGeometry(.08,10,8),0xffffff,1,d.map(q=>q*1.1),null,'',1))});
 es.push(mesh(new T.SphereGeometry(.08,10,8),0xffffff,1,[0,0,1.1],null,'',1));
 U=()=>{const k=.5-.5*Math.cos(tm*.5),m=ss(.15,.6,k);setO(s2,1-m);setO(hy,m);setO(es,ss(.65,.85,k))};
 CAPF=()=>{const k=.5-.5*Math.cos(tm*.5);return k<.15?'s + p':ss(.15,.6,k)<.9?'s + p → mix':sg(SGc)+' 3 sp²  '+sg(RD)+sg(BL)+' 1 p'}};
/* L1: C–H head-on overlap */
B.ch=()=>{rad=7;rx=.3;const cx=-.8;atom(NU,[cx,0,0],.26);const lb=lobe(TL,[cx,0,0],[1,0,0],1,.5,.6,'sigma');
 [[-.5,.866],[-.5,-.866]].forEach(d=>lobe(TL,[cx,0,0],[d[0],d[1],0],1,.4,.2));
 const h=atom(WH,[3,0,0],.2,'sigma'),hc=mesh(SPH,BL,.3,[3,0,0],[.55,.55,.55],'sigma'),ov=mesh(SPH,AM,.6,[0,0,0],[.6,.3,.3],'sigma'),f=dots([[.05,0,0,.5,.2,.2,70]]);
 U=()=>{const k=.5-.5*Math.cos(tm*.6),a=ss(0,.75,k);h.position.x=hc.position.x=3.4-2.7*a;ov.position.x=(h.position.x+cx)/2+.35;setO([ov],ss(.5,.9,k));f.p.material.opacity=ss(.55,.9,k);f(tm)};CAPF=()=>'head-on overlap '+sg(SGc)+' σ'};
/* L1: C=C, sigma + pi apart */
B.cc=()=>{rad=8;rx=.3;[-1,1].forEach(s=>{atom(CC,[s*.9,0,0],.3);[.866,-.866].forEach(y=>{const d=[s*.5,y,0],h=[s*.9+d[0]*1.7,y*1.7,0];tube([s*.9,0,0],h,.04,0x556070,.35);atom(WH,h,.2).material.opacity=.35})});
 mesh(SPH,TL,.5,[0,0,0],[1.1,.4,.4],'sigma');const pi=[1,-1].map(z=>mesh(SPH,AM,.55,[0,0,z*.7],[1.6,.42,.5],'pi')),f=dots([[0,0,0,1,.25,.25,50]]);
 U=()=>{const e=ss(.2,.8,.5-.5*Math.cos(tm*.7));pi[0].position.z=.6+1.4*e;pi[1].position.z=-.6-1.4*e;f(tm)};CAPF=()=>sg(SGc)+' σ   +   '+sg(PIc)+' π'};
/* L2: sigma overlap + energy */
let ECV=null;
B.sigma=()=>{rad=8;rx=.25;const a=atom(WH,[0,0,0],.16,''),b=atom(WH,[0,0,0],.16,''),ca=mesh(SPH,BL,.2,[0,0,0],[1.1,1.1,1.1]),cb=mesh(SPH,BL,.2,[0,0,0],[1.1,1.1,1.1]),bc=mesh(SPH,AM,.3,[0,0,0],[1,.55,.55]);
 const N=520,P=new Float32Array(N*3),Q=[],g3=()=>(rnd()+rnd()+rnd()-1.5)*.9;for(let i=0;i<N;i++)Q.push([g3(),g3(),g3(),i%2?1:-1]);
 const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(P,3));G.add(new T.Points(geo,new T.PointsMaterial({color:0xffffff,size:.07,transparent:true,opacity:.9,clippingPlanes:[plane]})));
 ECV=$('#en').getContext('2d');$('#en').style.display='block';SW(1);let d=3;
 U=()=>{d=3.2-2.7*sv;const h=d*.8,bd=cl((2.3-d)/1.4),pl=.7*bd;a.position.x=ca.position.x=-h;b.position.x=cb.position.x=h;
  for(let i=0;i<N;i++){const q=Q[i],k=1-.3*bd;P[i*3]=q[3]*h*(1-pl)+q[0]*(1-.25*bd)+.03*Math.sin(tm*4+i);P[i*3+1]=q[1]*k+.03*Math.sin(tm*5+i*2);P[i*3+2]=q[2]*k}
  geo.attributes.position.needsUpdate=true;bc.scale.x=Math.max(.2,h*.5+.5);setO([bc],bd);
  const x=ECV,w=400,hh=200;x.clearRect(0,0,w,hh);x.strokeStyle='#2c4565';x.lineWidth=2;x.beginPath();x.moveTo(20,30);x.lineTo(20,170);x.lineTo(380,170);x.stroke();
  const E=v=>(1-Math.exp(-2.2*(v-.74)))**2-1,X=v=>20+(v-.5)/2.7*350,Yy=v=>30+(.3-E(v))/1.3*140;x.strokeStyle='#7fd6c2';x.beginPath();for(let v=.5;v<=3.2;v+=.03){v<.51?x.moveTo(X(v),Yy(v)):x.lineTo(X(v),Yy(v))}x.stroke();
  x.fillStyle='#e0527a';x.beginPath();x.arc(X(d),Yy(d),9,0,6.3);x.fill();x.fillStyle='#97adc6';x.font='20px sans-serif';x.fillText('Energy ↓',28,26)};
 CAPF=()=>d>2.4?'door: koi asar nahi':d>1.2?'kheench: energy gir rahi':d>.6?sg(AM)+' BOND: sabse kam energy':'bahut paas: dhakka'};
/* L2: pi overlap + twist */
B.pi=()=>{rad=8;rx=.35;SW(1);$('#mt').style.display='block';
 const L=grp(()=>{atom(CC,[0,0,0],.3);lobe(BL,[0,0,0],[0,0,1],.95,.34,.6);lobe(RD,[0,0,0],[0,0,-1],.95,.34,.6)}),Rg=grp(()=>{atom(CC,[0,0,0],.3);lobe(BL,[0,0,0],[0,0,1],.95,.34,.6);lobe(RD,[0,0,0],[0,0,-1],.95,.34,.6)});
 L.position.x=-.9;Rg.position.x=.9;tube([-.9,0,0],[.9,0,0],.06,TL);
 const pi=[1,-1].map(z=>mesh(SPH,AM,.6,[0,0,z*.8],[1.7,.42,.5]));let f=0;
 U=()=>{const ph=sv*Math.PI/2;Rg.rotation.x=ph;f=Math.cos(ph);setO(pi,Math.max(0,f));$('#mt i').style.width=Math.max(0,f)*100+'%'};
 CAPF=()=>f>.85?sg(PIc)+' π bond: side-on overlap':f>.3?'ghoomaya: overlap kam':'π toot gaya (isliye C=C ghoom nahi sakta)'};
function SW(on){$('#sw').style.display=on?'flex':'none'}
/* navigation */
function load(k){cur=k;while(W.children.length)W.remove(W.children[0]);G=new T.Group();W.add(G);pick=[];U=()=>{};CAPF=()=>'';auto=true;sv=0;
 $('#en').style.display='none';$('#mt').style.display='none';SW(0);$('#sl').value=0;ry=.5;B[k]();
 $('#bk').hidden=!stack.length;$('#cr').textContent=stack.concat(k).map(s=>NAME[s]).join(' › ')}
function open(k){stack.push(cur);load(k)}
$('#bk').onclick=()=>{if(stack.length)load(stack.pop())};
$('#sl').oninput=e=>{auto=false;sv=e.target.value/1000};
$('#cut').onclick=e=>{const on=plane.constant>50;plane.constant=on?0:99;e.currentTarget.classList.toggle('on',on)};
/* input */
const cv=$('#c'),PT=new Map(),RC=new T.Raycaster();let mv=0,t0=0,pd=0;
const dist=()=>{const a=[...PT.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);PT.set(e.pointerId,[e.clientX,e.clientY]);mv=0;t0=Date.now();if(PT.size===2)pd=dist()};
cv.onpointermove=e=>{const p=PT.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;mv+=Math.abs(dx)+Math.abs(dy);
 if(PT.size===1){ry+=dx*.008;rx=cl(rx+dy*.008,-1.4,1.4)}else if(PT.size===2){const d=dist();rad=cl(rad*pd/d,3,20);pd=d}};
cv.onpointerup=cv.onpointercancel=e=>{if(e.type==='pointerup'&&PT.size===1&&mv<8&&Date.now()-t0<450){const r=cv.getBoundingClientRect();RC.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),C);
  const h=RC.intersectObjects(pick.filter(m=>m.visible&&m.material.opacity>.05),false);if(h.length)open(h[0].object.userData.go)}PT.delete(e.pointerId)};
cv.addEventListener('wheel',e=>{e.preventDefault();rad=cl(rad*(1+e.deltaY*.001),3,20)},{passive:false});
function rs(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const clk=new T.Clock();let lc='';
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);tm+=dt;
 if(auto)sv=.5-.5*Math.cos(tm*.6);else if(!PT.size){}
 if(cur==='mol'&&!PT.size)ry+=dt*.15;
 const s=.55+.45*Math.sin(tm*3);pick.forEach(m=>{m.material.emissiveIntensity=s});
 U();W.rotation.set(rx,ry,0);C.position.set(0,0,rad);C.lookAt(0,-rad*.08,0);
 const c=CAPF();if(c!==lc){lc=c;$('#cap').innerHTML=c}
 if(auto&&$('#sw').style.display==='flex')$('#sl').value=sv*1000;R.render(S,C)}
load('mol');loop();
</script></body></html>
