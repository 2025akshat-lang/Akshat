const $=s=>document.querySelector(s),T=(a,b)=>`${a} (${b})`,el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};

function build(){

 for(let i=0;i<LN;i++)for(let j=0;j<LM;j++)for(let k=0;k<LM;k++)nuc.push([(i-(LN-1)/2)*sx,(j-(LM-1)/2)*sy,(k-(LM-1)/2)*sy]);

 sc.add(nucM,cloudM,thE);
 while(egrp.children.length)egrp.remove(egrp.children[0]);eg=[];
 if(atom)for(let i=0;i<P.ne;i++){const g=new THREE.Group(),r=1.3+i*.28;g.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  const ring=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([...Array(64)].map((_,q)=>new THREE.Vector3(r*Math.cos(q/64*6.283),0,r*Math.sin(q/64*6.283)))),new THREE.LineBasicMaterial({color:0x66ccff,transparent:true,opacity:.25}));
  const e=new THREE.Mesh(sph,new THREE.MeshBasicMaterial({color:0x66ccff}));e.scale.setScalar(.13);g.add(ring,e);egrp.add(g);eg.push({e,r,w:1.6/Math.sqrt(r),a:Math.random()*6})}
 sizes()}
function sizes(){const atom=F.mode=='atom',cs=F.thom?.9:atom?3.2:.95,per=atom?P.ne:4;
 nuc.forEach((n,i)=>{o3.position.set(...n);o3.scale.setScalar(F.thom?1e-4:P.rn);o3.updateMatrix();nucM.setMatrixAt(i,o3.matrix);
  o3.scale.setScalar(cs);o3.updateMatrix();cloudM.setMatrixAt(i,o3.matrix);
  for(let q=0;q<per;q++){const o=thO[i*per+q],k=cs/.9*(F.thom?.9:1);o3.position.set(n[0]+o[0]*cs,n[1]+o[1]*cs,n[2]+o[2]*cs);o3.scale.setScalar(atom?.14:.09);o3.updateMatrix();thE.setMatrixAt(i*per+q,o3.matrix)}});
 nucM.instanceMatrix.needsUpdate=cloudM.instanceMatrix.needsUpdate=thE.instanceMatrix.needsUpdate=true;
 thE.visible=!!F.thom;egrp.visible=!F.thom;

// ---- α-कण, ग्लो, पथ, चमक ----
const pool=[...Array(MAXP)].map(()=>({on:0,x:0,y:0,z:0,vx:0,vy:0,vz:0,tr:[],mr:9}));
const heads=new THREE.InstancedMesh(sph,new THREE.MeshBasicMaterial({color:0xffffff}),MAXP);
const glow=new THREE.InstancedMesh(sph,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}),MAXP);
heads.frustumCulled=glow.frustumCulled=false;sc.add(heads,glow);
const tp=new Float32Array(MAXP*TL*6),tc=new Float32Array(MAXP*TL*6),tgeo=new THREE.BufferGeometry();

const tl=new THREE.LineSegments(tgeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.85}));tl.frustumCulled=false;sc.add(tl);
const fcv=document.createElement('canvas');fcv.width=fcv.height=64;{const g=fcv.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.3,'#9ff');r.addColorStop(1,'#0000');g.fillStyle=r;g.fillRect(0,0,64,64)}

const fl=[...Array(40)].map(()=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:ftex,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));s.visible=false;s.life=0;sc.add(s);return s});
function flash(p){if(!F.zns)return;const s=fl.find(q=>q.life<=0);if(!s)return;const l=Math.hypot(p.x,p.y,p.z);s.position.set(p.x/l*24,p.y/l*24,p.z/l*24);s.life=1;s.visible=true}
const st={tot:0,s:0,d:0,bk:0};let sp=0,pts=[],tt=0,mm=9;
function spawn(){const p=pool.find(q=>!q.on);if(!p)return;const v0=Math.sqrt(3.2*P.E);
 p.on=1;p.tr=[];p.mr=9;p.vx=v0;p.vy=p.vz=0;p.x=-18;
 if(F.mode=='atom'){p.y=P.b;p.z=0}else{const r=P.w*Math.sqrt(Math.random()),a=Math.random()*6.283;p.y=r*Math.cos(a);p.z=r*Math.sin(a)}}
function acc(p){let ax=0,ay=0,az=0;const eps=F.thom?.9:.03,Zk=K*P.Z;
 const i0=Math.round(p.x/sx+(LN-1)/2),j0=Math.round(p.y/sy+(LM-1)/2),k0=Math.round(p.z/sy+(LM-1)/2);
 for(let i=i0-1;i<=i0+1;i++){if(i<0||i>=LN)continue;for(let j=j0-1;j<=j0+1;j++){if(j<0||j>=LM)continue;for(let k=k0-1;k<=k0+1;k++){if(k<0||k>=LM)continue;
  const n=nuc[(i*LM+j)*LM+k],dx=p.x-n[0],dy=p.y-n[1],dz=p.z-n[2],r2=dx*dx+dy*dy+dz*dz;if(r2>5)continue;if(r2<mm)mm=r2;

function step(dt){

   if(a>90){st.bk++;if(F.toast&&performance.now()>tt){tt=performance.now()+4000;toast('कण वापस क्यों आया? क्योंकि दोनों पर धनावेश है (Rebound)! — Why did the particle bounce back? Both carry positive charge!')}}else a>10?st.d++:st.s++;
   pts.push([p.mr,a]);if(pts.length>300)pts.shift();flash(p)}}
 for(const p of pool)if(!p.on&&p.tr.length)p.tr.shift();
 eg.forEach(q=>{q.a+=q.w*dt;q.e.position.set(q.r*Math.cos(q.a),0,q.r*Math.sin(q.a))})}
function draw(){
 pool.forEach((p,i)=>{if(p.on){o3.position.set(p.x,p.y,p.z);o3.scale.setScalar(.22)}else{o3.position.set(0,0,0);o3.scale.setScalar(1e-4)}o3.updateMatrix();heads.setMatrixAt(i,o3.matrix);
  if(p.on){o3.scale.setScalar(.6);o3.updateMatrix()}glow.setMatrixAt(i,o3.matrix);
