}
*{box-sizing:border-box}

<div class="plate" id="plate">

<script>
'use strict';
(()=>{
const D2R=Math.PI/180,GZ=-7.1,LEN=36.4,TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const prof=x=>{let f=1,zc=0;
  if(x>27){const t=(x-27)/(LEN-27);f=Math.sqrt(Math.max(0,1-t*t));zc=-t*t*1.5}
  else if(x<-18){const t=(-18-x)/(LEN-18);f=1-.9*Math.pow(t,1.5);zc=t*t*3.2}
  return{f:Math.max(f,.03),zc}};
const hwAt=(x,z)=>{const{f,zc}=prof(x);const c=clamp((z-zc)/((z>zc?4.2:3.9)*f),-.999,.999);return 3.57*f*Math.pow(1-c*c,.425)};
const secPt=(x,th)=>{const{f,zc}=prof(x);const s=Math.sin(th),c=Math.cos(th);
  return[x,3.57*f*Math.pow(Math.abs(s),.85)*Math.sign(s),zc+(c>0?4.2:3.9)*f*c]};
const cen=pts=>{const n=pts.length;return[0,1,2].map(i=>pts.reduce((a,p)=>a+p[i],0)/n)};


const STA=[-36.4,-34,-30.5,-27,-23,-19,-15,-10.5,-6,-1.5,3,8,13,18,22,25,27.5,29.5,31.2,32.8,34.2,35.4,36.4];
const NS=16,SKIN=[],WINS=[],INT=[];
for(let i=0;i<STA.length-1;i++)for(let j=0;j<NS;j++){
  const t0=j*TAU/NS,t1=(j+1)*TAU/NS;
  const a=secPt(STA[i],t0),b=secPt(STA[i],t1),c=secPt(STA[i+1],t1),d=secPt(STA[i+1],t0);
  const mx=(STA[i]+STA[i+1])/2;let h=216,s=9,l=22;
  if(j>=6&&j<=9)l=13;else if(j===15||j===0)l=26;
  if(j===4||j===11){h=203;s=42;l=28}
  const p=[a,b,c,d],cc=cen(p);
  SKIN.push({p,r:[mx,0,prof(mx).zc],h,s,l,part:'Fuselage',cull:true,cx:cc[0],cz:cc[2],skin:true});
}
function surfQuad(x0,x1,z0,z1,side,off){return[[x0,z0],[x1,z0],[x1,z1],[x0,z1]].map(([x,z])=>[x,side*(hwAt(x,z)+off),z])}
function addWin(x0,x1,z0,z1,side,part,kind,bias,h,s,l){
  const p=surfQuad(x0,x1,z0,z1,side,.1),mx=(x0+x1)/2;
  WINS.push({p,r:[mx,0,(z0+z1)/2>0?0:0],h:h||210,s:s||20,l:l||10,part,cull:true,kind,bias:bias||-2,cx:mx,cz:(z0+z1)/2});
}
const MAIN_DOORS=[25,15,-9,-23],UP_DOORS=[19,-15];
for(const side of[-1,1]){
  for(let x=-28;x<=27.5;x+=1.3){if(MAIN_DOORS.some(d=>Math.abs(x-d)<1.1))continue;addWin(x,x+.55,.75,1.25,side,'Fuselage','win')}
  for(let x=-19;x<=21;x+=1.3){if(UP_DOORS.some(d=>Math.abs(x-d)<1))continue;addWin(x,x+.55,2.95,3.4,side,'Fuselage','win')}
  addWin(31.2,32.5,1.1,1.95,side,'Cockpit','cock',-2.5);
  addWin(33.6,34.8,.95,1.7,side,'Cockpit','cock',-2.5);
  addWin(-16,-14,-3.4,-2,side,'Cargo door','cargo',-1.5,215,10,17);
  addWin(17,19.4,-3.4,-2,side,'Cargo door','cargo',-1.5,215,10,17);
}

const ENGY=[-29.9,-12.7,12.7,29.9],ENG=[],NACC=[];
const wxle=y=>7-(y-3.4)*.6,wz=y=>-2.2+.075*(y-3.4),wt=y=>Math.max(.4,1.7-(y-3.4)*.036);
const wxte=y=>y<=14?-10.5-(y-3.4)*(8.5/10.6):-19+(y-14)*(.5/25.9);
ENGY.forEach((y,i)=>{
  const ay=Math.abs(y),xin=wxle(ay)+4,zc=wz(ay)-3.0;
  const XI=[0,.6,2,4.5,7,9,10.5,11.8],RR=[1.62,1.86,1.9,1.76,1.5,1.25,.85,.15],NSEG=8,name='Engine '+(i+1);
  NACC.push({x:xin,y,z:zc,name});
  for(let k=0;k<XI.length-1;k++)for(let j=0;j<NSEG;j++){
    const a0=j*TAU/NSEG,a1=(j+1)*TAU/NSEG;
    const P=(kk,a)=>[xin-XI[kk],y+RR[kk]*Math.sin(a),zc+RR[kk]*Math.cos(a)];
    const p=[P(k,a0),P(k,a1),P(k+1,a1),P(k+1,a0)],mid=xin-(XI[k]+XI[k+1])/2;
    ENG.push({p,r:[mid,y,zc],h:215,s:6,l:k===0?32:(k>=5?15:24),part:name,cull:true,eng:i,cx:mid,cz:zc});
  }
  const ya=y;
  ENG.push({p:[[xin-1.5,ya,zc+1.75],[xin-8,ya,zc+1.5],[xin-7,ya,wz(ay)-.1],[xin-1.5,ya,wz(ay)-.05]],r:null,h:215,s:6,l:18,part:name,cull:false,pylon:true});
});

const FLOORS=[{z:-.7,x0:-27,x1:26},{z:2.6,x0:-19,x1:21}];
for(const F of FLOORS){
  const L=[],R=[];for(let x=F.x0;x<=F.x1;x+=2){const w=hwAt(x,F.z)-.12;L.push([x,-w,F.z]);R.push([x,w,F.z])}
  INT.push({p:L.concat(R.reverse()),r:null,h:218,s:16,l:15,part:'Cabin',cull:false,floor:true,cx:(F.x0+F.x1)/2,cz:F.z,bias:2,cfloor:true});
}
const CLS={f:[38,55,44],b:[198,48,38],e:[222,16,34]};
function rows(xs,z,blocks,cls){
  for(const x of xs){const hw=hwAt(x,z+.4)-.3,k=Math.min(1,hw/Math.max(...blocks.flat().map(Math.abs)));
    if(hw<1.2)continue;
    for(const[b0,b1]of blocks){INT.push({p:[[x-.3,b0*k,z+.55],[x+.25,b0*k,z+.55],[x+.25,b1*k,z+.55],[x-.3,b1*k,z+.55]],r:null,h:CLS[cls][0],s:CLS[cls][1],l:CLS[cls][2],part:'Cabin',cull:false,seat:true,cx:x,cz:z,bias:-.5})}}
}
const seq=(a,b,s)=>{const o=[];for(let x=a;x>=b;x-=s)o.push(x);return o};
rows(seq(21,8,1.25),-.7,[[-3.1,-2.1],[-.75,.75],[2.1,3.1]],'b');
rows(seq(6,-25,.95),-.7,[[-3.2,-1.7],[-.95,.95],[1.7,3.2]],'e');
rows(seq(17,11,2.2),2.6,[[-2.2,-1.4],[-.5,.5],[1.4,2.2]],'f');
rows(seq(8,-6,1.3),2.6,[[-2.3,-1.2],[-.55,.55],[1.2,2.3]],'b');
rows(seq(-8,-17,.95),2.6,[[-2.3,-1.3],[-1,1],[1.3,2.3]],'e');
for(let x=-30;x<=26;x+=3){const pts=[];for(let j=0;j<24;j++)pts.push(secPt(x,j*TAU/24));
  INT.push({p:pts,r:null,line:true,part:null,cx:x,cz:0,bias:3,ring:true})}

function mesh(sts,us,tf,map,mod,tagf,out,colf,dv){
  const R=sts.map(st=>{const ch=st.xle-st.xte;return us.map((u,k)=>{
    const[dxT,dhT]=mod(st,u,ch,true),[dxB,dhB]=mod(st,u,ch,false),x0=st.xle-ch*u,th=st.t*tf[k];
    return{t:map(st,x0+dxT,th*.55+dhT),b:map(st,x0+dxB,-th*.45+dhB)}})});
  for(let i=0;i<sts.length-1;i++)for(let k=0;k<us.length-1;k++)for(const top of[true,false]){
    const key=top?'t':'b',a=R[i][k][key],b=R[i+1][k][key],c=R[i+1][k+1][key],d=R[i][k+1][key],cc=cen([a,b,c,d]),sg=top?-1:1;
    const tag=tagf(sts[i],sts[i+1],us[k],us[k+1],top),col=colf(tag,top);
    out.push({p:[a,b,c,d],r:[cc[0]+dv[0]*sg,cc[1]+dv[1]*sg,cc[2]+dv[2]*sg],h:col[0],s:col[1],l:col[2],part:tag,cull:false});
  }
}
const WY=[3.4,8,14,20,26,32,36,39.9];
const WSTA=WY.map(y=>({s:y,xle:wxle(y),xte:wxte(y),z:wz(y),t:wt(y)}));
const WU=[0,.1,.4,.7,.85,1],WTF=[.05,.8,1,.75,.4,.03];
const SSTA=[1.5,8.5,15.2].map(y=>({s:y,xle:-26-(y-1.5)*.73,xte:-34-(y-1.5)*.29,z:1.8+(y-1.5)*.05,t:.55-(y-1.5)*.025}));
const SU=[0,.12,.45,.65,.82,1],STF=[.05,.8,1,.8,.45,.03];
const FSTA=[2.2,6,10,14,17].map(s=>({s,xle:-22.5-(s-2.2)*.95,xte:-35.5-(s-2.2)*.3,z:0,t:.9-(s-2.2)*.04}));
const FU=[0,.12,.45,.7,.85,1],FTF=[.05,.8,1,.7,.35,.03];
window.A380={D2R,GZ,LEN,TAU,clamp,lerp,prof,hwAt,secPt,cen,SKIN,WINS,ENG,NACC,INT,mesh,WSTA,WU,WTF,SSTA,SU,STF,FSTA,FU,FTF,wxle,wxte,wz,wt,MAIN_DOORS,UP_DOORS,ENGY};
})();
'use strict';
(()=>{
const A=window.A380,{clamp,lerp,D2R}=A;
const PH=[
 {k:'1',n:'Gate',label:'At the gate',spd:0,alt:0},
 {k:'2',n:'Push & start',label:'Pushback and start',spd:0,alt:0},
 {k:'3',n:'Taxi',label:'Taxiing',spd:16,alt:0},
 {k:'4',n:'Line-up',label:'Lined up on the runway',spd:0,alt:0},
 {k:'5',n:'Take-off',label:'Take-off roll',spd:175,alt:900},
 {k:'6',n:'Climb',label:'Climbing',spd:250,alt:6500},
 {k:'7',n:'10,000 ft',label:'Level at 10,000 ft',spd:290,alt:10000}];
const CONF_DEG=[0,8,16,25,35],CONF_NAME=['0','1','2','3','FULL'];
const S={ph:0,t:0,spd:0,alt:0,pitch:0,lift:0,flex:0,n1:[0,0,0,0],fan:[0,0,0,0],flapDeg:0,flapOvr:null,
 gear:1,gearOvr:null,door:.9,doorT:1,doorMan:false,cut:0,cutT:0,cabin:.8,spoil:0,spoilT:0,ail:0,elev:0,rud:0,ctrlT:-1,
 yaw:-.6,el:.55,zoom:1,inspect:false,sel:null,hover:null,dist:0,tug:16,br:1,rwy:0,lightOvr:{},engOvr:null,msg:'',msgT:0,clock:0};
const AUTO={
 strobe:()=>S.ph>=3,beacon:()=>S.ph>=1,scan:()=>S.ph===1,nav:()=>true,logo:()=>true,
 turnoff:()=>S.ph>=3&&S.ph<=5,land:()=>S.ph>=3&&S.ph<=5,
 nose:()=>S.gear<.3?0:(S.ph===2?1:(S.ph===3||S.ph===4?2:0))};
function lightOn(n){const o=S.lightOvr[n];return o!==undefined?o:AUTO[n]()}
function toggleLight(n){
  const cur=lightOn(n),mod=n==='nose'?3:2;let nv=n==='nose'?(cur+1)%3:!cur;
  const auto=AUTO[n]();if(nv===auto)delete S.lightOvr[n];else S.lightOvr[n]=nv;
}
function flash(msg){S.msg=msg;S.msgT=2.4}
function setPhase(n){
  S.ph=n;S.t=0;S.flapOvr=null;S.gearOvr=null;S.engOvr=null;S.lightOvr={};S.doorMan=false;S.doorT=n===0?1:0;
  if(n===2)S.ctrlT=0;
}
function conf(){if(S.flapOvr!==null)return S.flapOvr;
  return[0,0,1,2,2,S.alt>1500?0:1,0][S.ph]}
function step(dt){
  S.t+=dt;S.clock+=dt;const P=PH[S.ph],air=S.alt>20;
  
  let tS=P.spd;if(S.ph===1)tS=S.t>1.5?-3:0;if(S.ph<=3&&air)tS=140;
  const acc=S.ph===4?26:14;S.spd+=clamp(tS-S.spd,-acc*dt,acc*dt);
  S.dist+=S.spd*.514*dt*.8;
  
  for(let k=0;k<4;k++){

'use strict';
(()=>{
