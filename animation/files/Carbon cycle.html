<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile 3D Carbon Cycle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      overflow: hidden;
      touch-action: none;
    }
    #simCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Compact Top Banner for Mobile */
    #step-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid #38bdf8;
      padding: 8px 14px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    #step-banner h2 {
      font-size: 0.95rem;
      color: #38bdf8;
      margin-bottom: 2px;
    }
    #step-banner p {
      font-size: 0.75rem;
      color: #cbd5e1;
      line-height: 1.2;
    }

    /* Horizontal Scrollable Bottom Buttons for Small Screens */
    .controls-wrapper {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 10px;
      z-index: 10;
    }
    .controls-bar {
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.9);
      padding: 6px 10px;
      border-radius: 30px;
      border: 1px solid #334155;
      overflow-x: auto;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
    }
    .controls-bar::-webkit-scrollbar { display: none; }
    
    .step-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .step-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body>

  <!-- Top Info Box -->
  <div id="step-banner">
    <h2 id="step-title">☁️ 1. CO₂ in Atmosphere</h2>
    <p id="step-desc">Carbon dioxide floats in the sky all around us.</p>
  </div>

  <!-- Main Canvas for 3D View -->
  <canvas id="simCanvas"></canvas>

  <!-- Bottom Buttons -->
  <div class="controls-wrapper">
    <div class="controls-bar">
      <button class="step-btn active" onclick="setStep(0)">☁️ Air</button>
      <button class="step-btn" onclick="setStep(1)">🌱 Trees</button>
      <button class="step-btn" onclick="setStep(2)">🐄 Animals</button>
      <button class="step-btn" onclick="setStep(3)">🏭 Factory</button>
      <button class="step-btn" onclick="setStep(4)">🌊 Ocean</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Step Data
    const steps = [
      {
        title: "☁️ Step 1: Atmosphere CO₂",
        desc: "Carbon dioxide gas is stored naturally in the earth's atmosphere.",
        focus: "sky"
      },
      {
        title: "🌱 Step 2: Photosynthesis (Trees)",
        desc: "Green plants absorb CO₂ from air to produce food & clean Oxygen!",
        focus: "tree"
      },
      {
        title: "🐄 Step 3: Respiration (Animals)",
        desc: "Animals eat plants and breathe out CO₂ gas back into the air.",
        focus: "animal"
      },
      {
        title: "🏭 Step 4: Factory Combustion",
        desc: "Burning fossil fuels in factories releases massive amounts of CO₂.",
        focus: "factory"
      },
      {
        title: "🌊 Step 5: Ocean Absorption",
        desc: "Oceans absorb excess CO₂ from air where sea plankton use it.",
        focus: "ocean"
      }
    ];

    let currentStep = 0;

    function setStep(idx) {
      currentStep = idx;
      document.getElementById('step-title').innerText = steps[idx].title;
      document.getElementById('step-desc').innerText = steps[idx].desc;

      const btns = document.querySelectorAll('.step-btn');
      btns.forEach((btn, i) => {
        if(i === idx) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    // Particles Setup
    const particles = [];
    for(let i=0; i<40; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight * 0.5 + 50,
        r: Math.random() * 3 + 2,
        speedY: Math.random() * 1 + 0.5,
        speedX: (Math.random() - 0.5) * 1.5
      });
    }

    let time = 0;

    // Main Draw Function
    function draw() {
      time += 0.03;
      const w = canvas.width;
      const h = canvas.height;

      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.7);
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h * 0.7);

      // Sun
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.arc(w * 0.15, h * 0.15, 25, 0, Math.PI * 2);
      ctx.fill();

      // Land Green Hill
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.ellipse(w * 0.3, h * 0.75, w * 0.45, h * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();

      // Underground Layer
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, h * 0.75, w * 0.65, h * 0.25);

      // Ocean Water
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(w * 0.6, h * 0.65, w * 0.4, h * 0.35);

      // Water Waves Effect
      ctx.fillStyle = '#38bdf8';
      for(let x = w * 0.6; x < w; x += 30) {
        let waveY = h * 0.65 + Math.sin(time + x) * 3;
        ctx.beginPath();
        ctx.arc(x, waveY, 10, 0, Math.PI);
        ctx.fill();
      }

      // --- DRAW 3D-STYLE OBJECTS ---
      // 1. Factory
      let facX = w * 0.12;
      let facY = h * 0.62;
      ctx.fillStyle = '#475569';
      ctx.fillRect(facX, facY, 45, 35); // main building
      ctx.fillStyle = '#334155';
      ctx.fillRect(facX + 25, facY - 25, 12, 25); // chimney

      // Factory Smoke Animation
      if(steps[currentStep].focus === 'factory' || currentStep === 0) {
        ctx.fillStyle = 'rgba(100, 116, 139, 0.6)';
        for(let i=0; i<3; i++) {
          let smkY = (facY - 30) - ((time * 20 + i * 15) % 40);
          ctx.beginPath();
          ctx.arc(facX + 31 + Math.sin(time + i) * 5, smkY, 8 + i*2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 2. Tree
      let treeX = w * 0.38;
      let treeY = h * 0.6;
      ctx.fillStyle = '#854d0e';
      ctx.fillRect(treeX, treeY, 12, 30); // Trunk
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.arc(treeX + 6, treeY - 15, 25, 0, Math.PI * 2); // Leaves
      ctx.fill();

      // 3. Animal (Cow)
      let cowX = w * 0.48;
      let cowY = h * 0.68;
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(cowX, cowY, 22, 14); // body
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(cowX - 6, cowY - 4, 8, 8); // head
      ctx.fillRect(cowX + 3, cowY + 5, 5, 5); // spots

      // --- FOCUS HIGHLIGHT & ARROW EFFECTS ---
      ctx.lineWidth = 3;
      let currentFocus = steps[currentStep].focus;

      if(currentFocus === 'tree') {
        drawGlowCircle(treeX + 6, treeY - 15, 35, '#22c55e');
        drawAnimatedArrow(treeX + 6, h * 0.25, treeX + 6, treeY - 35, '#ef4444');
      } else if(currentFocus === 'animal') {
        drawGlowCircle(cowX + 8, cowY + 5, 25, '#f59e0b');
        drawAnimatedArrow(cowX + 8, cowY - 5, cowX + 8, h * 0.25, '#ef4444');
      } else if(currentFocus === 'factory') {
        drawGlowCircle(facX + 22, facY, 40, '#ef4444');
        drawAnimatedArrow(facX + 31, facY - 25, facX + 31, h * 0.2, '#ef4444');
      } else if(currentFocus === 'ocean') {
        drawGlowCircle(w * 0.8, h * 0.72, 45, '#38bdf8');
        drawAnimatedArrow(w * 0.8, h * 0.3, w * 0.8, h * 0.65, '#ef4444');
      }

      // --- ANIMATED CO₂ PARTICLES ---
      ctx.fillStyle = '#ef4444';
      particles.forEach((p, idx) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        // CO2 Label on particle
        if(idx % 4 === 0) {
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9px sans-serif';
          ctx.fillText('CO₂', p.x - 8, p.y - 5);
          ctx.fillStyle = '#ef4444';
        }

        // Particle Movement Logic according to Step
        if(currentFocus === 'tree') {
          p.x += (treeX + 6 - p.x) * 0.02;
          p.y += (treeY - 15 - p.y) * 0.02;
        } else if(currentFocus === 'ocean') {
          p.x += (w * 0.8 - p.x) * 0.02;
          p.y += (h * 0.7 - p.y) * 0.02;
        } else if(currentFocus === 'factory') {
          p.y -= p.speedY;
          if(p.y < h * 0.15) p.y = facY - 25;
        } else {
          p.x += p.speedX;
          p.y += Math.sin(time + idx) * 0.5;
          if(p.x < 0) p.x = w;
          if(p.x > w) p.x = 0;
        }
      });

      requestAnimationFrame(draw);
    }

    // Helper: Draw Pulsing Glow
    function drawGlowCircle(x, y, radius, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, radius + Math.sin(time * 4) * 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Helper: Draw Moving Arrow
    function drawAnimatedArrow(fromX, fromY, toX, toY, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      // Arrowhead
      let angle = Math.atan2(toY - fromY, toX - fromX);
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - 10 * Math.cos(angle - Math.PI / 6), toY - 10 * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - 10 * Math.cos(angle + Math.PI / 6), toY - 10 * Math.sin(angle + Math.PI / 6));
      ctx.fill();
      ctx.restore();
    }

    draw();
  </script>
</body>
</html>
