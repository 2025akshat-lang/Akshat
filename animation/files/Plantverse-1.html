<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plantverse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ek hi screen, teen level. Paudha -> ek hissa ka diagram -> 3D cross-section. Header, stage, bottom chips. */
:root{
  --bg:#06130e; --glow:#0f3a2c; --panel:#0e2119; --panel2:#15302478; --panel3:#173a2c;
  --line:#25493b; --fg:#e8f3ec; --muted:#93b8a5;
  --accent:#6fdc8c; --accent-ink:#04200f; --pollen:#f5b942; --pollen-ink:#2a1a00;
  --leaf:#3fae5a; --leaf2:#2a8a45; --stem:#7fb069; --petal:#f06ba8; --fruit:#e8503a;
  --flesh:#f3846a; --core:#f6e7a8; --seedc:#8a5a2b; --root:#c9a27a; --soil:#2a1d14;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef5ee; --glow:#cfe6d4; --panel:#ffffff; --panel2:#f3f8f3; --panel3:#e3efe4;
    --line:#bcd5c2; --fg:#10261a; --muted:#4a6955;
    --accent:#1c8a47; --accent-ink:#ffffff; --pollen:#b86f00; --pollen-ink:#ffffff;
    --leaf:#35a152; --leaf2:#1f7a38; --stem:#5c8f3c; --petal:#d8478a; --fruit:#d63a26;
    --flesh:#f08a6d; --core:#f6e7a8; --seedc:#7a4d20; --root:#a47b52; --soil:#d9c3a6;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef5ee; --glow:#cfe6d4; --panel:#ffffff; --panel2:#f3f8f3; --panel3:#e3efe4;
  --line:#bcd5c2; --fg:#10261a; --muted:#4a6955;
  --accent:#1c8a47; --accent-ink:#ffffff; --pollen:#b86f00; --pollen-ink:#ffffff;
  --leaf:#35a152; --leaf2:#1f7a38; --stem:#5c8f3c; --petal:#d8478a; --fruit:#d63a26;
  --flesh:#f08a6d; --core:#f6e7a8; --seedc:#7a4d20; --root:#a47b52; --soil:#d9c3a6;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.part:focus-visible,.spot:focus-visible{outline:2px solid var(--pollen);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px}
.logo{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;flex:none;color:var(--accent)}
.brand{font:700 13px var(--mono);letter-spacing:.16em}
.badge{font:700 10px var(--mono);letter-spacing:.14em;color:var(--accent)}
.seg{margin-left:auto;display:flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--panel);min-width:0}
.seg button{border:0;background:none;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel3);color:var(--fg)}
.hd{display:flex;gap:12px;align-items:flex-start;padding:6px 0 4px;min-height:64px}
.hd>div{flex:1;min-width:0}
.crumb{font:700 11px var(--mono);letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
h1{margin:4px 0 2px;font:700 22px/1.15 var(--display);text-wrap:balance}
.hd p{margin:0;color:var(--muted);font-size:13px;text-wrap:pretty}
.x{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,var(--glow) 0%,var(--bg) 72%)}
.view{position:absolute;inset:0}
.view svg{width:100%;height:100%;display:block}
#v3 canvas,#v1 canvas{width:100%;height:100%;display:block;touch-action:none}
#hlbl,#hlbl2{pointer-events:none;position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;min-height:36px;padding:6px 8px 6px 12px;border-radius:10px;
  background:var(--panel);border:1px solid var(--accent);color:var(--fg);font:700 12px var(--mono);letter-spacing:.04em;white-space:nowrap;cursor:pointer;transform:translate(-50%,-135%)}
#hlbl i,#hlbl2 i{font-style:normal;color:var(--accent);font-size:17px;line-height:1}
#hlbl::after,#hlbl2::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:var(--panel);border-right:1px solid var(--accent);border-bottom:1px solid var(--accent);transform:translateX(-50%) rotate(45deg)}
.lab{position:absolute;left:0;top:0;pointer-events:none;padding:3px 7px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
  color:var(--fg);font:700 11px var(--mono);letter-spacing:.05em;white-space:nowrap}
.lab.r{transform:translate(22px,-50%)}.lab.l{transform:translate(calc(-100% - 22px),-50%)}
.lab::before{content:"";position:absolute;top:50%;height:1px;width:22px;background:var(--accent)}
.lab::after{content:"";position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateY(-50%)}
.lab.r::before{left:-23px}.lab.l::before{right:-23px}
.lab.r::after{left:-26px}.lab.l::after{right:-26px}
.tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:8px}
.tools button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font:500 20px var(--body)}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card{position:absolute;left:10px;right:10px;bottom:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);font-size:13px;color:var(--muted);pointer-events:none}
.card b{display:block;color:var(--fg);font:700 14px var(--display);margin-bottom:2px}
.card.hot{pointer-events:auto}
#lbl{position:absolute;left:0;top:0;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--accent);
  font:700 12px var(--mono);white-space:nowrap;pointer-events:none;transform:translate(-50%,-130%)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;border:1px solid var(--line);background:var(--panel);padding:0 16px;border-radius:12px;font-weight:500;font-size:15px}
.chip.mode{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
/* svg drawing */
.part,.spot{cursor:pointer}
.part{transition:opacity .25s,filter .25s}
.part:hover,.part:focus-visible{filter:drop-shadow(0 0 7px var(--accent))}
.part.dim{opacity:.2}
.soil{fill:var(--soil)}
.soilline{stroke:var(--root);stroke-width:1.5;stroke-dasharray:3 4;fill:none;opacity:.7}
.leafp{fill:var(--leaf);stroke:var(--leaf2);stroke-width:1.5}
.vein{stroke:var(--leaf2);fill:none;stroke-linecap:round;stroke-width:2}
.stemp{stroke:var(--stem);fill:none;stroke-linecap:round}
.petalp{fill:var(--petal);opacity:.92}
.pollen{fill:var(--pollen)}
.fruitp{fill:var(--fruit)}
.fleshp{fill:var(--flesh)}
.corep{fill:var(--core)}
.seedp{fill:var(--seedc)}
.rootp{stroke:var(--root);fill:none;stroke-linecap:round}
.lead{stroke:var(--muted);stroke-width:1;fill:none}
.ann,.tag,.spt{font:600 10px var(--mono);fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;letter-spacing:.04em}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em}
.spt{fill:var(--pollen);font-size:10.5px}
.cut{stroke:var(--pollen);stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.hit{fill:transparent}
.pulse{fill:none;stroke:var(--pollen);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pl 1.8s ease-out infinite}
.core{fill:var(--pollen)}
@keyframes pl{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
@media (max-width:380px){.seg button{padding:8px 7px;font-size:12px}h1{font-size:20px}}
</style>
<div class="app">

    </div>
    <div class="card" id="card"></div>
  </main>
  <nav class="chips" id="chips" aria-label="Parts"></nav>
</div>

/* ===== 3D scene builders (procedural) ===== */
const T=THREE, TAU=Math.PI*2;
const M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.65,metalness:0,side:T.DoubleSide},o||{}));
const rnd=(()=>{let s=7;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}})();
class Sc{
  constructor(){this.group=new T.Group();this.parts=[];this.byId={};this.tick=null;this.cam=6;this.view=[.35,-.5];this.title='';this.sub=''}
  part(id,name,desc,anchor){if(!this.byId[id]){const p={id,name,desc,anchor:anchor||null,mats:[],meshes:[]};this.byId[id]=p;this.parts.push(p)}return this.byId[id]}
  add(id,mesh,parent){const p=this.byId[id];mesh.userData.pid=id;if(p.mats.indexOf(mesh.material)<0)p.mats.push(mesh.material);p.meshes.push(mesh);(parent||this.group).add(mesh);return mesh}
}
const mesh=(g,m,x,y,z)=>{const o=new T.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o};

/* radial cross-section: rings along Z, wedge cut away so the inside is visible */
function radial(S,rings,len,cut){
  cut=cut||Math.PI/2;const span=TAU-cut;
  rings.forEach((r,i)=>{
    S.part(r.id,r.name,r.desc);const p=S.byId[r.id];
    if(r.virtual){p.vm=M(r.color);return}
    if(!p.anchor){const a=Math.PI*.85+i*.22,rm=(r.r0+r.r1)/2;p.anchor=[rm*Math.cos(a),rm*Math.sin(a),len/2]}
    const mat=M(r.color,r.mat);const add=g=>S.add(r.id,new T.Mesh(g,mat));
    add(new T.RingGeometry(r.r0,r.r1,64,1,cut,span).translate(0,0,len/2));
    add(new T.CylinderGeometry(r.r1,r.r1,len,64,1,true,cut+Math.PI/2,span).rotateX(Math.PI/2));
    if(r.r0>0)add(new T.CylinderGeometry(r.r0,r.r0,len,64,1,true,cut+Math.PI/2,span).rotateX(Math.PI/2));
    const w=r.r1-r.r0,c=(r.r0+r.r1)/2;
    add(new T.PlaneGeometry(w,len).rotateX(Math.PI/2).translate(c,0,0));
    add(new T.PlaneGeometry(w,len).rotateX(Math.PI/2).translate(c,0,0).rotateZ(cut));
  });
  S.inCut=(a,m)=>{a=((a%TAU)+TAU)%TAU;return a<cut+m||a>TAU-m};
  S.len=len;
}
/* extra rod (bundle, locule...) running along Z, end sits just proud of the cut face */
function rod(S,id,r,rad,x,y,color){
  const p=S.byId[id];if(!p.vm)p.vm=M(color);
  return S.add(id,mesh(new T.CylinderGeometry(rad,rad,S.len+.03,24).rotateX(Math.PI/2),p.vm,x,y,0));
}
const pol=(r,a)=>[r*Math.cos(a),r*Math.sin(a)];

SC['stem-dicot']=()=>{const S=new Sc();S.title='Dicot stem: highway for water and food';S.sub='Vascular bundles sit in a ring. The cambium makes the stem thicker.';S.cam=5.4;

    {id:'cambium',name:'Cambium',desc:'A thin ring of dividing cells. The stem thickens year after year from here.',r0:.43,r1:.5,color:0xffd54f},

SC['root-cross']=()=>{const S=new Sc();S.title='Root section: the water’s journey inwards';S.sub='From the epidermis through the cortex, then past the endodermis gate to the xylem.';S.cam=5.4;

  rod(S,'xylem',0,.09,0,0);
  /* detail: cortex cells + starch, Casparian strip, vessel pores, lateral root bud, root hairs */
  {const zf=S.len/2+.006,cellG=new T.CircleGeometry(.055,14),grainG=new T.CircleGeometry(.014,6),cm=M(0xfffaf0),gm=M(0xc9a35a);

     S.add('cortex',mesh(cellG,cm,x,y,zf));S.add('cortex',mesh(grainG,gm,x+.012,y-.01,zf+.002))}});

   const vm=M(0xbf360c);
   for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2;if(S.inCut(a,.15))continue;[.14,.24,.34].forEach((r,j)=>{const [x,y]=pol(r,a);S.add('xylem',mesh(new T.CircleGeometry(.032+.006*j,10),vm,x,y,S.len/2+.02))})}
   const aL=3.9,dx=Math.cos(aL),dy=Math.sin(aL),lm=M(0xd7b98e),L2=1.0;
   S.part('lat','Lateral root','',[dx*1.3,dy*1.3,-.2]);
   const lb=S.add('lat',new T.Mesh(new T.CylinderGeometry(.085,.12,L2,16).translate(0,L2/2,0),lm));lb.position.set(dx*.46,dy*.46,-.2);lb.rotation.z=aL-Math.PI/2;
   S.add('lat',mesh(new T.SphereGeometry(.085,14,10),lm,dx*(.46+L2),dy*(.46+L2),-.2));
   S.part('hair','Root hairs','',[.9,-1.2,.3]);const hm=M(0xf1e6cf),up=new T.Vector3(0,1,0);
   for(let i=0;i<70;i++){const a=Math.PI/2+.25+rnd()*(TAU-Math.PI/2-.5);if(Math.abs(a-aL)<.25)continue;const z=(rnd()-.5)*1.5,l=.25+rnd()*.25;
     const d=new T.Vector3(Math.cos(a),Math.sin(a),(rnd()-.5)*.5).normalize();

  S.byId.xylem.anchor=[-.3,.3,.8];S.byId.phloem.anchor=[-.3,0,.8];return S};

SC['leaf-blade']=()=>{const S=new Sc();S.title='Leaf: what it looks like inside';S.sub='A leaf is ~0.1–0.3 mm thick. Every layer has its own job.';S.cam=6.6;S.view=[.28,-.42];

SC['leaf-stomata']=()=>{const S=new Sc();S.title='Stomata: the leaf’s doorway';S.sub='A ~20–30 µm opening. It opens when the guard cells swell and closes when they shrink.';S.cam=6.4;S.view=[.95,0];

  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);R.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});R.down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0}});
  cv.addEventListener('pointermove',e=>{const p=R.ptrs.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(R.ptrs.size===2){const o=[...R.ptrs.entries()].find(([k])=>k!==e.pointerId)[1];
      const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d0>0)zoom=Math.max(.5,Math.min(3,zoom*d1/d0));setCam()}
    else{rotY+=dx*.008;rotX=Math.max(-1.5,Math.min(1.5,rotX+dy*.008))}
    if(R.down)R.down.moved+=Math.abs(dx)+Math.abs(dy);p.x=e.clientX;p.y=e.clientY});
  const up=e=>{R.ptrs.delete(e.pointerId);const d=R.down;
    if(d&&e.type==='pointerup'&&d.moved<8&&performance.now()-d.t<400&&R.ptrs.size===0)tap(e);if(R.ptrs.size===0)R.down=null};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(3,zoom*(e.deltaY<0?1.1:.9)));setCam()},{passive:false});
}
function tap(e){const r=R.renderer.domElement.getBoundingClientRect();
  R.ray.setFromCamera(new T.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1),R.camera);
  const all=[];S.parts.forEach(p=>p.meshes.forEach(m=>all.push(m)));
  const hit=R.ray.intersectObjects(all,false)[0];
  if(hit&&hit.object.userData.pid)pick(hit.object.userData.pid)}
const zoomBy=f=>{if(st.lv===1&&H){H.zoom=Math.max(.5,Math.min(3,H.zoom*f));setCamH()}else if(S){zoom=Math.max(.5,Math.min(3,zoom*f));setCam()}};
$('#zin').onclick=()=>zoomBy(1.2);
$('#zout').onclick=()=>zoomBy(1/1.2);
$('#rst').onclick=()=>{if(st.lv===1&&H)resetH();else if(S)resetView()};
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)auto=false;
openHome();
</script>
