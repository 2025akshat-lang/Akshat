<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed WebGL bench; slim top bar (run, views, reset), a name chip under it, one bottom sheet for actions. */
:root{
  --bg:#05090c; --ink:#e8f3f4; --dim:#86a0a5; --line:rgba(170,225,235,.16);
  --panel:rgba(9,16,20,.72); --accent:#5ad1ff; --ok:#3ddc84; --bad:#ff5a5f;
  --display:'Chakra Petch',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font:13px/1.3 var(--mono);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
#stage{position:fixed; inset:0; background:var(--bg); touch-action:none}
#gl{width:100%; height:100%; display:block; outline:none}
#vig{position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 90% at 50% 45%, transparent 58%, rgba(0,0,0,.5) 100%)}
.hud{position:fixed; left:0; right:0; z-index:5; display:flex; gap:10px; pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud > *{pointer-events:auto}
.top{top:0; padding-top:calc(12px + env(safe-area-inset-top,0px)); justify-content:space-between; align-items:center; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; gap:2px; min-width:0; pointer-events:none}
.brand b{font:600 14px var(--display); letter-spacing:.2em; text-transform:uppercase}
.brand span{font-size:10px; color:var(--dim); letter-spacing:.08em}
.tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px;
  backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3)}
button{font:inherit; color:var(--dim); background:none; border:0; border-radius:9px; cursor:pointer; display:grid; place-items:center; transition:color .2s, background .2s, transform .15s}
button:hover{color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.views{display:flex; padding:3px; gap:2px}
.views button{width:34px; height:32px}
.views button[aria-pressed="true"]{color:var(--accent); background:rgba(90,209,255,.14)}
.iconbtn{width:38px; height:38px}
.run{position:relative; overflow:hidden; display:flex; align-items:center; gap:8px; height:38px; padding:0 16px 0 12px;
  background:var(--accent); color:#04161c; border-radius:19px; font:600 13px var(--display); letter-spacing:.12em; text-transform:uppercase}
.run:hover{color:#04161c; filter:brightness(1.1)}
.run i{position:absolute; left:0; bottom:0; height:3px; width:var(--p,0%); background:rgba(4,22,28,.55)}
.run svg{fill:currentColor; stroke:none; width:16px; height:16px}
.run.shake{animation:shake .4s}
.run[data-s="done"]{background:rgba(90,209,255,.25); color:var(--ink)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.autobtn{height:38px; padding:0 14px; border-radius:19px; font:600 12px var(--display); letter-spacing:.14em; text-transform:uppercase; color:var(--ink)}
.autobtn:hover{background:rgba(90,209,255,.16)}
.autobtn.on{background:var(--bad); color:#1a0204}
.chip{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font:600 18px var(--display); color:#04140b;
  box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.chip.ok{background:var(--ok)} .chip.bad{background:var(--bad); color:#1a0204}
#nameRow{width:100%; display:flex; justify-content:center; pointer-events:none; min-height:36px}
#name{padding:7px 14px; text-align:center; opacity:0; transform:translateY(-4px); transition:opacity .25s, transform .25s;
  font:600 13px var(--display); letter-spacing:.06em; max-width:100%}
#name small{display:block; font:400 11px var(--mono); color:var(--dim); letter-spacing:0; margin-top:1px}
#name.on{opacity:1; transform:none}
#sheet{position:fixed; z-index:6; left:50%; transform:translateX(-50%); width:min(560px, calc(100% - 32px));
  bottom:calc(14px + env(safe-area-inset-bottom,0px)); padding:12px 12px 12px 14px; display:flex; flex-direction:column; gap:10px}
.sh-head{display:flex; align-items:flex-start; gap:10px}
.sh-title{flex:1; min-width:0}
.sh-title b{display:block; font:600 14px var(--display); letter-spacing:.05em}
.sh-title span{display:block; color:var(--dim); font-size:11px; margin-top:2px}
.sh-x{width:32px; height:32px; flex:none}
.sh-body{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.opt{padding:10px 14px; border:1px solid var(--line); border-radius:10px; color:var(--ink); font:500 12px var(--mono); background:rgba(255,255,255,.04)}
.opt:hover{background:rgba(90,209,255,.14); border-color:rgba(90,209,255,.5)}
.opt:disabled{opacity:.35; pointer-events:none}
.opt.main{background:var(--accent); color:#04161c; border-color:transparent; font-weight:600}
.pour{flex:1; min-width:150px; padding:14px 16px; touch-action:none; font:600 13px var(--display); letter-spacing:.1em; text-transform:uppercase}
.pour.hold{filter:brightness(1.18); transform:scale(.98)}
.readout{font-variant-numeric:tabular-nums; color:var(--ink); font-size:13px; min-width:76px; text-align:right}
.tag{position:absolute; left:0; top:0; z-index:4; pointer-events:none; font-size:11px; padding:2px 7px 2px 6px;
  background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--c,#5ad1ff); border-radius:5px;
  opacity:0; transition:opacity .3s; white-space:nowrap; font-variant-numeric:tabular-nums}
.tag.on{opacity:1}
.badge{position:absolute; left:0; top:0; z-index:7; width:38px; height:38px; margin:-19px 0 0 -19px; border-radius:50%;
  display:grid; place-items:center; pointer-events:none; transition:opacity .4s; box-shadow:0 4px 18px rgba(0,0,0,.5)}
.badge svg{width:22px; height:22px; stroke-width:3}
.badge.ok{background:var(--ok); color:#04140b} .badge.bad{background:var(--bad); color:#1a0204}
.badge.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2); opacity:0} to{transform:scale(1); opacity:1}}
#nogl{position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px; color:var(--dim)}
@media (max-width:520px){ .brand span{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>

<div id="stage">
  <canvas id="gl" tabindex="0" aria-label="3D chromatography lab bench"></canvas>
  <div id="vig"></div>
</div>
<div id="nogl">WebGL is not available in this browser.</div>

<div class="hud top">
  <div class="brand"><b>Chromatography</b><span>by akshat</span></div>
  <div class="tools">
    <span id="chip" class="chip" hidden></span>
    <button id="auto" class="panel autobtn" aria-label="Watch an automatic demo">Auto</button>
    <button id="run" class="run" data-s="idle" aria-label="Run"><svg id="ri" viewBox="0 0 24 24"></svg><span id="rl">Run</span><i></i></button>
    <div class="panel views" role="group" aria-label="Camera">
      <button data-view="bench" aria-label="Bench view" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg></button>
      <button data-view="jar" aria-label="Jar view" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 4h10M8 4v15a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V4"/><path d="M8 13h8"/></svg></button>
      <button data-view="mol" aria-label="Molecular view" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5M10.5 8v5"/></svg></button>
    </div>
    <button id="rst" class="panel iconbtn" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg></button>
  </div>
  <div id="nameRow"><div id="name" class="panel"></div></div>
</div>

<div id="sheet" class="panel" hidden>
  <div class="sh-head">
    <div class="sh-title"><b id="shT"></b><span id="shS"></span></div>
    <button id="shX" class="sh-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="shB" class="sh-body"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var canvas = document.getElementById('gl');
var stageEl = document.getElementById('stage');
var renderer;
try{
  renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, powerPreference:'high-performance'});
}catch(e){
  document.getElementById('nogl').style.display='grid'; return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var V3 = THREE.Vector3;
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x05090c);
scene.fog = new THREE.FogExp2(0x05090c, 0.018);
var camera = new THREE.PerspectiveCamera(36, 1, 0.05, 120);

/* ---------- constants (1 unit is about 3.3 cm) ---------- */
var CM = 3.3, T = 40;
var PW = 1.6, PH = 3.35, PY0 = 0.35, BASE_H = 0.45;
var JR = 1.35, JH = 3.6, L0 = 0.12;
var COMPS = [
  {name:'Yellow', rf:0.88, rgb:'247,198,27', dk:'200,150,8',  hex:0xf7c61b},
  {name:'Blue',   rf:0.58, rgb:'47,140,255', dk:'20,90,200',  hex:0x2f8cff},
  {name:'Red',    rf:0.32, rgb:'239,68,68',  dk:'180,30,40',  hex:0xef4444}
];
var LANES = [
  {u:0.18, ink:'black'},
  {u:0.40, ink:'yellow'},
  {u:0.62, ink:'blue'},
  {u:0.84, ink:'red'}
];
function laneX(u){ return (u-0.5)*PW; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(a,b,x){ var k = clamp((x-a)/(b-a),0,1); return k*k*(3-2*k); }
function levelOf(vol){ return L0 + vol*0.0177; }

var seed = 11;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }
function gauss(){ return (rnd()+rnd()+rnd()+rnd()-2)*1.2; }
function cnv(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(c, srgb, rep){
  var t = new THREE.CanvasTexture(c);
  if(srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if(rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); }
  return t;
}
function dotTex(){
  var c=cnv(64,64), x=c.getContext('2d'); var g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.65)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); return tex(c,false);
}
function ballTex(){
  var c=cnv(64,64), x=c.getContext('2d');
  var g=x.createRadialGradient(24,22,2,32,32,30);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.28,'rgba(255,255,255,.92)');
  g.addColorStop(.7,'rgba(190,190,190,.95)'); g.addColorStop(.93,'rgba(110,110,110,.9)'); g.addColorStop(1,'rgba(110,110,110,0)');
  x.fillStyle=g; x.beginPath(); x.arc(32,32,31,0,6.2832); x.fill(); return tex(c,false);
}
var DOT = dotTex(), BALL = ballTex();

/* ---------- studio environment for reflections ---------- */
function buildEnv(){
  var es = new THREE.Scene();
  var g = cnv(4,256), c = g.getContext('2d');
  var gr = c.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#16303b'); gr.addColorStop(.5,'#1d3640'); gr.addColorStop(1,'#05080a');
  c.fillStyle = gr; c.fillRect(0,0,4,256);
  var t = new THREE.CanvasTexture(g); t.encoding = THREE.sRGBEncoding;
  es.add(new THREE.Mesh(new THREE.SphereGeometry(30,32,16), new THREE.MeshBasicMaterial({map:t, side:THREE.BackSide})));
  function panel(w,h,x,y,z,col,k){
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(k), side:THREE.DoubleSide}));
    m.position.set(x,y,z); m.lookAt(0,0,0); es.add(m);
  }
  panel(9,6,-13,8,10,0xffffff,4);
  panel(16,1.2,0,17,2,0xe8f6ff,5);
  panel(4,10,15,5,-6,0x7fd8ff,3.5);
  panel(9,3,0,3,-17,0xffffff,2);
  var pm = new THREE.PMREMGenerator(renderer);
  var rt = pm.fromScene(es, 0.02); pm.dispose();
  return rt.texture;
}
scene.environment = buildEnv();

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x9cbfca, 0x0a1014, 0.55));
var key = new THREE.SpotLight(0xfff4e4, 2.2, 60, 0.75, 0.9, 1.1);
key.position.set(-4.5, 13, 7); key.target.position.set(0,1,0.5);
key.castShadow = true; key.shadow.mapSize.set(2048,2048); key.shadow.bias = -0.0004; key.shadow.radius = 5;
scene.add(key, key.target);
var rim = new THREE.DirectionalLight(0x6fd6ff, 0.7); rim.position.set(5,5,-5); scene.add(rim);
var fillL = new THREE.PointLight(0xffb98a, 0.5, 22, 2); fillL.position.set(4,3,6); scene.add(fillL);

/* ---------- materials ---------- */
var steel = new THREE.MeshStandardMaterial({color:0xaab4ba, metalness:1, roughness:0.3, envMapIntensity:1.0});
var black = new THREE.MeshStandardMaterial({color:0x111418, metalness:0.2, roughness:0.45});
function glassMat(op){
  return new THREE.MeshPhysicalMaterial({color:0xe3f4ff, metalness:0, roughness:0.05, transparent:true, opacity:op||0.2,
    envMapIntensity:2.2, clearcoat:1, clearcoatRoughness:0.04, side:THREE.DoubleSide, depthWrite:false});
}
function liquidMat(col, op){
  return new THREE.MeshPhysicalMaterial({color:col, metalness:0, roughness:0.08, transparent:true, opacity:op,
    envMapIntensity:1.4, clearcoat:1, clearcoatRoughness:0.05, depthWrite:false});
}
function add(geo, mat, x, y, z, o){
  var m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); scene.add(m);
  if(o){ if(o.cast) m.castShadow = true; if(o.recv) m.receiveShadow = true; if(o.ro) m.renderOrder = o.ro; }
  return m;
}
function latheM(pts, mat){
  return new THREE.Mesh(new THREE.LatheGeometry(pts.map(function(a){ return new THREE.Vector2(a[0],a[1]); }), 48), mat);
}

/* ---------- bench + wall ---------- */
(function(){
  var c = cnv(1024,1024), x = c.getContext('2d');
  x.fillStyle = '#161c20'; x.fillRect(0,0,1024,1024);
  for(var i=0;i<26000;i++){
    var v = 18+Math.floor(rnd()*46);
    x.fillStyle = 'rgba('+v+','+(v+6)+','+(v+9)+','+(0.25+rnd()*0.5)+')';
    x.fillRect(rnd()*1024, rnd()*1024, 1+rnd()*2, 1+rnd()*2);
  }
  var bench = add(new THREE.PlaneGeometry(44,26), new THREE.MeshStandardMaterial({map:tex(c,true,[8,5]), roughness:0.35, metalness:0.05, envMapIntensity:0.6}), 0,0,0, {recv:true});
  bench.rotation.x = -Math.PI/2;
  var c2 = cnv(256,256), x2 = c2.getContext('2d');
  var g = x2.createLinearGradient(0,0,256,256); g.addColorStop(0,'#d7e3e6'); g.addColorStop(1,'#b9cbd0');
  x2.fillStyle = g; x2.fillRect(0,0,256,256);
  x2.strokeStyle = '#6f8288'; x2.lineWidth = 5; x2.strokeRect(0,0,256,256);
  var wall = add(new THREE.PlaneGeometry(50,18), new THREE.MeshStandardMaterial({map:tex(c2,true,[15,5.5]), color:0x4d5f66, roughness:0.3, envMapIntensity:0.5}), 0,7,-7.2);
  wall.receiveShadow = true;
})();

/* ---------- jar ---------- */
var jar = new THREE.Group(); scene.add(jar);
(function(){
  var gm = glassMat(0.2);
  var outer = new THREE.Mesh(new THREE.CylinderGeometry(JR,JR,JH,80,1,true), gm); outer.position.y = JH/2; outer.renderOrder = 3;
  var inner = new THREE.Mesh(new THREE.CylinderGeometry(JR-0.05,JR-0.05,JH-0.1,80,1,true), gm); inner.position.y = JH/2+0.05; inner.renderOrder = 3;
  var base = new THREE.Mesh(new THREE.CylinderGeometry(JR,JR-0.02,0.12,80), glassMat(0.3)); base.position.y = 0.06; base.renderOrder = 3;
  var rimT = new THREE.Mesh(new THREE.TorusGeometry(JR-0.025,0.04,14,80), glassMat(0.38)); rimT.rotation.x = Math.PI/2; rimT.position.y = JH; rimT.renderOrder = 3;
  jar.add(outer, inner, base, rimT);
})();

/* liquid (level set from volume) */
var LR = JR-0.056;
var liqGeo = new THREE.CylinderGeometry(LR,LR,1,64); liqGeo.translate(0,0.5,0);
var liqMat = liquidMat(0x7cc8ff,0.5);
var liqMesh = new THREE.Mesh(liqGeo, liqMat); liqMesh.renderOrder = 2; liqMesh.position.y = L0; scene.add(liqMesh);
var surfGeo = new THREE.RingGeometry(0.001, LR, 72, 22); surfGeo.rotateX(-Math.PI/2);
var surfMat = liquidMat(0xa8e1ff,0.6); surfMat.side = THREE.DoubleSide;
var surf = new THREE.Mesh(surfGeo, surfMat); surf.renderOrder = 2; scene.add(surf);
var surfBase = surfGeo.attributes.position.array.slice();
var mens = new THREE.Mesh(new THREE.TorusGeometry(LR-0.005,0.02,10,72), liquidMat(0xbfe9ff,0.65)); mens.rotation.x = Math.PI/2; mens.renderOrder = 2; scene.add(mens);
var curLevel = L0, liqOn = false;
function setLevel(vol){
  curLevel = levelOf(vol); liqOn = vol > 0.4;
  liqMesh.visible = surf.visible = mens.visible = liqOn;
  liqMesh.scale.y = Math.max(0.001, curLevel-L0);
  surf.position.y = curLevel; mens.position.y = curLevel+0.004;
}
setLevel(0);
/* falling stream while pouring */
var streamGeo = new THREE.CylinderGeometry(0.024,0.03,1,14,1,true); streamGeo.translate(0,0.5,0);
var streamMat = new THREE.MeshPhysicalMaterial({color:0xbfe6ff, transparent:true, opacity:0.7, roughness:0.05, clearcoat:1, depthWrite:false});
var stream = new THREE.Mesh(streamGeo, streamMat); stream.visible = false; stream.renderOrder = 4; scene.add(stream);

/* contact shadow under jar */
(function(){
  var c = cnv(256,256), x = c.getContext('2d'); var g = x.createRadialGradient(128,128,10,128,128,128);
  g.addColorStop(0,'rgba(0,0,0,.85)'); g.addColorStop(.7,'rgba(0,0,0,.45)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,256,256);
  var m = add(new THREE.PlaneGeometry(JR*2.9,JR*2.9), new THREE.MeshBasicMaterial({map:tex(c,false), transparent:true, depthWrite:false}), 0.15,0.004,0.1, {ro:1});
  m.rotation.x = -Math.PI/2;
})();

/* ---------- dust + bubbles ---------- */
var dustN = 120, dustPos = new Float32Array(dustN*3), dustVel = [];
for(var di=0; di<dustN; di++){
  dustPos[di*3] = (rnd()-0.5)*12; dustPos[di*3+1] = 0.4+rnd()*7; dustPos[di*3+2] = (rnd()-0.5)*10;
  dustVel.push([ (rnd()-0.5)*0.05, 0.01+rnd()*0.03, (rnd()-0.5)*0.05 ]);
}
var dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos,3));
var dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({size:0.03, map:DOT, color:0xcfeaff, transparent:true, opacity:0.22, depthWrite:false}));
if(!reduce) scene.add(dust);
var bubN = 22, bubPos = new Float32Array(bubN*3), bubSp = [];
for(var bi=0; bi<bubN; bi++){

}

function inkBlob(x,y,r,rgb,dk,a,sy,nz){
  if(a<0.004 || r<0.5) return;
  px.save(); px.translate(x,y); px.scale(1,sy); px.globalCompositeOperation = 'multiply';
  var g = px.createRadialGradient(0,0,r*0.2,0,0,r*1.5);

  px.fillStyle = g; px.beginPath(); px.arc(0,0,r*1.5,0,6.2832); px.fill();

    for(var k=0;k<=28;k++){

    }

  g2.addColorStop(0,'rgba('+dk+','+a+')'); g2.addColorStop(0.55,'rgba('+rgb+','+(a*0.85)+')'); g2.addColorStop(1,'rgba('+rgb+',0.05)');
  px.fillStyle = g2; edge(r); px.fill();
  px.strokeStyle = 'rgba('+rgb+','+(a*0.35)+')'; px.lineWidth = Math.max(1,r*0.09); edge(r*0.86); px.stroke();
  for(var i=0;i<nz.length;i++){

}
function trail(x,y0,y1,r,rgb,dk,a,nz){

  px.save(); px.globalCompositeOperation = 'multiply'; px.lineCap = 'round';

    var ox = (nz[j][1]-0.5)*r*1.3, ww = r*(0.08+nz[j][2]*0.06);

function drawPaper(){

var tmpV = new V3();
function updMol(time, dt){
  var R = S.run, P = S.paper, d = dNow(), h = frontNow(), on = molK>0.01, ci, i;
  fibres.visible = on; fibMat.opacity = molK*0.5; microMat.opacity = molK*0.92;
  for(ci=0;ci<3;ci++){ molPts[ci].visible = on; molPts[ci].material.opacity = molK*0.98; }
  var sv = on && R.status!=='idle' && P.orient!=='h';
  solPts.visible = sv; solMat.opacity = molK*0.85*P.wetK;
  if(!on) return;
  for(ci=0;ci<3;ci++){
    var arr = MOLS[ci], pos = molPts[ci].geometry.attributes.position.array, moving = R.status!=='idle' && R.mode!=='none';
    for(i=0;i<arr.length;i++){
      var m = arr[i];
      if(P.spot[m.lane]<=0.05){ pos[i*3+1] = -50; continue; }
      var lag = 1-Math.min(1,m.gy*0.38), yy = BASE_H + (moving ? R.rfs[ci]*d*lag : 0) + (d<0.01 ? m.gy*0.012 : 0);
      pos[i*3]   = laneX(LANES[m.lane].u) + (0.03+0.012*d)*m.gx + Math.sin(time*2.3+m.ph)*0.012;
      pos[i*3+1] = yy - PH/2 + Math.cos(time*1.9+m.ph*1.7)*0.012 + m.gx*0.004;
      pos[i*3+2] = -0.02 + m.zz*0.05;
    }
    molPts[ci].geometry.attributes.position.needsUpdate = true;
  }
  if(sv){
    var flow = R.status==='running' ? R.speed : 0, sp = solGeo.attributes.position.array, vu = P.orient==='vu';
    for(i=0;i<SOLN;i++){
      solH[i] += solSp[i]*dt*flow;
      if(solH[i]>h || solH[i]<0) solH[i] = rnd()*Math.max(0.05,Math.min(h,0.5));
      sp[i*3] = solX[i] + Math.sin(time*1.7+i)*0.01;
      sp[i*3+1] = vu ? PH/2 - solH[i] : solH[i] - PH/2;
      sp[i*3+2] = solZ[i];

  }
}

/* ---------- sheet ---------- */
var sheetEl = document.getElementById('sheet'), shT = document.getElementById('shT'), shS = document.getElementById('shS'), shB = document.getElementById('shB');
var pourCtl = null, pouring = false, pulseLeft = 0, roEl = null;
function openSheet(title, sub, btns){
  shT.textContent = title; shS.textContent = sub||''; shB.innerHTML = '';
  btns.forEach(function(b){
    var e = document.createElement('button'); e.className = 'opt'+(b.main?' main':''); e.textContent = b.t;
    if(b.dis) e.disabled = true;
    e.addEventListener('click', b.fn); shB.appendChild(e);
  });
  sheetEl.hidden = false;
}
function closeSheet(){
  sheetEl.hidden = true; roEl = null;
  if(pourCtl) endPour();
}
document.getElementById('shX').addEventListener('click', closeSheet);

/* ---------- liquid colour ---------- */
var liqBase = new THREE.Color(0x7cc8ff), WASHC = new THREE.Color(0x6b5a3a), WHITE = new THREE.Color(0xffffff);
function updLiqColor(){
  var r = 0, g = 0, b = 0, tot = 0, k;
  for(k in S.parts){ var c = new THREE.Color(LIQ[k].tint), v = S.parts[k]; r += c.r*v; g += c.g*v; b += c.b*v; tot += v; }
  if(tot>0) liqBase.setRGB(r/tot,g/tot,b/tot);
}

/* ---------- pouring ---------- */
var MOUTH = new V3(0.9,4.1,0), TILT_A = 0.87, TILT_B = 1.83;
function bottlePose(th){
  var off = new V3(-1.08*Math.sin(th), 1.08*Math.cos(th), 0);
  return {p:MOUTH.clone().sub(off), q:Q(0,0,th)};
}
function addVol(id, dv){
  dv = Math.min(dv, 60-S.vol); if(dv<=0) return;
  S.vol += dv; S.parts[id] = (S.parts[id]||0)+dv;
  setLevel(S.vol); updLiqColor(); updChip();
  if(roEl) roEl.textContent = S.vol.toFixed(1)+' mL';
}
function pourStep(dt){
  var c = pourCtl;
  if(!c){ stream.visible = false; return; }
  var eff = pouring || pulseLeft>0;
  c.tilt += ((eff?TILT_B:TILT_A)-c.tilt)*Math.min(1,dt*7);
  var pz = bottlePose(c.tilt); c.g.position.copy(pz.p); c.g.quaternion.copy(pz.q);
  var flowing = eff && c.tilt>TILT_B-0.35 && S.vol<60;
  if(flowing){
    var dv = pouring ? 6*dt : Math.min(pulseLeft,4*dt);
    if(!pouring) pulseLeft -= dv;
    addVol(c.id, dv);
  } else if(!pouring && pulseLeft>0 && S.vol>=60) pulseLeft = 0;
  stream.visible = flowing;
  if(flowing){ stream.position.set(MOUTH.x, curLevel, 0); stream.scale.set(1, Math.max(0.05, MOUTH.y-curLevel), 1); }
}
function endPour(){
  var c = pourCtl; if(!c) return;
  pourCtl = null; pouring = false; pulseLeft = 0; stream.visible = false;
  busy++;
  moveTo(c.g, c.g.userData.home, c.g.userData.homeQ, 0.9, 2.4).then(function(){
    c.g.userData.cap.visible = true; busy--;
    if(resetPending && busy===0){ resetPending = false; resetAll(); }
  });
}
function startPourFlow(id){
  var P = S.paper;
  closeSheet();
  if(S.cover){ crossAt(cover.position); return; }
  if(P.state==='jar' || S.run.status!=='idle'){ crossAt(JAR_TOP); return; }
  act(async function(){
    var g = bottles[id], pz = bottlePose(TILT_A);
    await moveTo(g, pz.p, pz.q, 0.95, 2.6);
    g.userData.cap.visible = false;
    pourCtl = {id:id, g:g, tilt:TILT_A};
    showPourSheet(id);
  });
}
function showPourSheet(id){
  var d = LIQ[id];
  shT.textContent = d.name; shS.textContent = d.f; shB.innerHTML = '';
  var hold = document.createElement('button'); hold.className = 'opt main pour'; hold.textContent = 'Hold to pour';
  var plus = document.createElement('button'); plus.className = 'opt'; plus.textContent = '+1 mL';
  var ro = document.createElement('span'); ro.className = 'readout'; ro.textContent = S.vol.toFixed(1)+' mL'; roEl = ro;
  var done = document.createElement('button'); done.className = 'opt'; done.textContent = 'Done';
  function down(e){ pouring = true; hold.classList.add('hold'); try{ if(e.pointerId!==undefined) hold.setPointerCapture(e.pointerId); }catch(x){} }
  function up(){ pouring = false; hold.classList.remove('hold'); }
  hold.addEventListener('pointerdown', down); hold.addEventListener('pointerup', up);
  hold.addEventListener('pointercancel', up); hold.addEventListener('lostpointercapture', up);
  hold.addEventListener('keydown', function(e){ if((e.key===' '||e.key==='Enter') && !e.repeat){ e.preventDefault(); down(e); } });
  hold.addEventListener('keyup', function(e){ if(e.key===' '||e.key==='Enter') up(); });
  plus.addEventListener('click', function(){ pulseLeft += 1; });
  done.addEventListener('click', closeSheet);
  shB.appendChild(hold); shB.appendChild(plus); shB.appendChild(ro); shB.appendChild(done);
  sheetEl.hidden = false;
}

/* ---------- ink spotting, baseline ---------- */
function paperWorld(){ return paperG.getWorldPosition(new V3()); }
function tipPose(T){ return new V3(T.x+0.99, T.y+0.68, T.z); }
var PEN_DOWN_Q = Q(0,0,0.6);
function spotInk(id){
  var d = LIQ[id], li = d.lane, P = S.paper;
  closeSheet();
  if(P.state!=='table' || P.base<0.999){ crossAt(paperWorld()); return; }
  if(P.spot[li]>0.01) return;
  act(async function(){
    var g = bottles[id]; g.userData.cap.visible = false;
    paperG.updateMatrixWorld(true);
    var tp = paperG.localToWorld(new V3(laneX(LANES[li].u), BASE_H-PH/2, 0));
    await moveTo(g, new V3(tp.x, tp.y+1.4, tp.z), Q(Math.PI,0,0), 0.9, 1.6);
    await tween(1.2, function(e){ P.spot[li] = e; dirty = true; });
    await moveTo(g, g.userData.home, g.userData.homeQ, 0.9, 2.2);
    g.userData.cap.visible = true;
  });
}
function penWrite(A, B, secs, onProg){
  return (async function(){
    await moveTo(pencil, tipPose(new V3(A.x,A.y+0.5,A.z)), PEN_DOWN_Q, 0.7, 0.6);
    await moveTo(pencil, tipPose(A), PEN_DOWN_Q, 0.25, 0);
    await tween(secs, function(e){
      var T = new V3().lerpVectors(A,B,e); pencil.position.copy(tipPose(T)); onProg(e); dirty = true;
    }, function(k){ return k; });
    await moveTo(pencil, tipPose(new V3(B.x,B.y+0.5,B.z)), PEN_DOWN_Q, 0.25, 0);
  })();
}
function penHome(){ return moveTo(pencil, PEN_HOME, PEN_Q, 0.9, 1.3); }
function drawBaseline(){
  var P = S.paper; closeSheet();
  if(P.state!=='table'){ crossAt(paperWorld()); return; }
  if(P.base>=1) return;
  act(async function(){
    paperG.updateMatrixWorld(true);
    var A = paperG.localToWorld(new V3(-PW/2,BASE_H-PH/2,0)), B = paperG.localToWorld(new V3(PW/2,BASE_H-PH/2,0));
    A.y = B.y = 0.05;
    await penWrite(A,B,1.6,function(e){ P.base = e; });
    await penHome();
  });
}
function markFront(){
  var P = S.paper; closeSheet();
  if(P.state!=='out' || S.run.status==='idle'){ crossAt(paperWorld()); return; }
  if(P.front>=1) return;
  act(async function(){
    P.frontY = frontCanvasY();
    paperG.updateMatrixWorld(true);
    var ly = PH/2 - P.frontY/S_PX;
    var A = paperG.localToWorld(new V3(-PW/2,ly,0)), B = paperG.localToWorld(new V3(PW/2,ly,0));
    A.y = B.y = 0.05;
    await penWrite(A,B,1.4,function(e){ P.front = e; });
    await penHome();
  });
}
function markCentres(){
  var P = S.paper; closeSheet();
  if(P.state!=='out' || S.run.status==='idle'){ crossAt(paperWorld()); return; }
  var rl = ringList(); if(!rl.length || P.centres>=rl.length) return;
  act(async function(){
    P.centresN = rl.length; paperG.updateMatrixWorld(true);
    for(var i=0;i<rl.length;i++){
      var T0 = paperG.localToWorld(new V3(laneX(LANES[rl[i].li].u), compH(rl[i].ci)-PH/2, 0)); T0.y = 0.05;
      await moveTo(pencil, tipPose(new V3(T0.x,T0.y+0.35,T0.z)), PEN_DOWN_Q, 0.5, 0.3);
      await tween(0.45, function(e){ P.centres = i+e; dirty = true; }, function(k){ return k; });
    }
    P.centres = rl.length; dirty = true;
    await penHome();
  });
}

/* ---------- strip: hang, take out, beaker ---------- */
function setFold(orient){ fold.visible = orient==='vd' || orient==='vu'; fold.position.y = orient==='vu' ? -PH/2 : PH/2; }
function hang(orient){
  var P = S.paper; closeSheet();
  if(S.run.status!=='idle'){ crossAt(paperWorld()); return; }
  if(S.cover){ crossAt(cover.position); return; }
  if(orient!=='h' && S.rod!=='jar'){ crossAt(paperWorld()); return; }
  act(async function(){
    var pz = POSE[orient], midY = orient==='h' ? JH+2.0 : 5.8;
    await moveTo(paperG, new V3(0,midY,0.8), pz.q, 0.85, 0);
    await moveTo(paperG, pz.p, pz.q, 0.7, 0);
    P.state = 'jar'; P.orient = orient; setFold(orient); dirty = true;
    var good = orient==='vd' && S.rod==='jar';
    badge(good ? new V3(0.0,PY0+PH,0.0) : new V3(0,JH+0.6,0), good);
  });
}
function takeOut(){
  var P = S.paper; closeSheet();
  if(S.cover){ crossAt(cover.position); return; }
  act(async function(){
    var tp = POSE.table;
    if(P.state==='beaker'){
      await moveTo(paperG, new V3(2.2,5.6,2.6), tp.q, 0.9, 0);
    } else {
      await moveTo(paperG, new V3(0,5.8,0.8), paperG.quaternion.clone(), 0.7, 0);
      await moveTo(paperG, new V3(0,5.2,1.6), tp.q, 0.7, 0);
    }
    await moveTo(paperG, tp.p, tp.q, 0.8, 0);
    P.state = S.run.status==='idle' ? 'table' : 'out'; fold.visible = false; dirty = true;
  });
}
function toBeaker(){
  var P = S.paper; closeSheet();
  act(async function(){
    var bp = POSE.beaker;
    await moveTo(paperG, new V3(2.2,5.6,2.6), bp.q, 0.9, 0);
    await moveTo(paperG, new V3(bp.p.x,bp.p.y+1.0,bp.p.z), bp.q, 0.5, 0);
    await moveTo(paperG, bp.p, bp.q, 0.5, 0);
    P.state = 'beaker';
  });
}

/* ---------- rod, cover ---------- */
function placeRod(where){
  closeSheet();
  if(S.cover){ crossAt(cover.position); return; }
  if(S.paper.state==='jar' && S.rod==='jar'){ crossAt(ROD_ON); return; }
  act(async function(){
    var p, q;
    if(where==='table'){ p = ROD_HOME; q = QID; }
    else if(where==='jar'){ p = ROD_ON; q = QID; }
    else { p = new V3(0.4,1.95,0.25); q = Q(0.05,0,Math.PI/2); }
    await moveTo(rodG, p, q, 0.9, 1.6);
    S.rod = where;
    if(where!=='table') badge(new V3(p.x,Math.min(p.y+0.5,JH+0.6),p.z), where==='jar');
  });
}
function toggleCover(){
  closeSheet();
  if(!S.cover){
    if(S.paper.state==='jar' && S.paper.orient==='h'){ crossAt(JAR_TOP); return; }
    act(async function(){ await moveTo(cover, CV_ON, QID, 1.0, 1.8); S.cover = true; });
  } else {
    act(async function(){ await moveTo(cover, CV_HOME, QID, 1.0, 1.8); S.cover = false; });
  }
}
CV_ON.y = JH+0.22;

/* ---------- run ---------- */
function startRun(){
  if(busy>0) return;
  var P = S.paper, R = S.run;
  if(R.status==='running'){ R.speed = R.speed===1 ? 3 : 1; updRun(); return; }
  if(R.status==='done') return;
  if(P.state!=='jar' || P.orient==='h'){ shakeRun(); crossAt(P.state==='jar' ? JAR_TOP : paperWorld()); return; }
  if(S.vol<14){ shakeRun(); crossAt(JAR_TOP); return; }
  var lv = levelOf(S.vol), mode = 'good';
  if(P.orient==='vu') mode = 'none'; else if(lv>=PY0+BASE_H-0.04) mode = 'wash';
  var f = 0.15+1.1*mixE(), rfs = COMPS.map(function(c){ return Math.min(0.96, c.rf*f); });
  if(mode==='wash') rfs = [0.07,0.05,0.04];
  R.status = 'running'; R.p = 0; R.speed = 1; R.mode = mode; R.rfs = rfs;
  R.h0 = Math.max(0.05, lv-PY0); R.fmax = Math.min(PH-0.12, 3.0*(S.cover?1:0.78));
  if(!S.cover) crossAt(JAR_TOP);
  P.wetK = 1; dirty = true; updRun();
  for(var i=0;i<SOLN;i++) solH[i] = rnd()*0.4;
}

/* ---------- reset ---------- */
function resetAll(){
  tweens.length = 0; pouring = false; pulseLeft = 0; pourCtl = null; stream.visible = false;
  S = freshState();
  Object.keys(bottles).forEach(function(k){
    var g = bottles[k]; g.position.copy(g.userData.home); g.quaternion.copy(g.userData.homeQ); g.userData.cap.visible = true;
  });
  rodG.position.copy(ROD_HOME); rodG.quaternion.copy(QID);
  cover.position.copy(CV_HOME); cover.quaternion.copy(QID);
  pencil.position.copy(PEN_HOME); pencil.quaternion.copy(PEN_Q);
  paperG.position.copy(POSE.table.p); paperG.quaternion.copy(POSE.table.q);
  fold.visible = false;
  setLevel(0); liqBase.set(0x7cc8ff); closeSheet();
  elName.classList.remove('on'); elChip.hidden = true;
  badges.forEach(function(b){ b.el.remove(); }); badges.length = 0;
  updRun(); dirty = true;
}

/* ---------- picking ---------- */
var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function visibleChain(o){ while(o){ if(!o.visible) return false; o = o.parent; } return true; }
function pickAt(cx, cy){
  var r = canvas.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  var hits = ray.intersectObjects(pickMeshes,false).filter(function(h){ return visibleChain(h.object); });
  if(!hits.length) return null;
  var first = hits[0];
  if(first.object.userData.pid==='jar'){
    for(var i=1;i<hits.length;i++){
      var pid = hits[i].object.userData.pid;
      if(pid==='paper' || pid==='rod'){ var p = hits[i].point; if(Math.hypot(p.x,p.z)<JR && p.y<JH+0.3) return hits[i]; }
    }
  }
  return first;
}
function paperPart(uv){
  var P = S.paper, R = S.run, u = uv.x, hh = uv.y*PH, d = dNow(), li, j;
  if(P.base>0.02 && Math.abs(hh-BASE_H)<0.07 && u<=P.base+0.02) return ['Pencil baseline','Graphite line. The spots start here.'];
  for(li=0;li<4;li++){
    if(P.spot[li]<=0.05) continue;
    var list = li===0 ? [0,1,2] : [li-1];
    for(j=0;j<list.length;j++){
      var ci = list[j], hc = compH(ci), sep = R.status!=='idle' && R.mode!=='none' && d>0.1;
      if(li===0 && !sep && j>0) continue;
      if(Math.abs(u-LANES[li].u)<0.09 && Math.abs(hh-hc)<0.12){
        if(li===0 && !sep) return ['Black ink spot','A mixture of dyes. Not separated yet.'];
        if(li===0) return [COMPS[ci].name+' component','Rf '+R.rfs[ci].toFixed(2)+', travelled '+(R.rfs[ci]*d*CM).toFixed(1)+' cm'];
        return [COMPS[ci].name+' dye spot','Reference sample of a single dye.'];
      }
    }
  }
  if(P.front>0.05 && Math.abs(hh-(P.orient==='vu' ? PH-P.frontY/S_PX : (PH-P.frontY/S_PX)))<0.07) return ['Pencil mark','Marks where the solvent front stopped.'];
  if(R.status!=='idle' && P.orient==='vd'){
    var h = frontNow();
    if(Math.abs(hh-h)<0.12) return ['Solvent front', (d*CM).toFixed(1)+' cm above the baseline'];
    if(hh<h) return [P.wetK<0.3 ? 'Drying paper' : 'Wet paper','Solvent has climbed through here.'];
  }
  return ['Filter paper strip','Cellulose fibres. Solvent creeps up through the gaps between them.'];
}
function onPick(h){
  if(!h || autoOn){ return; }
  var pid = h.object.userData.pid, info = pickInfo[pid], name = info.name, sub = info.info;
  if(pid==='jar'){ sub = S.vol>0.4 ? S.vol.toFixed(0)+' mL. '+mixText() : 'Empty. Holds the solvent.'; }
  if(pid==='paper' && h.uv){ var pp = paperPart(h.uv); name = pp[0]; sub = pp[1]; }
  showName(name, sub);
  if(busy>0 || pourCtl) return;
  var P = S.paper, btns = null, title = name, st = sub;
  if(pid.indexOf('b_')===0){
    var id = pid.slice(2), d = LIQ[id]; title = d.name; st = d.f;
    btns = d.kind==='ink'
      ? [{t:'Spot on baseline', main:true, fn:function(){ spotInk(id); }}]
      : [{t:'Pour into jar', main:true, fn:function(){ startPourFlow(id); }}];
  } else if(pid==='paper'){
    title = 'Filter paper strip'; st = '';
    var hangBtns = [
      {t:'Hang · vertical, ink end down', main:true, fn:function(){ hang('vd'); }},
      {t:'Hang · vertical, ink end up', fn:function(){ hang('vu'); }},
      {t:'Lay flat across the jar', fn:function(){ hang('h'); }}
    ];
    if(P.state==='table' && S.run.status==='idle') btns = hangBtns;
    else if(P.state==='jar' && S.run.status==='idle') btns = hangBtns.concat([{t:'Take out', fn:takeOut}]);
    else if(P.state==='jar') btns = [{t:'Take out', main:true, fn:takeOut}];
    else if(P.state==='out') btns = [{t:'Keep in beaker', main:true, fn:toBeaker},{t:'Close', fn:closeSheet}];
    else if(P.state==='beaker') btns = [{t:'Take out', main:true, fn:takeOut},{t:'Close', fn:closeSheet}];
    else btns = null;
  } else if(pid==='rod'){
    title = 'Glass rod'; st = '';
    btns = [];
    if(S.rod!=='jar') btns.push({t:'Rest across jar mouth', main:true, fn:function(){ placeRod('jar'); }});
    if(S.rod!=='vert') btns.push({t:'Stand upright in jar', fn:function(){ placeRod('vert'); }});
    if(S.rod!=='table') btns.push({t:'Back on the table', fn:function(){ placeRod('table'); }});
  } else if(pid==='cover'){
    title = 'Watch glass'; st = '';
    btns = [S.cover ? {t:'Remove cover', main:true, fn:toggleCover} : {t:'Cover the jar', main:true, fn:toggleCover}];
  } else if(pid==='pencil'){
    title = 'Pencil'; st = '';
    btns = [
      {t:'Draw baseline', main:true, dis:P.base>=1, fn:drawBaseline},
      {t:'Mark solvent front', dis:P.front>=1, fn:markFront},
      {t:'Mark spot centres', dis:P.centresN>0 && P.centres>=P.centresN, fn:markCentres}
    ];
  } else if(pid==='beaker' && P.state==='beaker'){
    title = 'Beaker'; st = 'Holds the chromatogram.';
    btns = [{t:'Take out chromatogram', main:true, fn:takeOut},{t:'Close', fn:closeSheet}];
  }
  if(btns && btns.length) openSheet(title, st, btns); else { sheetEl.hidden = true; }
}

/* =========================================================
   PART 4: camera, input, loop
   ========================================================= */
var controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.07; controls.maxPolarAngle = Math.PI/2-0.03;
controls.minDistance = 2; controls.maxDistance = 40;
var viewName = 'bench', camTween = null;
function dirFrom(elDeg, azDeg){
  var el = elDeg*Math.PI/180, az = azDeg*Math.PI/180;
  return new V3(Math.sin(az)*Math.cos(el), Math.sin(el), Math.cos(az)*Math.cos(el));
}
function fitDist(halfW, halfH){
  var t = Math.tan(camera.fov*Math.PI/360);
  return Math.max(halfH/t, halfW/(t*camera.aspect))*1.06;
}
function molLocalFocus(){
  var R = S.run, hf = BASE_H+0.1;
  if(R.status!=='idle' && R.mode!=='none') hf = BASE_H + R.rfs[1]*dNow();
  return new V3(laneX(LANES[0].u)+0.1, hf-PH/2, 0);
}
function viewPose(name){
  if(name==='jar'){
    var tj = new V3(0,1.9,0);
    return {t:tj, p:tj.clone().add(dirFrom(12,0).multiplyScalar(fitDist(2.4,2.7)))};
  }
  if(name==='mol'){
    paperG.updateMatrixWorld(true);
    var lf = molLocalFocus();
    return {t:paperG.localToWorld(lf.clone()), p:paperG.localToWorld(lf.clone().add(new V3(0.1,-0.45,0.85)))};
  }
  var tb = new V3(0,0.4,0.6);
  return {t:tb, p:tb.clone().add(dirFrom(62,0).multiplyScalar(fitDist(4.1,5.6)))};
}
function setViewButtons(name){
  Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function(o){ o.setAttribute('aria-pressed', o.dataset.view===name ? 'true':'false'); });
}
function goView(name, dur){
  viewName = name; molTarget = name==='mol' ? 1 : 0;
  controls.minDistance = name==='mol' ? 0.25 : 2;
  var vp = viewPose(name);
  if(reduce){ camera.position.copy(vp.p); controls.target.copy(vp.t); camTween = null; return; }
  camTween = {t0:performance.now(), d:(dur||1.3)*1000, p0:camera.position.clone(), q0:controls.target.clone(), p1:vp.p, q1:vp.t};
  setViewButtons(name);
}
controls.addEventListener('start', function(){ camTween = null; });
Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function(b){
  b.addEventListener('click', function(){ goView(b.dataset.view); });
});

function resize(){
  stageW = stageEl.clientWidth || window.innerWidth; stageH = stageEl.clientHeight || window.innerHeight;
  renderer.setSize(stageW, stageH, false); camera.aspect = stageW/stageH; camera.updateProjectionMatrix();
}
resize();
if(window.ResizeObserver) new ResizeObserver(resize).observe(stageEl); else window.addEventListener('resize', resize);

/* ---------- input ---------- */
var downP = null;
canvas.addEventListener('pointerdown', function(e){ downP = {x:e.clientX, y:e.clientY, t:performance.now()}; });
canvas.addEventListener('pointerup', function(e){
  if(!downP) return;
  var dx = e.clientX-downP.x, dy = e.clientY-downP.y;
  if(dx*dx+dy*dy<64 && performance.now()-downP.t<500) onPick(pickAt(e.clientX, e.clientY));
  downP = null;
});
runBtn.addEventListener('click', function(){ if(!autoOn) startRun(); });
document.getElementById('rst').addEventListener('click', function(){
  if(autoOn){ autoAbort = true; return; }
  if(busy>0){ resetPending = true; return; }
  resetAll();
});

/* ---------- automatic demo ---------- */
var autoBtn = document.getElementById('auto');
function sleep(s){ return tween(s, function(){}); }
async function waitIdle(){ while(busy>0) await sleep(0.1); }
async function doStep(title, sub, fn, pre){
  if(autoAbort) throw 'abort';
  await waitIdle();
  showName(title, sub, 7000);
  await sleep(pre===undefined ? 0.9 : pre);
  if(autoAbort) throw 'abort';
  lastAct = null; fn();
  var p = lastAct; if(p) await p;
  await waitIdle(); await sleep(0.35);
}
async function narrate(title, sub, pre){
  if(autoAbort) throw 'abort';
  await waitIdle(); showName(title, sub, 7000); await sleep(pre===undefined ? 0.9 : pre);
}
async function autoPour(id, ml){
  if(autoAbort) throw 'abort';
  await waitIdle(); closeSheet(); await waitIdle();
  var g = bottles[id], pz = bottlePose(TILT_A);
  busy++;
  try{
    await moveTo(g, pz.p, pz.q, 0.95, 2.6);
    g.userData.cap.visible = false; pourCtl = {id:id, g:g, tilt:TILT_A}; showPourSheet(id);
    pulseLeft = ml;
    while(pulseLeft>0.02 && !autoAbort) await sleep(0.1);
    await sleep(0.6);
    pourCtl = null; pouring = false; pulseLeft = 0; stream.visible = false; sheetEl.hidden = true; roEl = null;
    await moveTo(g, g.userData.home, g.userData.homeQ, 0.9, 2.4);
    g.userData.cap.visible = true;
  } finally { busy--; }
}
async function autoDemo(){
  if(autoOn){ autoAbort = true; return; }
  autoOn = true; autoAbort = false; autoBtn.textContent = 'Stop'; autoBtn.classList.add('on'); sheetEl.style.pointerEvents = 'none';
  try{
    closeSheet(); await waitIdle();
    resetAll(); await sleep(0.2);
    goView('bench',1.2);
    await doStep('Pencil baseline','Draw a line about 1.5 cm from the bottom.', drawBaseline);
    await doStep('Black ink spot','The ink we want to test.', function(){ spotInk('black'); });
    await doStep('Reference dyes','Known single dyes beside it.', function(){ spotInk('yellow'); }, 0.9);
    await doStep('Blue dye','', function(){ spotInk('blue'); }, 0.2);
    await doStep('Red dye','', function(){ spotInk('red'); }, 0.2);
    await narrate('Pour the solvent','22 mL ethanol and 8 mL water.');
    await autoPour('ethanol',22);
    await autoPour('water',8);
    goView('jar',1.2);
    await doStep('Glass rod across the jar','It holds the strip.', function(){ placeRod('jar'); });
    await doStep('Hang the strip','Vertical, ink end down, baseline above the solvent.', function(){ hang('vd'); });
    await doStep('Cover with the watch glass','Keeps the air full of solvent vapour.', toggleCover);
    await narrate('Run','The solvent climbs the paper by capillary action.');
    startRun(); await sleep(0.3); startRun();
    await sleep(6.5);
    goView('mol',1.6);
    await narrate('Inside the paper','Each dye travels at its own speed.',0.2);
    while(S.run.status!=='done' && !autoAbort) await sleep(0.25);
    goView('jar',1.4); await sleep(1.4);
    await doStep('Remove the cover','', toggleCover);
    await doStep('Take the strip out','', takeOut);
    goView('bench',1.4);
    await doStep('Mark the solvent front','Do it before the paper dries.', markFront);
    await doStep('Mark the spot centres','Rf = spot distance / front distance.', markCentres);
    await doStep('Keep it in the beaker','', toBeaker, 0.6);
    showName('Your turn','Press Reset, then try it yourself.',10000);
  }catch(e){ if(e!=='abort') console.error(e); }
  finally{ autoOn = false; autoAbort = false; autoBtn.textContent = 'Auto'; autoBtn.classList.remove('on'); sheetEl.style.pointerEvents = ''; }
}
autoBtn.addEventListener('click', autoDemo);

/* ---------- main loop ---------- */
var last = performance.now(), curl = 0.04;
function frame(now){
  var dt = Math.min(0.05,(now-last)/1000); last = now; var time = now/1000;
  stepTweens(now);
  var R = S.run, P = S.paper, i;
  if(R.status==='running'){
    R.p += dt*R.speed/T; runBtn.style.setProperty('--p',(Math.min(R.p,1)*100).toFixed(1)+'%'); dirty = true;
    if(R.p>=1){ R.p = 1; R.status = 'done'; updRun(); }
  }
  if((P.state==='out' || P.state==='beaker') && R.status!=='idle' && P.wetK>0){ P.wetK = Math.max(0,P.wetK-dt/10); dirty = true; }
  if(dirty && now-lastDraw>28){ drawPaper(); lastDraw = now; dirty = false; }
  molK += (molTarget-molK)*Math.min(1,dt*4);

  /* paper curl */
  var curlT = P.state==='jar' ? (P.orient==='h' ? 0.2 : 1) : (P.state==='beaker' ? 0.4 : 0.04);
  curl += (curlT-curl)*Math.min(1,dt*4);
  var cf = curl*(1-0.88*molK), pa = pgeo.attributes.position.array;
  for(i=0;i<pa.length;i+=3){
    var x = pBase[i], yl = pBase[i+1], hn = (yl+PH/2)/PH;
    pa[i+2] = cf*(0.05*Math.pow(x/(PW/2),2) + 0.012*Math.sin(x*2.1+0.6)*(1-hn)*0.6 + 0.010*Math.sin(hn*7+time*0.9)*hn*(1-hn)*1.6 + 0.006*Math.sin(hn*3+time*0.6+x));
  }
  pgeo.attributes.position.needsUpdate = true; pgeo.computeVertexNormals();
  paperMat.opacity = 1-0.4*molK;

  /* liquid */
  var wt = R.mode==='wash' && R.status!=='idle' ? smooth(0,0.6,R.p)*0.7 : 0;
  liqMat.color.copy(liqBase).lerp(WASHC,wt); surfMat.color.copy(liqMat.color).lerp(WHITE,0.3);
  if(liqOn){
    var amp = (pourCtl && stream.visible) ? 3.2 : 1;
    var sp = surfGeo.attributes.position.array;
    for(i=0;i<sp.length;i+=3){
      var sx = surfBase[i], sz = surfBase[i+2], rr = Math.sqrt(sx*sx+sz*sz);
      sp[i+1] = amp*(0.011*Math.sin(rr*17-time*2.2)*Math.exp(-rr*0.8) + 0.004*Math.sin(sx*5+time*1.3)*Math.cos(sz*4-time*0.9)) + 0.012*Math.pow(rr/LR,6);
    }
    surfGeo.attributes.position.needsUpdate = true; surfGeo.computeVertexNormals();
  }
  bubbles.visible = liqOn;
  if(liqOn){
    var bp = bubGeo.attributes.position.array;
    for(i=0;i<bubN;i++){
      bp[i*3+1] += bubSp[i]*dt; bp[i*3] += Math.sin(time*2+i)*0.0015;
      if(bp[i*3+1] > curLevel-0.02) bp[i*3+1] = 0.13;
    }
    bubGeo.attributes.position.needsUpdate = true;
  }
  if(!reduce){
    var dp = dustGeo.attributes.position.array;
    for(i=0;i<dustN;i++){
      dp[i*3] += dustVel[i][0]*dt; dp[i*3+1] += dustVel[i][1]*dt; dp[i*3+2] += dustVel[i][2]*dt;
      if(dp[i*3+1] > 8) dp[i*3+1] = 0.4;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }

  pourStep(dt);
  updMol(time, dt);
  updOverlay(dt);
  stepBadges(now);

  /* camera */
  if(camTween){
    var k = clamp((now-camTween.t0)/camTween.d,0,1), e = k<0.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(camTween.p0,camTween.p1,e); controls.target.lerpVectors(camTween.q0,camTween.q1,e);
    if(k>=1) camTween = null;
  } else if(viewName==='mol'){
    paperG.updateMatrixWorld(true);
    var fw = paperG.localToWorld(molLocalFocus()), dl = fw.sub(controls.target).multiplyScalar(Math.min(1,dt*6));
    camera.position.add(dl); controls.target.add(dl);
  }
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
resetAll();
(function(){
  var vp = viewPose('bench');
  if(reduce){ camera.position.copy(vp.p); controls.target.copy(vp.t); }
  else {
    camera.position.copy(vp.t).add(dirFrom(30,-35).multiplyScalar(fitDist(4.1,5.6)*1.5)); controls.target.copy(vp.t);
    goView('bench',3.0);
  }
  controls.update();
})();
window.__lab = { state:function(){ return S; }, pick:function(x,y){ onPick(pickAt(x,y)); }, cam:camera, ctl:controls };
requestAnimationFrame(frame);
})();
</script>
