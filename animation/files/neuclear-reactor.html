<!doctype html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>PHWR 3D Learning Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2b;--panel2:#112338;--line:#25415b;--text:#e7f0fa;--muted:#9ab0c7;--green:#38e0a0;--cyan:#53d8f2;--amber:#ffc45b;--red:#ff6b73}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:var(--text);background:#12263a;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
button:hover{border-color:var(--cyan)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr}
.topbar{display:flex;align-items:center;gap:6px;justify-content:space-between;padding:8px 10px;background:#091624;border-bottom:1px solid var(--line);z-index:6}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0fba8d,#1c6c98);display:grid;place-items:center;font-size:19px;flex:none}
.menus{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.menus button{display:flex;align-items:center;gap:5px;padding:7px 10px;font-size:12px;min-width:38px;justify-content:center}
.menus button.open{border-color:var(--cyan);background:#0e3a4d}
.menus button[data-menu="chern"]{border-color:#7a5a1c}
.menus button[data-menu="chern"].open{background:#4a3410;border-color:var(--amber)}
#langBtn{font-weight:700;flex:none;min-width:56px;padding:7px 8px}
.viewport{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 42%,#142c40 0,#07111f 67%);overflow:hidden}
#scene{display:block;width:100%;height:100%;touch-action:none;outline:none}
.dd{position:absolute;top:8px;right:8px;width:min(360px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;z-index:7;box-shadow:0 14px 40px #000a}
.dd.sheet{top:auto;bottom:8px;max-height:48%}
.dd[hidden]{display:none}
.dd h3{font-size:12px;color:var(--cyan);margin:0 0 8px;letter-spacing:.04em}
.dd .sec{padding:10px 0;border-top:1px solid var(--line)}.dd .sec:first-child{border-top:0;padding-top:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-12px;margin:-12px -12px 8px;padding:10px 12px 6px;background:var(--panel);z-index:2;border-radius:12px 12px 0 0}.hd h3{margin:0}
.mini{padding:2px 8px;font-size:12px;border-radius:7px;flex:none}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btnrow button{font-size:12px}.wide{grid-column:1/-1}
.primary{background:#0e493e;border-color:#1c8068}.danger{background:#48222b;border-color:#853945}
.control{margin:10px 0}.control label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}.control output{color:var(--text);font-weight:700}
input[type=range]{width:100%;accent-color:var(--green)}
.toggleline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;margin:9px 0}
.switch{appearance:none;-webkit-appearance:none;width:37px;height:21px;border-radius:20px;background:#34485a;position:relative;border:1px solid #52697d;cursor:pointer;flex:none}
.switch:before{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#d7e2ec;transition:.2s}
.switch:checked{background:#08795f}.switch:checked:before{left:18px;background:#fff}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.metric strong{display:block;color:var(--text);font-size:14px;margin-top:2px}
.statusline{display:flex;align-items:center;gap:7px;font-weight:700;margin:0 0 8px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);color:var(--green);box-shadow:0 0 10px currentColor;flex:none}
.dd p{font-size:12px;color:#c1d0df;margin:0 0 8px}
.dd p.story{font-size:13px;line-height:1.6;color:#dbe7f3}
.dd ul{margin:0;padding-left:18px;font-size:12px;color:#c1d0df}
.dots{display:grid;gap:5px;margin:2px 0 8px}
.dots button{padding:6px 0;font-size:12px}
.dots button.cur{background:#0e493e;border-color:#1c8068;font-weight:700}
.dots button.done{border-color:#2a5a4a;color:#bfe9da}
#chDots button.cur{background:#4a3410;border-color:var(--amber)}
#chDots button.done{border-color:#7a5a1c;color:#ffe2b0}
.warn{font-size:11px;line-height:1.5;color:#ffe2b0;background:#3a2a10;border:1px solid #7a5a1c;border-radius:9px;padding:8px;margin:0 0 8px}
.legend{display:grid;gap:5px;font-size:12px;color:#c9d7e6}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.notice{font-size:11px;line-height:1.5;color:#c3d2e1;background:#13283b;border:1px solid #28465f;border-radius:9px;padding:10px}.notice strong{color:var(--amber)}
.footer{font-size:10px;color:#8098ae;margin-top:8px}
.err{position:fixed;left:8px;right:8px;bottom:8px;z-index:20;background:#48222b;border:1px solid #853945;color:#ffd9dc;border-radius:9px;padding:8px 10px;font-size:11px;white-space:pre-wrap}
.err[hidden]{display:none}
.lbl{position:absolute;transform:translate(-50%,-115%);background:#071522f2;border:1px solid var(--cyan);border-radius:10px;padding:7px 8px 7px 11px;max-width:240px;pointer-events:auto;box-shadow:0 6px 22px #0009;z-index:3}
.lbl::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:#071522;border-right:1px solid var(--cyan);border-bottom:1px solid var(--cyan);transform:translateX(-50%) rotate(45deg)}
.lbl .row{display:flex;align-items:center;gap:6px}
.lbl b{font-size:12px;color:#e6f4ff;flex:1}
.lbl button{padding:2px 7px;font-size:12px;border-radius:7px;line-height:1.4}
.lbl .d{font-size:11px;color:#c1d0df;margin-top:6px;display:none}.lbl.more .d{display:block}
@media(max-width:600px){.menus button span{display:none}.menus button{padding:7px 9px;font-size:15px;min-width:36px}.dd{left:8px;right:8px;width:auto}.topbar{padding:7px 6px}}
@media(max-width:480px){.logo{display:none}}
</style></head>
<body><div class="app">
<header class="topbar">
 <div class="logo">⚛</div>
 <nav class="menus">
  <button data-menu="start" aria-label="Startup">🚀<span data-t="m_start"></span></button>
  <button data-menu="ctrl" aria-label="Controls">⚙<span data-t="m_ctrl"></span></button>
  <button data-menu="safe" aria-label="Safety">🛡<span data-t="m_safe"></span></button>
  <button data-menu="chern" aria-label="Chernobyl">☢<span data-t="m_chern"></span></button>
  <button data-menu="sound" aria-label="Sound"><b id="soundIcon">🔇</b><span data-t="m_sound"></span></button>
  <button data-menu="view" aria-label="View">👁<span data-t="m_view"></span></button>
  <button data-menu="info" aria-label="Info">ℹ<span data-t="m_info"></span></button>
 </nav>
 <button id="langBtn" aria-label="Language">हिं | EN</button>
</header>

<section class="viewport" id="viewport">
 <canvas id="scene"></canvas>

 <!-- Startup -->
 <div class="dd sheet" id="dd-start" hidden>
  <div class="hd"><h3 data-t="h_start"></h3><button class="mini" data-close aria-label="close">✕</button></div>
  <div class="statusline"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
  <div class="metrics">
   <div class="metric"><span data-t="power"></span><strong id="powerRead"></strong></div>
   <div class="metric"><span data-t="temp"></span><strong id="tempRead"></strong></div>
   <div class="metric"><span data-t="flowAnim"></span><strong id="flowRead"></strong></div>
   <div class="metric"><span data-t="shutdown"></span><strong id="scramRead"></strong></div>
  </div>
  <div class="sec"><div class="dots" id="stageDots" style="grid-template-columns:repeat(5,1fr)"></div>
   <h3 id="stageTitle" style="margin-top:4px"></h3><p id="stageDesc"></p>
   <div class="btnrow"><button id="prevBtn"></button><button id="nextBtn" class="primary"></button><button id="autoBtn" class="wide"></button><button id="coldBtn" class="wide"></button></div>
   <p style="margin:9px 0 0" data-t="startNote"></p></div>
 </div>

 <!-- Controls -->
 <div class="dd" id="dd-ctrl" hidden>
  <div class="sec"><h3 data-t="h_params"></h3>
   <div class="control"><label for="power"><span data-t="power"></span><output id="powerOut"></output></label><input id="power" type="range" min="0" max="100" step="1" value="100"></div>
   <div class="control"><label for="temp"><span data-t="temp"></span><output id="tempOut"></output></label><input id="temp" type="range" min="30" max="320" step="5" value="280"></div>
   <div class="toggleline"><span data-t="flowShow"></span><input class="switch" type="checkbox" id="flowToggle" checked></div>
  </div>
  <div class="sec"><div class="btnrow"><button class="wide" id="resetSim"></button></div></div>
 </div>

 <!-- Safety -->
 <div class="dd" id="dd-safe" hidden>
  <div class="sec"><h3 data-t="h_modes"></h3><div class="btnrow"><button class="primary" id="normalMode"></button><button id="safetyMode"></button></div></div>
  <div class="sec"><h3 data-t="h_safety"></h3><div class="btnrow"><button class="danger wide" id="scramBtn"></button><button id="pdhrsBtn"></button><button id="eccsBtn"></button></div>
   <p style="margin-top:9px" data-t="scramNote"></p><p data-t="safetyNote"></p></div>
 </div>

 <!-- Chernobyl -->
 <div class="dd sheet" id="dd-chern" hidden>
  <div class="hd"><h3 data-t="h_chern"></h3><button class="mini" data-close aria-label="close">✕</button></div>
  <div class="warn" data-t="chWarn"></div>
  <div class="dots" id="chDots" style="grid-template-columns:repeat(6,1fr)"></div>
  <h3 id="chTitle" style="color:var(--amber)"></h3><p id="chText" class="story"></p>
  <div class="btnrow"><button id="chPrev"></button><button id="chNext" class="primary"></button><button id="chExit" class="wide"></button></div>
 </div>

 <!-- Sound -->
 <div class="dd" id="dd-sound" hidden>
  <div class="sec"><h3 data-t="h_sound"></h3>
   <div class="btnrow"><button id="soundBtn" class="wide"></button></div>
   <div class="control"><label for="vol"><span data-t="volume"></span><output id="volOut"></output></label><input id="vol" type="range" min="0" max="100" step="5" value="70"></div></div>
  <div class="sec">
   <div class="toggleline"><span data-t="s_mach"></span><input class="switch" type="checkbox" id="tMach"></div>
   <div class="toggleline"><span data-t="s_alarm"></span><input class="switch" type="checkbox" id="tAlarm"></div>
   <div class="toggleline"><span data-t="s_gei"></span><input class="switch" type="checkbox" id="tGei"></div>
   <div class="toggleline"><span data-t="s_narr"></span><input class="switch" type="checkbox" id="tNarr"></div>
   <p data-t="s_note"></p></div>
 </div>

 <!-- View -->
 <div class="dd" id="dd-view" hidden>
  <div class="sec"><h3 data-t="h_view"></h3><div class="btnrow">
   <button id="cutawayBtn"></button><button id="explodeBtn"></button>
   <button id="spinBtn"></button><button id="containmentBtn"></button>
   <button id="rodsBtn"></button><button id="resetView"></button>
   <button id="topBtn"></button><button id="sideBtn"></button></div></div>
 </div>

 <!-- Info -->
 <div class="dd" id="dd-info" hidden>
  <div class="sec"><h3 data-t="i_title"></h3><p data-t="i_sub"></p></div>
  <div class="sec"><h3 data-t="i_how"></h3><ul><li data-t="i_h1"></li><li data-t="i_h2"></li><li data-t="i_h3"></li><li data-t="i_h4"></li></ul></div>
  <div class="sec"><h3 data-t="i_legend"></h3><div class="legend">
   <span><i style="background:#e95e50"></i><span data-t="lg1"></span></span>
   <span><i style="background:#42c8ef"></i><span data-t="lg2"></span></span>
   <span><i style="background:#ffbd4a"></i><span data-t="lg3"></span></span></div></div>
  <div class="sec"><div class="notice"><strong data-t="n_head"></strong> <span data-t="n_body"></span></div><div class="footer" data-t="footer"></div></div>
 </div>
 <div class="err" id="err" hidden></div>
</section>
</div>

<script>

window.addEventListener('unhandledrejection',ev=>showErr(String(ev.reason&&ev.reason.message||ev.reason)));
if(!window.THREE){showErr('3D library unavailable / 3D लाइब्रेरी उपलब्ध नहीं — इंटरनेट जाँचें / check internet.');return;}

/* ================= Text: [Hindi, English] ================= */

flowShow:['शीतलक प्रवाह एनिमेशन दिखाएँ','Show animated coolant flow'],flowAnim:['शीतलक प्रवाह','Coolant flow'],shutdown:['शटडाउन स्थिति','Shutdown state'],

pdhrs:['निष्क्रिय शीतलन','Passive cooling'],eccs:['ECCS (स्टैंडबाय)','ECCS (standby)'],on:['दिखाएँ','shown'],off:['छिपा','hidden'],

chIntroD:['कहानी 12 छोटे चरणों में है। ▶ दबाकर शुरू करें; हर चरण में मॉडल बदलेगा। इसका मकसद डर फैलाना नहीं, बल्कि समझना है कि सुरक्षा नियम और अच्छा डिज़ाइन क्यों ज़रूरी हैं।','The story has 12 short steps. Press ▶ to begin; the model changes at every step. The aim is not fear, but to understand why safety rules and good design matter.'],

{t:['चेरनोबिल: क्या हुआ था?','Chernobyl: what happened?'],d:['26 अप्रैल 1986, रात लगभग 1:23 बजे। चेरनोबिल बिजलीघर (यूक्रेन, तब सोवियत संघ) की यूनिट 4 में इतिहास की सबसे गंभीर परमाणु दुर्घटनाओं में से एक हुई। वह RBMK रिएक्टर था। उसके चारों ओर आज जैसा मज़बूत कंटेनमेंट भवन नहीं था।','26 April 1986, about 1:23 a.m. Unit 4 of the Chernobyl power plant (Ukraine, then the Soviet Union) had one of the most serious nuclear accidents in history. It was an RBMK reactor. It did not have the strong containment building that modern plants have.'],c:{power:100,temp:280,rod:.7,flow:1,turb:1,gen:1,eccs:1,heat:0}},
{t:['शुरुआत: एक सुरक्षा टेस्ट','It began with a safety test'],d:['टेस्ट का सवाल: अगर बाहर से बिजली चली जाए, तो रुकता हुआ टरबाइन कुछ देर पंपों को चला सकता है या नहीं? टेस्ट कई घंटे देर से, रात की शिफ्ट में हुआ, जिसकी तैयारी ठीक से नहीं थी। शक्ति घटाकर लगभग आधी की गई।','The test question: if outside power fails, can the slowing turbine keep the pumps running for a short time? The test was delayed by many hours and done by a night shift that was not well prepared. Power was reduced to about half.'],c:{power:50,temp:275,rod:.7,flow:1,turb:1,gen:1,eccs:1,heat:0}},
{t:['शक्ति बहुत गिर गई','Power fell too low'],d:['शक्ति घटाते समय रिएक्टर में एक गैस (ज़ेनॉन) जमा हो गई जो न्यूट्रॉन सोख लेती है। शक्ति लगभग 1% तक गिर गई और रिएक्टर चलाना कठिन हो गया।','While lowering power, a gas (xenon) built up that soaks up neutrons. Power dropped to about 1% and the reactor became hard to control.'],c:{power:1,temp:265,rod:.5,flow:1,turb:1,gen:0,eccs:1,heat:0}},
{t:['ग़लत फ़ैसले','Wrong decisions'],d:['शक्ति वापस बढ़ाने के लिए ऑपरेटरों ने लगभग सारी कंट्रोल रॉड बाहर खींच लीं और कई सुरक्षा प्रणालियाँ (जैसे आपातकालीन शीतलन) बंद कर दीं, जबकि नियम इसकी अनुमति नहीं देते थे।','To raise power again, the operators pulled out almost all control rods and switched off several safety systems (such as emergency cooling), which the rules did not allow.'],c:{power:7,temp:270,rod:1,flow:1,turb:1,gen:0,eccs:0,heat:.1}},
{t:['रिएक्टर अस्थिर हुआ','The reactor became unstable'],d:['शक्ति अचानक चढ़ने लगी। पानी में भाप के बुलबुले बने, और इस रिएक्टर के डिज़ाइन में ऐसा होने पर शक्ति घटने के बजाय और बढ़ जाती थी। यह एक बड़ी डिज़ाइन कमी थी।','Power began to climb suddenly. Steam bubbles formed in the water, and in this reactor design that made power rise even more instead of falling. This was a major design flaw.'],c:{power:30,temp:290,rod:1,flow:1,turb:1,gen:0,eccs:0,heat:.45}},
{t:['आपातकालीन बटन: AZ-5','The emergency button: AZ-5'],d:['ऑपरेटर ने आपातकालीन शटडाउन (SCRAM) बटन दबाया। पर इन रॉड के निचले सिरे ग्रेफ़ाइट के थे, जिन्होंने घुसते समय पल भर के लिए शक्ति और बढ़ा दी। शक्ति कई गुना हो गई। (आधुनिक रिएक्टरों में SCRAM हमेशा शक्ति घटाता है; "सुरक्षा" मेन्यू में खुद देखें।)','The operator pressed the emergency shutdown (SCRAM) button. But the lower tips of these rods were graphite, which for a moment added power as they went in. Power shot up many times. (In modern reactors SCRAM always lowers power; try it yourself in the Safety menu.)'],c:{power:100,temp:320,rod:0,flow:1,turb:1,gen:0,eccs:0,heat:1,pw:'⚠ ≫100%'}},
{t:['धमाका!','The explosion!'],d:['भाप का दबाव अचानक इतना बढ़ा कि धमाके से रिएक्टर का ऊपरी भाग और छत उड़ गई। यह परमाणु बम जैसा विस्फोट नहीं था (रिएक्टर बम की तरह फट ही नहीं सकता), पर भाप का भयंकर धमाका था जिसने रिएक्टर तोड़ दिया।','Steam pressure rose so suddenly that the blast blew off the top of the reactor and the roof. It was not an atom-bomb type explosion (a reactor cannot explode like a bomb), but a violent steam explosion that destroyed the reactor.'],c:{power:0,temp:320,rod:0,flow:0,turb:0,gen:0,eccs:0,heat:1,lift:1,pw:'—',tp:'—'}},
{t:['आग और रेडियोधर्मी धुआँ','Fire and radioactive smoke'],d:['रिएक्टर का ग्रेफ़ाइट जलने लगा और लगभग 10 दिन तक आग जलती रही। हवा के साथ रेडियोधर्मी कण दूर-दूर तक फैले और कई यूरोपीय देशों तक पहुँचे। गाइगर काउंटर की तेज़ टिक-टिक का मतलब है ज़्यादा रेडिएशन।','The reactor graphite caught fire and burned for about 10 days. Wind carried radioactive particles far away, to many European countries. Fast Geiger-counter clicking means more radiation.'],c:{power:0,temp:320,rod:0,flow:0,turb:0,gen:0,eccs:0,heat:.8,lift:1,fire:1,cloud:1,gei:40,pw:'—',tp:'—'}},
{t:['लोगों पर असर','Effect on people'],d:['पहली रात 2 कर्मचारियों की मौत हुई। कुछ महीनों में कुल लगभग 30 लोग (ज़्यादातर बचाव-कर्मी और फ़ायरफ़ाइटर) रेडिएशन बीमारी से मरे। अगले दिन प्रिप्यात शहर के लगभग 49,000 लोग हटाए गए; बाद में एक लाख से ज़्यादा लोगों को घर छोड़ना पड़ा। कई बच्चों में थायरॉइड कैंसर के मामले बढ़े। आज भी लगभग 30 किमी का क्षेत्र प्रतिबंधित है।','Two workers died the first night. Within months about 30 people in all (mostly rescue workers and firefighters) died of radiation sickness. The next day about 49,000 people of Pripyat city were evacuated; later over a lakh (100,000) people had to leave their homes. Thyroid cancer cases rose among many children. An area of about 30 km around the plant is still restricted.'],c:{power:0,temp:320,rod:0,flow:0,turb:0,gen:0,eccs:0,heat:.6,lift:1,fire:1,cloud:1,zone:1,gei:25,pw:'—',tp:'—'}},
{t:['ढकना और सफ़ाई','Covering and cleaning up'],d:['हज़ारों कर्मियों ने मलबा हटाया। 1986 में रिएक्टर को कंक्रीट-स्टील के "सारकोफ़ैगस" से ढका गया; 2016 में उसके ऊपर एक विशाल नया सुरक्षित ढाँचा (New Safe Confinement) सरकाकर लगाया गया।','Thousands of workers cleared the debris. In 1986 the reactor was covered with a concrete-and-steel "sarcophagus"; in 2016 a giant New Safe Confinement was slid over it.'],c:{power:0,temp:100,rod:0,flow:0,turb:0,gen:0,eccs:0,heat:.1,lift:1,zone:1,sarc:1,gei:8,pw:'—',tp:'—'}},
{t:['हमने क्या सीखा','What we learned'],d:['1) सुरक्षा नियम कभी न तोड़ें और टेस्ट के बहाने सुरक्षा प्रणालियाँ बंद न करें। 2) डिज़ाइन ऐसा हो कि शटडाउन हमेशा शक्ति घटाए, और रिएक्टर के चारों ओर मज़बूत कंटेनमेंट हो। 3) प्रशिक्षण, खुली रिपोर्टिंग और सुरक्षा-संस्कृति ज़रूरी हैं। भारत में परमाणु सुरक्षा की निगरानी AERB करता है; भारतीय PHWR में मज़बूत कंटेनमेंट भवन और तेज़ शटडाउन प्रणालियाँ होती हैं।','1) Never break safety rules or switch off safety systems for a test. 2) Design so that shutdown always lowers power, with a strong containment around the reactor. 3) Training, open reporting and a safety culture are essential. In India nuclear safety is overseen by the AERB; Indian PHWRs have strong containment buildings and fast shutdown systems.'],c:{power:0,temp:50,rod:0,flow:0,turb:0,gen:0,eccs:0,heat:0,lift:1,zone:1,sarc:1,gei:3,pw:'—',tp:'—'}},
{t:['आप क्या कर सकते हैं?','What can you do?'],d:['• अफ़वाहों पर नहीं, आधिकारिक सूचना पर भरोसा करें। • रेडियोधर्मी आपातकाल में सरकारी निर्देश मानें; आम तौर पर घर के अंदर रहने और खिड़की-दरवाज़े बंद रखने की सलाह दी जाती है। • रेडिएशन से बचाव के तीन नियम: समय कम, दूरी ज़्यादा, ढाल (शील्डिंग)। • याद रखें: सही डिज़ाइन और अनुशासन के साथ परमाणु ऊर्जा सुरक्षित रूप से चलाई जा सकती है।','• Trust official information, not rumours. • In a radiation emergency follow government instructions; people are usually told to stay indoors and keep windows and doors closed. • Three rules against radiation: less time, more distance, shielding. • Remember: nuclear power can be run safely with good design and discipline.'],c:{power:0,temp:30,rod:0,flow:0,turb:0,gen:0,eccs:0,heat:0,lift:1,zone:1,sarc:1,gei:2,pw:'—',tp:'—'}}

function auInit(){
 if(AU.ctx)return true;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  const c=AU.ctx=new AC();
  AU.mg=c.createGain();AU.mg.gain.value=0;AU.mg.connect(c.destination);
  const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;

  const humG=c.createGain();humG.gain.value=0;humG.connect(AU.mg);
  const o1=osc('sine',50),o2=osc('sine',100),g2=c.createGain();g2.gain.value=.5;o1.connect(humG);o2.connect(g2);g2.connect(humG);o1.start();o2.start();

}
function auApply(){if(!AU.ctx)return;AU.mg.gain.setTargetAtTime(AU.on?AU.vol*.9:0,AU.ctx.currentTime,.05);}

let lastAmb=0;
function auAmbient(now,power,flow,tsp,gen){

$('#containmentBtn').onclick=()=>setCont(!S.cont);$('#rodsBtn').onclick=()=>setChan(!S.chan);
const topV=()=>{theta=0;phi=.22;radius=fitR()*1.1;userZoom=false;},sideV=()=>{theta=Math.PI/2;phi=1.55;radius=fitR();userZoom=false;};
$('#topBtn').onclick=topV;$('#sideBtn').onclick=sideV;
$('#resetView').onclick=()=>{theta=.72;phi=1.08;userZoom=false;radius=fitR();S.spin=true;setCutaway(false);setExploded(false);};
$('#normalMode').onclick=()=>{setCutaway(false);setExploded(false);setCont(true);setChan(true);[sg,condenser,tower].forEach(m=>m.visible=true);};
$('#safetyMode').onclick=()=>{leaveStory();setCutaway(true);setExploded(true);setEccs(true);setPdhrs(true);};
$('#resetSim').onclick=()=>{stopAuto();S.scram=false;if(S.ch>=0)S.ch=-1;debris.forEach(d=>{d.on=false;d.mesh.visible=false;});shellVis();applyStage(9,true);setCutaway(false);setExploded(false);setCont(true);setChan(true);hideLabel();renderText();};
/* startup */
STG.forEach((s,n)=>{const b=document.createElement('button');b.type='button';b.dataset.n=n;b.textContent=n;b.setAttribute('aria-label',s[0][1]);b.onclick=()=>{leaveStory();stopAuto();S.scram=false;applyStage(n);};$('#stageDots').appendChild(b);});
$('#prevBtn').onclick=()=>{stopAuto();stepStage(-1);};$('#nextBtn').onclick=()=>{stopAuto();stepStage(1);};
$('#autoBtn').onclick=toggleAuto;$('#coldBtn').onclick=()=>{leaveStory();stopAuto();S.scram=false;applyStage(0);};
/* story */
CH.forEach((s,n)=>{const b=document.createElement('button');b.type='button';b.dataset.n=n;b.textContent=n+1;b.setAttribute('aria-label',s.t[1]);b.onclick=()=>setCh(n);$('#chDots').appendChild(b);});
$('#chNext').onclick=()=>setCh(S.ch<0?0:Math.min(CH.length-1,S.ch+1));
$('#chPrev').onclick=()=>{if(S.ch>0)setCh(S.ch-1);else if(S.ch===0)setCh(-1);};
$('#chExit').onclick=()=>setCh(-1);
/* sound */
$('#soundBtn').onclick=()=>{AU.on=!AU.on;if(AU.on){if(!auInit()){AU.on=false;showErr('Audio not supported on this device / इस डिवाइस पर ध्वनि समर्थित नहीं');}else{auResume();auApply();tone(660,.14,'sine',.14);tone(880,.2,'sine',.14,.16);}}else{auApply();try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}auSave();renderText();};
$('#vol').addEventListener('input',e=>{AU.vol=(+e.target.value)/100;auApply();auSave();$('#volOut').textContent=e.target.value+'%';});
[['#tMach','mach'],['#tAlarm','alarm'],['#tGei','gei'],['#tNarr','narr']].forEach(([id,k])=>$(id).addEventListener('change',e=>{AU[k]=e.target.checked;if(k==='narr'&&!AU.narr){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(_){}}auSave();}));

/* ================= Render loop (all motion illustrative) ================= */
let prev=performance.now(),halted=false;const flowEl=$('#flowToggle'),yAxis=new THREE.Vector3(0,1,0);
function frame(now){
if(halted)return;requestAnimationFrame(frame);
try{
const dt=Math.max(0,Math.min(.05,(now-prev)/1000));prev=now;
const cc=S.ch>=0?CH[S.ch].c:null;
if(S.spin&&!pointers.size)theta+=dt*.09;cameraUpdate();
if(shakeT>0){shakeT=Math.max(0,shakeT-dt);const a=shakeT*.5;camera.position.x+=(Math.random()-.5)*a;camera.position.y+=(Math.random()-.5)*a;}
rodLvl+=(S.rod-rodLvl)*Math.min(1,dt*(S.rod<rodLvl?6:1.6));
anim.forEach(({obj,baseY,phase})=>{const wob=(!cc&&rodLvl>.98)?Math.sin(now*.0016+phase)*.08:0;const target=-0.7+(baseY+0.7)*rodLvl+wob;obj.position.y+=(target-obj.position.y)*Math.min(1,dt*6);});
ts+=((S.turb?1:0)-ts)*Math.min(1,dt*(S.turb?.8:.5));rotor.rotation.x+=ts*9*dt;
genGlow+=((S.gen?1:0)-genGlow)*Math.min(1,dt*3);green.emissive.setRGB(.02+.06*genGlow,.24+.36*genGlow,.17+.28*genGlow);
heatCur+=((cc?cc.heat:0)-heatCur)*Math.min(1,dt*1.5);blue.emissive.setRGB(heatCur*.9,heatCur*.12,0);
capLift+=((cc&&cc.lift?1:0)-capLift)*Math.min(1,dt*1.2);
outerCap.position.y=4.4+capLift*9;outerCap.rotation.z=capLift*.6;outerCap.rotation.x=capLift*.25;
if(tween){const mv=(a,b,s)=>Math.abs(b-a)<=s?b:a+Math.sign(b-a)*s;tween.p=mv(tween.p,tween.tp,18*dt);tween.t=mv(tween.t,tween.tt,40*dt);
 $('#power').value=Math.round(tween.p);$('#temp').value=Math.round(tween.t/5)*5;updateReadouts();if(tween.p===tween.tp&&tween.t===tween.tt)tween=null;}
const flow=flowEl.checked;
particles.forEach(p=>{if(flow){p.t=(((p.t+dt*p.speed)%1)+1)%1;p.mesh.visible=true;const pt=p.curve.getPointAt(Math.min(.9999,Math.max(0,p.t)));if(pt)p.mesh.position.copy(pt);}else p.mesh.visible=false;});
/* story effects */
fire.visible=!!(cc&&cc.fire);if(fire.visible){flames.forEach((f,i)=>{f.scale.y=.7+.6*Math.abs(Math.sin(now*.01+i*1.7));f.scale.x=f.scale.z=.8+.3*Math.sin(now*.013+i);});fireLight.intensity=2+Math.random()*1.5;}else fireLight.intensity=0;
zone.visible=!!(cc&&cc.zone);sarc.visible=!!(cc&&cc.sarc);
if(cc&&cc.cloud){puffs.forEach(p=>{p.life+=dt*.07;if(p.life>1)p.life-=1;const t=p.life;p.mesh.visible=true;p.mesh.position.set(p.vx*t,.5+p.vy*t,p.vz*t);const sc=(.6+2.4*t)*(t>.8?(1-t)/.2:1);p.mesh.scale.setScalar(Math.max(.01,sc));});}else puffs.forEach(p=>{p.mesh.visible=false;});
if(boomT<2.2){boomT+=dt;const e=Math.min(1,boomT/2.2);flash.visible=true;flash.scale.setScalar(1+e*11);flash.material.opacity=.9*Math.pow(1-e,1.5);boomLight.intensity=14*(1-e);if(e>=1){flash.visible=false;boomLight.intensity=0;}}
debris.forEach(d=>{if(!d.on)return;d.v.y-=9*dt;d.mesh.position.addScaledVector(d.v,dt);d.mesh.rotation.x+=dt*4;d.mesh.rotation.z+=dt*3;if(d.mesh.position.y<-6.3){d.mesh.position.y=-6.3;d.v.set(0,0,0);d.on=false;}});
auAmbient(now,+$('#power').value,flow,ts,genGlow>.5);
updateLabelPos();renderer.render(scene,camera);
}catch(err){halted=true;showErr('Render error: '+(err&&err.message||err));}
}
setCh(-1,true);resize();radius=fitR();cameraUpdate();renderText();requestAnimationFrame(frame);
})();
</script></body></html>
