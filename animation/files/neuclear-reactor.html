<!doctype html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>PHWR 3D Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2b;--panel2:#112338;--line:#25415b;--text:#e7f0fa;--muted:#9ab0c7;--green:#38e0a0;--cyan:#53d8f2;--amber:#ffc45b;--red:#ff6b73}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:var(--text);background:#12263a;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
button:hover{border-color:var(--cyan)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr}
.topbar{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;background:#091624;border-bottom:1px solid var(--line);z-index:6}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#0fba8d,#1c6c98);display:grid;place-items:center;font-size:20px;flex:none}
.menus{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.menus button{display:flex;align-items:center;gap:6px;padding:8px 11px;font-size:12px}
.menus button.open{border-color:var(--cyan);background:#0e3a4d}
.menus button::after{content:"▾";font-size:10px;color:var(--muted)}
#langBtn{font-weight:700;flex:none;min-width:58px}
.viewport{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 42%,#142c40 0,#07111f 67%);overflow:hidden}
#scene{display:block;width:100%;height:100%;touch-action:none;outline:none}
.dd{position:absolute;top:56px;right:8px;width:min(350px,calc(100% - 16px));max-height:calc(100% - 68px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;z-index:7;box-shadow:0 14px 40px #000a}
.dd[hidden]{display:none}
.dd h3{font-size:12px;color:var(--cyan);margin:0 0 8px;letter-spacing:.04em}
.dd .sec{padding:10px 0;border-top:1px solid var(--line)}.dd .sec:first-child{border-top:0;padding-top:0}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btnrow button{font-size:12px}.wide{grid-column:1/-1}
.primary{background:#0e493e;border-color:#1c8068}.danger{background:#48222b;border-color:#853945}
.control{margin:10px 0}.control label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}.control output{color:var(--text);font-weight:700}
input[type=range]{width:100%;accent-color:var(--green)}
.toggleline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;margin:9px 0}
.switch{appearance:none;width:37px;height:21px;border-radius:20px;background:#34485a;position:relative;border:1px solid #52697d;cursor:pointer;flex:none}
.switch:before{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#d7e2ec;transition:.2s}
.switch:checked{background:#08795f}.switch:checked:before{left:18px;background:#fff}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px}
.metric strong{display:block;color:var(--text);font-size:15px;margin-top:2px}
.statusline{display:flex;align-items:center;gap:7px;font-weight:700;margin:0 0 10px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);color:var(--green);box-shadow:0 0 10px currentColor}
.dd p{font-size:12px;color:#c1d0df;margin:0 0 8px}
.dd ul{margin:0;padding-left:18px;font-size:12px;color:#c1d0df}
.legend{display:grid;gap:5px;font-size:12px;color:#c9d7e6}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.notice{font-size:11px;line-height:1.5;color:#c3d2e1;background:#13283b;border:1px solid #28465f;border-radius:9px;padding:10px}.notice strong{color:var(--amber)}
.footer{font-size:10px;color:#8098ae;margin-top:8px}
.steps{display:grid;gap:6px}.step{text-align:left;font-size:12px}
.step.cur{background:#0e493e;border-color:#1c8068;font-weight:700}
.step.done{border-color:#2a5a4a;color:#bfe9da}.step.done::before{content:"✓ "}
.err{position:fixed;left:8px;right:8px;bottom:8px;z-index:20;background:#48222b;border:1px solid #853945;color:#ffd9dc;border-radius:9px;padding:8px 10px;font-size:11px;white-space:pre-wrap}
.err[hidden]{display:none}
/* tap label */
.lbl{position:absolute;transform:translate(-50%,-115%);background:#071522f2;border:1px solid var(--cyan);border-radius:10px;padding:7px 8px 7px 11px;max-width:240px;pointer-events:auto;box-shadow:0 6px 22px #0009;z-index:3}
.lbl::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:#071522;border-right:1px solid var(--cyan);border-bottom:1px solid var(--cyan);transform:translateX(-50%) rotate(45deg)}
.lbl .row{display:flex;align-items:center;gap:6px}
.lbl b{font-size:12px;color:#e6f4ff;flex:1}
.lbl button{padding:2px 7px;font-size:12px;border-radius:7px;line-height:1.4}
.lbl .d{font-size:11px;color:#c1d0df;margin-top:6px;display:none}.lbl.more .d{display:block}
@media(max-width:600px){.menus button span{display:none}.menus button{padding:8px 10px;font-size:15px}.menus button::after{display:none}.dd{left:8px;right:8px;width:auto}.topbar{padding:7px 8px}}
</style></head>
<body><div class="app">
<header class="topbar">
 <div class="logo">⚛</div>
 <nav class="menus">
  <button data-menu="start" aria-label="Startup">🚀<span data-t="m_start"></span></button>
  <button data-menu="ctrl" aria-label="Controls">⚙<span data-t="m_ctrl"></span></button>
  <button data-menu="safe" aria-label="Safety">🛡<span data-t="m_safe"></span></button>
  <button data-menu="view" aria-label="View">👁<span data-t="m_view"></span></button>
  <button data-menu="stat" aria-label="Status">📊<span data-t="m_stat"></span></button>
  <button data-menu="info" aria-label="Info">ℹ<span data-t="m_info"></span></button>
 </nav>
 <button id="langBtn" aria-label="Language">हिं | EN</button>
</header>

<section class="viewport" id="viewport">
 <canvas id="scene"></canvas>

 <!-- Startup -->
 <div class="dd" id="dd-start" hidden>
  <div class="sec"><h3 data-t="h_start"></h3><div class="steps" id="stageList"></div></div>
  <div class="sec"><p id="stageDesc"></p>
   <div class="btnrow"><button id="prevBtn"></button><button id="nextBtn" class="primary"></button><button id="autoBtn" class="wide"></button><button id="coldBtn" class="wide"></button></div>
   <p style="margin-top:9px" data-t="startNote"></p></div>
 </div>

 <!-- Controls -->
 <div class="dd" id="dd-ctrl" hidden>
  <div class="sec"><h3 data-t="h_params"></h3>
   <div class="control"><label for="power"><span data-t="power"></span><output id="powerOut"></output></label><input id="power" type="range" min="0" max="100" step="5" value="80"></div>
   <div class="control"><label for="temp"><span data-t="temp"></span><output id="tempOut"></output></label><input id="temp" type="range" min="200" max="320" step="5" value="280"></div>
   <div class="toggleline"><span data-t="flowShow"></span><input class="switch" type="checkbox" id="flowToggle" checked></div>
  </div>
  <div class="sec"><div class="btnrow"><button class="wide" id="resetSim"></button></div></div>
 </div>

 <!-- Safety -->
 <div class="dd" id="dd-safe" hidden>
  <div class="sec"><h3 data-t="h_modes"></h3><div class="btnrow"><button class="primary" id="normalMode"></button><button id="safetyMode"></button></div></div>
  <div class="sec"><h3 data-t="h_safety"></h3><div class="btnrow"><button class="danger wide" id="scramBtn"></button><button id="pdhrsBtn"></button><button id="eccsBtn"></button></div>
   <p style="margin-top:9px" data-t="safetyNote"></p></div>
 </div>

 <!-- View -->
 <div class="dd" id="dd-view" hidden>
  <div class="sec"><h3 data-t="h_view"></h3><div class="btnrow">
   <button id="cutawayBtn"></button><button id="explodeBtn"></button>
   <button id="spinBtn"></button><button id="containmentBtn"></button>
   <button id="rodsBtn"></button><button id="resetView"></button>
   <button id="topBtn"></button><button id="sideBtn"></button></div></div>
 </div>

 <!-- Status -->
 <div class="dd" id="dd-stat" hidden>
  <div class="statusline"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
  <div class="metrics">
   <div class="metric"><span data-t="power"></span><strong id="powerRead"></strong></div>
   <div class="metric"><span data-t="temp"></span><strong id="tempRead"></strong></div>
   <div class="metric"><span data-t="flowAnim"></span><strong id="flowRead"></strong></div>
   <div class="metric"><span data-t="shutdown"></span><strong id="scramRead"></strong></div>
  </div>
 </div>

 <!-- Info -->
 <div class="dd" id="dd-info" hidden>
  <div class="sec"><h3 data-t="i_title"></h3><p data-t="i_sub"></p></div>
  <div class="sec"><h3 data-t="i_how"></h3><ul><li data-t="i_h1"></li><li data-t="i_h2"></li><li data-t="i_h3"></li><li data-t="i_h4"></li></ul></div>
  <div class="sec"><h3 data-t="i_legend"></h3><div class="legend">
   <span><i style="background:#e95e50"></i><span data-t="lg1"></span></span>
   <span><i style="background:#42c8ef"></i><span data-t="lg2"></span></span>
   <span><i style="background:#ffbd4a"></i><span data-t="lg3"></span></span></div></div>
  <div class="sec"><div class="notice"><strong data-t="n_head"></strong> <span data-t="n_body"></span></div><div class="footer" data-t="footer"></div></div>
 </div>
<div class="err" id="err" hidden></div>
</section>
</div>

canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pointers.size===1){theta-=(e.clientX-old.x)*.008;phi=Math.max(.25,Math.min(2.75,phi-(e.clientY-old.y)*.008));}

/* ---------- Dropdown menus ---------- */
const menuBtns=[...document.querySelectorAll('[data-menu]')];
function closeMenus(){menuBtns.forEach(b=>{b.classList.remove('open');$('#dd-'+b.dataset.menu).hidden=true;});}
menuBtns.forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const dd=$('#dd-'+b.dataset.menu),wasOpen=!dd.hidden;closeMenus();if(!wasOpen){dd.hidden=false;b.classList.add('open');}}));
document.querySelectorAll('.dd').forEach(d=>d.addEventListener('click',e=>e.stopPropagation()));
document.addEventListener('click',closeMenus);

/* ---------- State appliers ---------- */
function setCutaway(on){S.cutaway=on;[outer,outerCap,inner,innerCap].forEach((m,i)=>{m.material.opacity=on?(i<2?.075:.13):(i<2?.22:.28);});renderText();}
function setExploded(on){S.exploded=on;outer.position.x=outerCap.position.x=on?1.8:0;inner.position.x=innerCap.position.x=on?-.8:0;eccsTank.position.x=on?-7:-6;renderText();}
function setScram(on){
 if(on){stopAuto();S.prevStage=S.stage;S.scram=true;S.rod=0;S.turb=false;S.gen=false;tween={p:+$('#power').value,t:+$('#temp').value,tp:0,tt:+$('#temp').value};renderText();}
 else{S.scram=false;applyStage(S.prevStage);}
}
function applyStage(n,instant){
 S.stage=n;const c=STG[n][2];S.rod=c.rod;S.turb=c.turb;S.gen=c.gen;
 $('#flowToggle').checked=c.flow;setPdhrs(true);setEccs(c.eccs);
 if(instant){rodLvl=c.rod;ts=c.turb?1:0;$('#power').value=c.power;$('#temp').value=c.temp;tween=null;}
 else tween={p:+$('#power').value,t:+$('#temp').value,tp:c.power,tt:c.temp};
 renderText();
}
function stepStage(d){S.scram=false;applyStage(Math.max(0,Math.min(8,S.stage+d)));}
function stopAuto(){if(autoT){clearInterval(autoT);autoT=null;}S.auto=false;}
function toggleAuto(){
 if(S.auto){stopAuto();renderText();return;}
 S.auto=true;
 if(S.scram||S.stage>=8){S.scram=false;applyStage(0,true);}
 stepStage(1);
 autoT=setInterval(()=>{if(S.stage<8)stepStage(1);else{stopAuto();renderText();}},3500);
}
function updateReadouts(){const power=+$('#power').value,temp=+$('#temp').value;$('#powerOut').textContent=power+'%';$('#powerRead').textContent=power+'%';$('#tempOut').textContent=temp+' °C';$('#tempRead').textContent=temp+' °C';}
function setPdhrs(v){S.pdhrs=v;pdhrsPool.visible=v;poolLine.visible=v;renderText();}
function setEccs(v){S.eccs=v;eccsTank.visible=v;eccsLine.visible=v;renderText();}
function setCont(v){S.cont=v;[outer,outerCap,inner,innerCap].forEach(m=>m.visible=v);renderText();}
function setChan(v){S.chan=v;channels.visible=v;fuel.visible=v;renderText();}

/* ---------- Text rendering (language aware) ---------- */
function renderText(){
document.documentElement.lang=lang==='hi'?'hi':'en';
document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tx(el.dataset.t));
const power=+$('#power').value,temp=+$('#temp').value;
$('#powerOut').textContent=power+'%';$('#powerRead').textContent=power+'%';$('#tempOut').textContent=temp+' °C';$('#tempRead').textContent=temp+' °C';
$('#flowRead').textContent=tx($('#flowToggle').checked?'active':'paused');
$('#scramRead').textContent=tx(S.scram?'demoActive':'ready');
$('#statusText').textContent=S.scram?tx('stScram'):STG[S.stage][0][L()];
document.querySelectorAll('#stageList button').forEach(b=>{const n=+b.dataset.n;b.textContent=STG[n][0][L()];b.classList.toggle('cur',n===S.stage&&!S.scram);b.classList.toggle('done',n<S.stage&&!S.scram);});
$('#stageDesc').textContent=S.scram?tx('stScram'):STG[S.stage][1][L()];
$('#prevBtn').textContent=tx('prev');$('#nextBtn').textContent=tx('next');$('#autoBtn').textContent=tx(S.auto?'autoStop':'auto');$('#coldBtn').textContent=tx('cold');
$('#statusDot').style.background=$('#statusDot').style.color=S.scram?'#ffc45b':'#38e0a0';
$('#resetSim').textContent=tx('reset');$('#normalMode').textContent=tx('normal');$('#safetyMode').textContent=tx('safety');
const sb=$('#scramBtn');sb.textContent=tx(S.scram?'scramReset':'scram');sb.classList.toggle('primary',S.scram);sb.classList.toggle('danger',!S.scram);
$('#pdhrsBtn').textContent=tx('pdhrs')+': '+onoff(S.pdhrs);$('#pdhrsBtn').classList.toggle('primary',S.pdhrs);
$('#eccsBtn').textContent=tx('eccs')+': '+onoff(S.eccs);$('#eccsBtn').classList.toggle('primary',S.eccs);
$('#cutawayBtn').textContent=tx(S.cutaway?'cutawayOn':'cutaway');$('#explodeBtn').textContent=tx(S.exploded?'explodeOn':'explode');
$('#spinBtn').textContent=tx(S.spin?'spinPause':'spinResume');
$('#containmentBtn').textContent=tx('cont')+': '+tx(S.cont?'vis':'hid');$('#rodsBtn').textContent=tx('chan')+': '+tx(S.chan?'vis':'hid');
$('#topBtn').textContent=tx('top');$('#sideBtn').textContent=tx('side');$('#resetView').textContent=tx('resetView');
menuBtns.forEach(b=>b.setAttribute('aria-label',tx('m_'+b.dataset.menu==='m_ctrl'?'m_ctrl':'m_'+b.dataset.menu)));
renderLabel();
}

/* ---------- Wiring ---------- */
$('#langBtn').onclick=e=>{e.stopPropagation();lang=lang==='hi'?'en':'hi';try{localStorage.setItem('phwr_lang',lang);}catch(_){}renderText();};
$('#power').addEventListener('input',renderText);$('#temp').addEventListener('input',renderText);$('#flowToggle').addEventListener('change',renderText);
$('#cutawayBtn').onclick=()=>setCutaway(!S.cutaway);$('#explodeBtn').onclick=()=>setExploded(!S.exploded);
$('#spinBtn').onclick=()=>{S.spin=!S.spin;renderText();};
$('#scramBtn').onclick=()=>setScram(!S.scram);$('#pdhrsBtn').onclick=()=>setPdhrs(!S.pdhrs);$('#eccsBtn').onclick=()=>setEccs(!S.eccs);
$('#containmentBtn').onclick=()=>setCont(!S.cont);$('#rodsBtn').onclick=()=>setChan(!S.chan);
$('#topBtn').onclick=()=>{theta=0;phi=.22;radius=34;};$('#sideBtn').onclick=()=>{theta=Math.PI/2;phi=1.55;radius=29;};
$('#resetView').onclick=()=>{theta=.72;phi=1.08;radius=29;S.spin=true;setCutaway(false);setExploded(false);};
$('#normalMode').onclick=()=>{setCutaway(false);setExploded(false);setCont(true);setChan(true);[sg,condenser,tower].forEach(m=>m.visible=true);};
$('#safetyMode').onclick=()=>{setCutaway(true);setExploded(true);setEccs(true);setPdhrs(true);};
$('#resetSim').onclick=()=>{stopAuto();S.scram=false;applyStage(8,true);setCutaway(false);setExploded(false);setCont(true);setChan(true);hideLabel();renderText();};

/* ---------- Start-up wiring ---------- */
STG.forEach((s,n)=>{const b=document.createElement('button');b.type='button';b.dataset.n=n;b.className='step';b.onclick=()=>{stopAuto();S.scram=false;applyStage(n);};$('#stageList').appendChild(b);});
$('#prevBtn').onclick=()=>{stopAuto();stepStage(-1);};$('#nextBtn').onclick=()=>{stopAuto();stepStage(1);};
$('#autoBtn').onclick=toggleAuto;$('#coldBtn').onclick=()=>{stopAuto();S.scram=false;applyStage(0);};
$('#power').addEventListener('input',()=>{tween=null;updateReadouts();});$('#temp').addEventListener('input',()=>{tween=null;updateReadouts();});

/* ---------- Render loop (all motion illustrative) ---------- */
let prev=performance.now(),lastGe=-1,halted=false;
function frame(now){
if(halted)return;requestAnimationFrame(frame);
try{
const dt=Math.max(0,Math.min(.05,(now-prev)/1000));prev=now;
if(S.spin&&!pointers.size)theta+=dt*.09;cameraUpdate();
rodLvl+=(S.rod-rodLvl)*Math.min(1,dt*(S.rod<rodLvl?6:1.6));
anim.forEach(({obj,baseY,phase})=>{const wob=rodLvl>.98?Math.sin(now*.0016+phase)*.08:0;const target=-0.7+(baseY+0.7)*rodLvl+wob;obj.position.y+=(target-obj.position.y)*Math.min(1,dt*6);});
ts+=((S.turb?1:0)-ts)*Math.min(1,dt*1.2);turbine.rotation.z+=ts*1.5*dt;
const ge=S.gen?0x16a874:0x063d2b;if(ge!==lastGe){green.emissive.setHex(ge);lastGe=ge;}
if(tween){const mv=(a,b,s)=>Math.abs(b-a)<=s?b:a+Math.sign(b-a)*s;tween.p=mv(tween.p,tween.tp,14*dt);tween.t=mv(tween.t,tween.tt,30*dt);
 $('#power').value=Math.round(tween.p/5)*5;$('#temp').value=Math.round(tween.t/5)*5;updateReadouts();if(tween.p===tween.tp&&tween.t===tween.tt)tween=null;}
const flow=$('#flowToggle').checked;
particles.forEach(p=>{if(flow){p.t=(((p.t+dt*p.speed)%1)+1)%1;p.mesh.visible=true;const pt=p.curve.getPointAt(Math.min(.9999,Math.max(0,p.t)));if(pt)p.mesh.position.copy(pt);}else p.mesh.visible=false;});
updateLabelPos();renderer.render(scene,camera);
}catch(err){halted=true;showErr('Render error: '+(err&&err.message||err));}
}
applyStage(8,true);resize();cameraUpdate();requestAnimationFrame(frame);
})();
</script></body></html>
