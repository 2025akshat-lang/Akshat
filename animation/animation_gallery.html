<title>Interactive Science Animation Showcase</title>
<style>
  :root {
    --bg-dark: #090d16;
    --card-bg: #121826;
    --border-color: rgba(56, 189, 248, 0.18);
    --hover-border: rgba(56, 189, 248, 0.6);
    --accent-blue: #38bdf8;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 30px 20px;
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, #090d16 80%);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--text-primary);
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* LIGHTWEIGHT CARD (no blur / no heavy shadows -> smooth on weak devices) */
  .card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid var(--border-color);
    transition: transform 0.25s ease, border-color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    animation: fadeInUp 0.5s ease forwards;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (hover: hover) {
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--hover-border);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; }
  }

  /* Thumbnail box has the SAME ratio as the SVG viewBox -> no empty space on any device */
  .card-thumbnail {
    width: 100%;
    aspect-ratio: 300 / 190;
    position: relative;
    overflow: hidden;
    background: #0b1329;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .card-thumbnail svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-content {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-grow: 1;
    background: #0d1117;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 12px;
    line-height: 1.4;
    letter-spacing: 0.2px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    gap: 8px;
  }

  .card-author {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .badge {
    background: #0284c7;
    color: #ffffff;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>
