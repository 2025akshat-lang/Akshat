<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Interactive Science Models</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #050a14;
    --bg-panel: rgba(255, 255, 255, 0.045);
    --bg-panel-hover: rgba(255, 255, 255, 0.075);
    --line: rgba(255, 255, 255, 0.09);
    --wave: #2dd4bf;
    --wave-dim: rgba(45, 212, 191, 0.35);
    --coral: #fb923c;
    --text-primary: #eef2f7;
    --text-muted: #8b98ab;
    --header-h: clamp(64px, 9vh, 84px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; /* the .page owns the one scroll region below */
  }

  h1, h2, .card-title, .modal-title {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
  }

  .page {
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
  }

  /* ---------- HEADER + WAVE DIVIDER ---------- */
  .site-header {
    flex: 0 0 auto;
    width: 100%;
    padding: clamp(14px, 2.4vh, 22px) clamp(18px, 4vw, 48px) 0;
    background: linear-gradient(180deg, #070d1a 0%, #050a14 100%);
    padding-top: max(clamp(14px, 2.4vh, 22px), env(safe-area-inset-top));
  }

  .header-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .site-title {
    margin: 0;
    font-size: clamp(20px, 2.6vw, 30px);
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .site-title span {
    color: var(--wave);
  }

  .site-subtitle {
    margin: 0;
    color: var(--text-muted);
    font-size: clamp(12px, 1.4vw, 14px);
  }

  .wave-track {
    width: 100%;
    height: 22px;
    overflow: hidden;
    margin-top: clamp(12px, 2vh, 18px);
  }

  .wave-track svg {
    width: 200%;
    height: 100%;
    animation: drift 14s linear infinite;
    display: block;
  }

  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---------- MAIN SCROLL SHELL ---------- */
  .gallery-shell {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    overflow: auto;
    padding: clamp(18px, 3vh, 32px) clamp(18px, 4vw, 48px);
    padding-bottom: max(clamp(18px, 3vh, 32px), env(safe-area-inset-bottom));
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(220px, 30vw, 300px), 1fr));
    gap: clamp(14px, 2vw, 26px);
    width: 100%;
  }

  /* ---------- CARD ---------- */
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), background 0.35s ease, box-shadow 0.35s ease;
    display: flex;
    flex-direction: column;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-5px);
    background: var(--bg-panel-hover);
    box-shadow: 0 18px 40px -12px rgba(45, 212, 191, 0.25);
  }

  .card:focus-visible { outline: 2px solid var(--wave); outline-offset: 2px; }

  .card-thumbnail {
    width: 100%;
    aspect-ratio: 16 / 10;
    position: relative;
    overflow: hidden;
  }

  .card-thumbnail svg.art { width: 100%; height: 100%; display: block; }

  /* wavy edge blending thumbnail into content */
  .thumb-wave {
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 22px;
    width: 100%;
    display: block;
    transition: transform 0.4s ease;
  }

  .card:hover .thumb-wave { transform: translateY(-3px) scaleY(1.15); }

  .card-content {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
  }

  .card-author { font-size: 12px; color: var(--text-muted); }

  .badge {
    background: rgba(45, 212, 191, 0.15);
    color: var(--wave);
    border: 1px solid var(--wave-dim);
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(3, 6, 12, 0.86);
    backdrop-filter: blur(10px);
    z-index: 9999;
    padding: clamp(10px, 2.5vw, 28px);
    place-items: center;
  }

  .modal-overlay.open { display: grid; }

  .modal-container {
    width: min(1200px, 100%);
    height: min(92dvh, 900px);
    background: #0b111f;
    border-radius: 18px;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.7);
  }

  .modal-header {
    flex: 0 0 auto;
    padding: 12px 16px;
    background: #101828;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--wave);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .close-btn {
    flex: 0 0 auto;
    background: var(--coral);
    color: #1a0f04;
    border: none;
    padding: 7px 14px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    transition: filter 0.2s ease;
  }

  .close-btn:hover { filter: brightness(1.1); }

  .modal-body {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    overflow: auto; /* scrollable in both directions if content needs it */
    background: #000;
  }

  .modal-body iframe {
    width: 100%;
    height: 100%;
    min-width: 320px;
    min-height: 320px;
    border: none;
    display: block;
  }

  @media (max-width: 640px) {
    .modal-overlay { padding: 0; }
    .modal-container {
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .wave-track svg { animation: none; }
    .card, .thumb-wave { transition: none; }
  }
</style>
</head>

    { id: 2, title: "Evaporation Vs Boiling", author: "Class 9th Science Model", svg: "evapVsBoil", file: "https://2025akshat-lang.github.io/Akshat/animation/files/Evaporation%20Vs%20boiling.html" },
    { id: 3, title: "Distillation Setup Model", author: "Class 9th Science Model", svg: "distil", file: "https://2025akshat-lang.github.io/Akshat/animation/files/Distillation%20setup.html" },
    { id: 4, title: "Crystallization Process", author: "Class 9th Science Model", svg: "crystal", file: "https://2025akshat-lang.github.io/Akshat/animation/files/crystallization.html" },
    { id: 5, title: "Vacuum Evaporation", author: "Class 9th Science Model", svg: "vacuumEvap", file: "https://2025akshat-lang.github.io/Akshat/animation/files/vaccum%20evaporation.html" },
    { id: 6, title: "Chromatography", author: "Class 9th Science Model", svg: "chromatography", file: "https://2025akshat-lang.github.io/Akshat/animation/files/Chromatography.html" },
    { id: 7, title: "Carbon Cycle", author: "Class 9th Science Model", svg: "carbonCycle", file: "https://2025akshat-lang.github.io/Akshat/animation/files/Carbon%20cycle.html" },
    { id: 8, title: "Magnets Direction", author: "Class 9th Science Model", svg: "magnets", file: "https://2025akshat-lang.github.io/Akshat/animation/files/Magnets%20direction.html" },
    { id: 9, title: "Solubility", author: "Class 9th Science Model", svg: "solubility", file: "https://2025akshat-lang.github.io/Akshat/animation/files/Solubility.html" },
    { id: 10, title: "Sublimation", author: "Class 9th Science Model", svg: "sublimation", file: "https://2025akshat-lang.github.io/Akshat/animation/files/Sublimation.html" },
    { id: 11, title: "Solar System", author: "Class 9th Science Model", svg: "solarSystem", file: "https://2025akshat-lang.github.io/Akshat/animation/files/solar%20system.html" },
    { id: 12, title: "Tyndall Effect", author: "Class 9th Science Model", svg: "tyndall", file: "https://2025akshat-lang.github.io/Akshat/animation/files/tyndall%20effect.html" }
  ];

  const grid = document.getElementById('cardsGrid');
  const modal = document.getElementById('simModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalFrame = document.getElementById('modalFrame');
  const closeBtn = document.getElementById('closeBtn');

  function render() {
    grid.innerHTML = data.map(item => `
      <div class="card" tabindex="0" role="button" data-title="${item.title}" data-file="${item.file}">
        <div class="card-thumbnail">
          ${svgThumbnails[item.svg] || svgThumbnails.crystal}
          ${waveSeparator}
        </div>
        <div class="card-content">
          <p class="card-title">${item.title}</p>
          <div class="card-footer">
            <span class="card-author">${item.author}</span>
            <span class="badge">Simulation</span>
          </div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openModal(card.dataset.title, card.dataset.file));
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openModal(card.dataset.title, card.dataset.file);
        }
      });
    });
  }

  function openModal(title, file) {
    modalTitle.innerText = title;
    modalFrame.src = file;
    modal.classList.add('open');
    // lock the background page scroll while the modal owns its own
    // scroll region — this is what removed the old double-scroll glitch
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modalFrame.src = '';
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }

  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  render();
</script>
</body>
</html>
