<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mixture Chapter</title>
<style>
:root{--bg:#070b14;--panel:#0d1424;--line:rgba(56,189,248,.2);--acc:#e0527a;--blue:#38bdf8;--tx:#f1f5f9;--sub:#94a3b8}
*{box-sizing:border-box;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100dvh}
[hidden]{display:none!important}

/* Chhoti top bar (sirf animation ke time) */
.bar{flex:none;height:36px;display:flex;align-items:center;gap:4px;padding:3px 4px;padding-top:max(3px,env(safe-area-inset-top));background:#0b1220;border-bottom:1px solid var(--line);box-sizing:content-box}
body.home .bar,body.imm .bar{display:none}
.btn{flex:none;width:32px;height:30px;border-radius:8px;background:#121b2e;color:var(--tx);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700;cursor:pointer;padding:0}
.btn:active{background:#1e2c48}
.btn.on{background:var(--acc);border-color:transparent}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.title{flex:1;min-width:0;text-align:center;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Stage: poori jagah, koi margin/padding nahi */
#stage{flex:1;position:relative;min-height:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:2}
.sp{width:30px;height:30px;border:4px solid #1e293b;border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

/* Home: sirf icon tiles */
#home{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;padding:6px;padding-top:max(6px,env(safe-area-inset-top))}
@media(orientation:landscape){#home{grid-template-columns:repeat(4,1fr)}}
.tile{border:1px solid rgba(255,255,255,.08);border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px;font-size:14px;font-weight:700;line-height:1.25;text-align:center;cursor:pointer;min-height:0}
.tile:active{transform:scale(.97)}
.tile i{font-style:normal;font-size:clamp(32px,9vh,54px);line-height:1}

/* Immersive: bar chhupa do, sirf ek chhota button */
#peek{position:fixed;top:6px;right:6px;z-index:15;width:28px;height:28px;border-radius:50%;border:0;background:rgba(15,23,42,.6);color:#fff;font-size:14px;cursor:pointer;display:none;place-items:center;padding:0}
body.imm #peek{display:grid}

/* Menu drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#menu{position:fixed;z-index:30;top:0;left:0;bottom:0;width:min(78vw,300px);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#menu.on{transform:none}
.mh{display:flex;gap:6px;padding:6px}
.mh .home{flex:1;height:38px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.mh .btn{width:38px;height:38px}
.list{overflow-y:auto;padding:0 6px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.item{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:#0a1020;border:1px solid var(--line);border-radius:10px;padding:7px 8px;color:var(--tx);cursor:pointer}
.item.act{border-color:var(--acc);background:#1a1230}
.ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:17px;flex:none}
.tx{min-width:0;flex:1}
.tx b{display:block;font-size:13px;font-weight:600}
.tx span{display:block;font-size:11px;color:var(--sub)}
@media(prefers-reduced-motion:reduce){.sp{animation:none}#menu,#scrim{transition:none}}
</style>
</head>
<body class="home">
<div class="bar">
  <button class="btn" id="hm" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <button class="btn" id="tg" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="title" id="tt"></div>
  <button class="btn" id="pv" aria-label="Pichla">‹</button>
  <button class="btn" id="nx" aria-label="Agla">›</button>
  <button class="btn" id="rl" aria-label="Reload">⟳</button>
  <button class="btn" id="im" aria-label="Full view"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="stage">
  <div id="home"></div>
  <div id="loader" hidden><div class="sp"></div></div>
</div>

  <div class="mh"><button class="home" id="hm2">🏠 Home</button><button class="btn" id="cl" aria-label="Band karo">✕</button></div>
  <div class="list" id="list"></div>
</aside>

 {id:"crystal",title:"Crystallization",hi:"क्रिस्टलीकरण",icon:"💎",c:"#4338ca,#1e1b4b"},
 {id:"chroma",title:"Chromatography",hi:"वर्णलेखन",icon:"🧫",c:"#047857,#022c22"},
 {id:"sandsalt",title:"Sand, Salt & Naphthalene",hi:"रेत, नमक, नैफ्थलीन",icon:"🧂",c:"#57534e,#1c1917"}
];

const $=id=>document.getElementById(id);
let frame=null,cur=null;
function dec(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(u)}

$("home").innerHTML=SIMS.map(s=>`<button class="tile" data-id="${s.id}" style="background:linear-gradient(145deg,${s.c})"><i>${s.icon}</i>${s.title}</button>`).join("");
function renderList(){
  $("list").innerHTML=SIMS.map(s=>`<button class="item${s.id===cur?" act":""}" data-id="${s.id}">
    <span class="ic" style="background:linear-gradient(145deg,${s.c})">${s.icon}</span>
    <span class="tx"><b>${s.title}</b><span>${s.hi}</span></span></button>`).join("");
}
function menu(open){
  $("menu").classList.toggle("on",open);$("scrim").classList.toggle("on",open);$("tg").classList.toggle("on",open);
}
function killFrame(){ /* ek time par ek hi iframe: purana hatate hi timers/WebGL/animation ruk jata hai */
  if(frame){try{frame.src="about:blank"}catch(e){}frame.remove();frame=null}
}
function immersive(on){document.body.classList.toggle("imm",on)}
function showHome(){
  killFrame();cur=null;menu(false);immersive(false);
  $("loader").hidden=true;$("home").hidden=false;document.body.classList.add("home");
}
function openSim(id){
  const s=SIMS.find(x=>x.id===id);if(!s||!B64[id])return;
  killFrame();cur=id;
  $("tt").textContent=s.title;
  $("home").hidden=true;document.body.classList.remove("home");$("loader").hidden=false;
  const f=document.createElement("iframe");
  f.setAttribute("allow","fullscreen; autoplay");
  f.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups");
  f.addEventListener("load",()=>{$("loader").hidden=true});
  f.srcdoc=dec(B64[id]);
  $("stage").appendChild(f);frame=f;
  renderList();
}
function step(d){
  const i=cur?SIMS.findIndex(s=>s.id===cur):0;
  openSim(SIMS[(i+d+SIMS.length)%SIMS.length].id);
}
$("home").addEventListener("click",e=>{const b=e.target.closest(".tile");if(b)openSim(b.dataset.id)});
$("list").addEventListener("click",e=>{const b=e.target.closest(".item");if(b){openSim(b.dataset.id);menu(false)}});
$("tg").addEventListener("click",()=>menu(!$("menu").classList.contains("on")));
$("cl").addEventListener("click",()=>menu(false));
$("scrim").addEventListener("click",()=>menu(false));
$("hm").addEventListener("click",showHome);
$("hm2").addEventListener("click",showHome);
$("pv").addEventListener("click",()=>step(-1));
$("nx").addEventListener("click",()=>step(1));
$("rl").addEventListener("click",()=>{if(cur)openSim(cur)});
$("im").addEventListener("click",()=>immersive(true));
$("peek").addEventListener("click",()=>immersive(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){menu(false);immersive(false)}});
renderList();
</script>
</body>
</html>
