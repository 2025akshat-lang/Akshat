<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 6-C Science Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;
background:linear-gradient(135deg,#7b2ff7 0%,#f107a3 50%,#ff8a00 100%);background-attachment:fixed;overflow-x:hidden}
.wrap{width:100%;margin:0;padding:0}
header{width:100%;padding:28px 12px 8px;text-align:center}
h1{font-size:clamp(26px,5vw,48px);font-weight:800;letter-spacing:.5px;text-shadow:0 3px 12px rgba(0,0,0,.25)}
.sub{margin-top:6px;font-size:14px;opacity:.95;letter-spacing:1.5px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;padding:16px 6px 6px}
.stat{background:rgba(255,255,255,.2);border-radius:16px;padding:14px 8px;text-align:center;animation:pop .5s ease both}
.stat i{font-style:normal;font-size:24px;display:block}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.3}
.stat span{font-size:12px;opacity:.95}

.podium{display:flex;justify-content:center;align-items:flex-end;gap:6px;width:100%;padding:18px 6px 0}
.pod{flex:1;max-width:260px;text-align:center;border-radius:18px 18px 0 0;padding:12px 6px;color:#222;animation:rise .7s ease both}
.pod .m{font-size:34px}
.pod .n{font-weight:700;font-size:15px}
.pod .r{font-size:12px;opacity:.85}
.pod .s{font-size:24px;font-weight:800}
.p1{height:200px;background:linear-gradient(180deg,#ffe259,#ffa751);order:2}
.p2{height:165px;background:linear-gradient(180deg,#f5f7fa,#b8c6db);order:1;animation-delay:.15s}
.p3{height:140px;background:linear-gradient(180deg,#ffcc9a,#e2874a);order:3;animation-delay:.3s}

.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;padding:18px 6px 10px}
.bar input,.bar button{height:42px;padding:0 18px;border:0;border-radius:21px;font:inherit;font-size:14px;outline:none}
.bar input{flex:1 1 220px;max-width:360px;background:#fff;color:#333}
.bar button{background:rgba(255,255,255,.25);color:#fff;cursor:pointer;transition:background .2s,color .2s}
.bar button:hover{background:rgba(255,255,255,.45)}
.bar button.on{background:#fff;color:#7b2ff7;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;width:100%;padding:0 6px 20px}
.card{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.12));border-left:6px solid var(--c);border-radius:16px;padding:16px;transition:transform .2s,box-shadow .2s;animation:pop .45s ease both}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.25)}
.top{display:flex;align-items:center;gap:12px}
.roll{flex:0 0 56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;background:var(--c);color:#222}
.lbl{font-size:11px;opacity:.85;letter-spacing:1px}
.nm{font-weight:700;font-size:15px;word-break:break-word}
.tag{position:absolute;top:10px;right:10px;font-size:11px;padding:3px 9px;border-radius:12px;background:rgba(0,0,0,.25)}
.marks{margin:14px 0 8px;display:flex;align-items:baseline;gap:6px}
.marks b{font-size:40px;font-weight:800;color:var(--c);text-shadow:0 1px 6px rgba(0,0,0,.35)}
.marks span{opacity:.9;font-size:14px}
.pct{margin-left:auto;font-style:normal;font-weight:800;font-size:16px;padding:4px 12px;border-radius:14px;background:var(--c);color:#222}
.pod .p{font-size:14px;font-weight:700;opacity:.9}
.track{height:10px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden}
.fill{height:100%;width:0;border-radius:6px;background:var(--c);transition:width 1s ease-out}
footer{text-align:center;padding:16px 6px 24px;font-size:13px;opacity:.9}

@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.pod .n{font-size:13px}.p1{height:180px}.p2{height:150px}.p3{height:130px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Class 6-C Science Mock Test</h1>
    <div class="sub">DATE: 07/11/2026 &nbsp;|&nbsp; TOTAL MARKS: 50</div>
  </header>
  <section class="stats" id="stats"></section>
  <section class="podium" id="podium"></section>
  <section class="bar">
    <input id="q" type="search" placeholder="Search by roll number or name">
    <button class="on" data-s="roll" type="button">Roll No. (Low to High)</button>
    <button data-s="marks" type="button">Marks (High to Low)</button>
  </section>
  <main class="grid" id="grid"></main>
  <footer>Class 6-C &bull; Science Mock Test Results</footer>
</div>

<script>
(function(){
"use strict";
var D=[
{r:5,n:"Vedanshi",m:33},{r:6,n:"Aarohi Rajput",m:24},{r:9,n:"Aarushi",m:31},
{r:11,n:"Rashi",m:11},{r:12,n:"Kanak",m:19.5},{r:13,n:"Palak",m:24},
{r:14,n:"Radhika",m:21},{r:18,n:"Monika",m:32.5},{r:19,n:"Radha Kumari",m:30},
{r:20,n:"Khushi",m:23.5},{r:21,n:"Vandana",m:26},{r:26,n:"Nivedita Chauhan",m:43},
{r:27,n:"Anshika Dubey",m:35},{r:33,n:"Khushi",m:6}
];
var ranked=D.slice().sort(function(a,b){return b.m-a.m});
function col(m){return m>=40?"#00e68a":m>=30?"#4fc3ff":m>=20?"#ffd93d":"#ff6b8b"}
function tag(m){return m>=40?"Excellent":m>=30?"Very Good":m>=20?"Good":"Needs Practice"}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function pct(m){var p=m/50*100;return Number.isInteger(p)?String(p):p.toFixed(1)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

var total=D.reduce(function(a,b){return a+b.m},0);
var stats=[
 ["\uD83D\uDC69\u200D\uD83C\uDF93",D.length,0,"Students"],
 ["\uD83E\uDD47",ranked[0].m,1,"Highest Marks"],
 ["\uD83D\uDCCA",total/D.length,1,"Class Average"],
 ["\u2705",D.filter(function(d){return d.m>=25}).length,0,"Scored 25 or More"]
];
var st=document.getElementById("stats");
st.innerHTML=stats.map(function(s,i){
 return '<div class="stat" style="animation-delay:'+(i*0.08)+'s"><i>'+s[0]+'</i><b data-t="'+s[1]+'" data-d="'+s[2]+'">0</b><span>'+s[3]+'</span></div>';
}).join("");
Array.prototype.forEach.call(st.querySelectorAll("b"),function(el){
 var to=parseFloat(el.dataset.t),dec=parseInt(el.dataset.d,10),t0=null;
 function step(ts){
  if(t0===null)t0=ts;
  var p=Math.min((ts-t0)/900,1);
  el.textContent=(to*p).toFixed(dec);
  if(p<1)requestAnimationFrame(step);
 }
 requestAnimationFrame(step);
});

var medals=["\uD83E\uDD47","\uD83E\uDD48","\uD83E\uDD49"];
document.getElementById("podium").innerHTML=ranked.slice(0,3).map(function(d,i){
 return '<div class="pod p'+(i+1)+'"><div class="m">'+medals[i]+'</div><div class="n">'+esc(d.n)+'</div><div class="r">Roll No. '+d.r+'</div><div class="s">'+fmt(d.m)+'/50</div><div class="p">'+pct(d.m)+'%</div></div>';
}).join("");

var grid=document.getElementById("grid"),sort="roll",term="";
function render(){
 var list=D.filter(function(d){return (d.n+" "+d.r).toLowerCase().indexOf(term)!==-1});
 list.sort(function(a,b){return sort==="roll"?a.r-b.r:b.m-a.m});
 if(!list.length){grid.innerHTML='<p style="padding:24px;text-align:center;grid-column:1/-1">No student found.</p>';return}
 grid.innerHTML=list.map(function(d,i){
  return '<div class="card" style="--c:'+col(d.m)+';animation-delay:'+Math.min(i*0.04,0.5)+'s">'+
   '<span class="tag">'+tag(d.m)+'</span>'+
   '<div class="top"><div class="roll">'+d.r+'</div><div><div class="lbl">ROLL NO.</div><div class="nm">'+esc(d.n)+'</div></div></div>'+
   '<div class="marks"><b>'+fmt(d.m)+'</b><span>/ 50 marks</span><em class="pct">'+pct(d.m)+'%</em></div>'+
   '<div class="track"><div class="fill" data-w="'+(d.m/50*100)+'"></div></div></div>';
 }).join("");
 requestAnimationFrame(function(){requestAnimationFrame(function(){
  Array.prototype.forEach.call(grid.querySelectorAll(".fill"),function(f){f.style.width=f.dataset.w+"%"});
 })});
}
var timer;
document.getElementById("q").addEventListener("input",function(e){
 clearTimeout(timer);var v=e.target.value.trim().toLowerCase();
 timer=setTimeout(function(){term=v;render()},120);
});
Array.prototype.forEach.call(document.querySelectorAll(".bar button"),function(b){
 b.addEventListener("click",function(){
  Array.prototype.forEach.call(document.querySelectorAll(".bar button"),function(x){x.classList.remove("on")});
  b.classList.add("on");sort=b.dataset.s;render();
 });
});
render();
})();
</script>
</body>
</html>
