<style>
/* Layout: one infinite pan/zoom canvas. Each note page nests inside a drawing on its parent page and fades in as you pinch toward it. */
:root{
  --bg:#f3dfe4; --paper:#fdf0f2; --paper2:#fff8f9; --ink:#8c1235; --ink2:#b5546e;
  --rose:#f290a6; --rosed:#d13f60; --tissue:#f8bfcc; --purple:#7b50c4; --gold:#f2c35c;

  --f-ui:'Nunito',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print',cursive; --f-script:'Yellowtail','Brush Script MT',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150a0f; --paper:#26121a; --paper2:#321a24; --ink:#ff9db4; --ink2:#d98ba1;
  --rose:#c9506d; --rosed:#ff7a98; --tissue:#5c2b3c; --purple:#a98cff; --gold:#e8b24c;
  --skin:#7b4b3c; --lime:#9aae2a; --chrome:#2e1722; --chrome-fg:#ffd3de; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150a0f; --paper:#26121a; --paper2:#321a24; --ink:#ff9db4; --ink2:#d98ba1;
  --rose:#c9506d; --rosed:#ff7a98; --tissue:#5c2b3c; --purple:#a98cff; --gold:#e8b24c;
  --skin:#7b4b3c; --lime:#9aae2a; --chrome:#2e1722; --chrome-fg:#ffd3de; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--chrome-fg);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;display:flex;flex-direction:column;gap:10px;overflow:hidden;box-sizing:border-box}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-width:0}
.crumb{font:800 13px var(--f-ui);border:0;border-radius:999px;background:var(--chrome);color:var(--chrome-fg);padding:8px 13px;cursor:pointer;white-space:nowrap}
.crumb[aria-current="true"]{background:var(--rosed);color:#fff}
.sep{opacity:.5;font-weight:800}
.crumb:focus-visible,.ctl:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.zoomlbl{font:700 13px var(--f-ui);opacity:.75;font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;background:var(--bg);touch-action:none;cursor:grab;box-shadow:inset 0 0 0 2px var(--tissue)}
svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.dock{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px}
.ctl{font:800 22px/1 var(--f-ui);border:0;border-radius:999px;background:var(--chrome);color:var(--chrome-fg);width:44px;height:44px;padding:0;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.hint{position:absolute;left:12px;bottom:12px;max-width:66%;font:700 12.5px/1.35 var(--f-ui);padding:8px 12px;border-radius:12px;background:var(--chrome);opacity:.94;pointer-events:none}

.paper{fill:var(--paper);stroke:var(--tissue);stroke-width:4}
.f-ink{fill:var(--ink)}.f-ink2{fill:var(--ink2)}.f-rose{fill:var(--rose)}.f-rosed{fill:var(--rosed)}
.f-tissue{fill:var(--tissue)}.f-purple{fill:var(--purple)}.f-gold{fill:var(--gold)}.f-paper2{fill:var(--paper2)}
.f-skin{fill:var(--skin)}.f-lime{fill:var(--lime)}
.f-hl{fill:#fff;opacity:.55}
.s{fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-rose{stroke:var(--rose)}.s-rosed{stroke:var(--rosed)}.s-ink{stroke:var(--ink)}.s-purple{stroke:var(--purple)}.s-gold{stroke:var(--gold)}.s-tissue{stroke:var(--tissue)}
.hand{font-family:var(--f-hand);font-weight:700}
.sub{font-family:var(--f-hand);font-weight:500}
.script{font-family:var(--f-script)}
.arr{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ah)}
.arrp{fill:none;stroke:var(--purple);stroke-width:16;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ahp)}
.mk{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cue{fill:none;stroke:var(--gold);stroke-width:4;stroke-dasharray:2 9;stroke-linecap:round;cursor:pointer}
.cue-t{font-family:var(--f-hand);font-weight:700;fill:var(--ink2);cursor:pointer}
@media (prefers-reduced-motion:no-preference){.cue{animation:spin 6s linear infinite}@keyframes spin{to{stroke-dashoffset:-110}}}
</style>

  document.querySelectorAll('.pg').forEach(function(el){
    var id=el.getAttribute('data-id'), pe=el.parentNode.closest?el.parentNode.closest('.pg'):null, p=pe?pages[pe.getAttribute('data-id')]:null, o;
    if(!p){o={id:id,el:el,name:el.getAttribute('data-name'),parent:null,s:1,tx:0,ty:0,depth:0};}
    else{
      var s0=+el.getAttribute('data-w')/1000,x0=+el.getAttribute('data-x'),y0=+el.getAttribute('data-y');
      el.setAttribute('transform','translate('+x0+' '+y0+') scale('+s0+')');
      o={id:id,el:el,name:el.getAttribute('data-name'),parent:p,s:p.s*s0,tx:p.tx+p.s*x0,ty:p.ty+p.s*y0,depth:p.depth+1};
    }
    pages[id]=o;list.push(o);
  });
  var root=list[0], deepest=list.reduce(function(m,p){return p.s<m?p.s:m;},1);
  var currentId=root.id, crumbKey='';

  function apply(){
    world.setAttribute('transform','translate('+x+' '+y+') scale('+k+')');
    list.forEach(function(p){
      if(!p.parent) return;
      var sw=k*p.s*1000, t=clamp((sw-0.30*SW)/(0.34*SW),0,1);
      p.el.style.opacity=t; p.el.style.display=t<0.01?'none':'';
      p.t=t;
    });
    /* which page is the viewer inside? */
    var cur=root;
    list.forEach(function(p){
      var left=x+k*p.tx, top=y+k*p.ty, w=k*p.s*1000, h=k*p.s*1500;
      if(w>=0.55*SW && SW/2>=left && SW/2<=left+w && SH/2>=top && SH/2<=top+h && p.depth>=cur.depth) cur=p;
    });
    currentId=cur.id;
    var chain=[],q=cur; while(q){chain.unshift(q);q=q.parent;}
    var key=chain.map(function(c){return c.id;}).join('>');
    if(key!==crumbKey){crumbKey=key;drawCrumbs(chain);}
    lbl.textContent='×'+(k/fit).toFixed(k/fit<10?1:0);
  }
  function drawCrumbs(chain){
    crumbsEl.textContent='';
    chain.forEach(function(c,idx){
      if(idx){var sp=document.createElement('span');sp.className='sep';sp.textContent='›';crumbsEl.appendChild(sp);}
      var b=document.createElement('button');b.className='crumb';b.textContent=c.name;
      if(idx===chain.length-1) b.setAttribute('aria-current','true');
      b.onclick=function(){goTo(c.id);};
      crumbsEl.appendChild(b);
    });
  }
  function measure(){
    var r=stage.getBoundingClientRect(); SW=Math.max(r.width,1); SH=Math.max(r.height,1);
    fit=Math.min(SW/1000,SH/1500)*0.97; kMax=fit/deepest*1.25;
  }
  function viewFor(p){
    var nk=Math.min(SW/(1000*p.s),SH/(1500*p.s))*0.97;
    return {k:nk,x:(SW-nk*p.s*1000)/2-nk*p.tx,y:(SH-nk*p.s*1500)/2-nk*p.ty};
  }
  function setView(v){k=v.k;x=v.x;y=v.y;apply();}
  function goTo(id){
    var tgt=viewFor(pages[id]);
    var c0={x:(SW/2-x)/k,y:(SH/2-y)/k}, c1={x:(SW/2-tgt.x)/tgt.k,y:(SH/2-tgt.y)/tgt.k};
    var l0=Math.log(k), l1=Math.log(tgt.k), t0=performance.now(), dur=Math.min(1800,700+Math.abs(l1-l0)*420);
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    touched=true; hint.style.display='none';
    var token={};anim=token;
    if(reduce){setView(tgt);return;}
    (function step(now){
      if(anim!==token) return;
      var u=clamp((now-t0)/dur,0,1), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      var nk=Math.exp(l0+(l1-l0)*e), cx=c0.x+(c1.x-c0.x)*e, cy=c0.y+(c1.y-c0.y)*e;
      k=nk;x=SW/2-cx*nk;y=SH/2-cy*nk;apply();
      if(u<1) requestAnimationFrame(step);
    })(t0);
  }
  function zoomAt(f,cx,cy){
    var nk=clamp(k*f,fit*0.7,kMax), real=nk/k;
    x=cx-(cx-x)*real; y=cy-(cy-y)*real; k=nk; apply();
  }

  /* gestures */
  var ptrs=new Map(), start=null, tapOK=false;
  stage.addEventListener('pointerdown',function(e){
    if(e.target.closest&&e.target.closest('.ctl')) return;
    anim=null; touched=true; hint.style.display='none';
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){start={x:e.clientX,y:e.clientY,t:performance.now()};tapOK=true;}else tapOK=false;
  });
  stage.addEventListener('pointermove',function(e){
    if(!ptrs.has(e.pointerId)) return;
    var prev=ptrs.get(e.pointerId), cur={x:e.clientX,y:e.clientY}, rect=stage.getBoundingClientRect();
    if(start&&Math.hypot(cur.x-start.x,cur.y-start.y)>8) tapOK=false;
    if(ptrs.size===1){x+=cur.x-prev.x;y+=cur.y-prev.y;ptrs.set(e.pointerId,cur);apply();}
    else if(ptrs.size===2){
      var oid=null;ptrs.forEach(function(_,id){if(id!==e.pointerId)oid=id;});
      var o=ptrs.get(oid), d0=Math.hypot(prev.x-o.x,prev.y-o.y), d1=Math.hypot(cur.x-o.x,cur.y-o.y);
      var m0={x:(prev.x+o.x)/2,y:(prev.y+o.y)/2}, m1={x:(cur.x+o.x)/2,y:(cur.y+o.y)/2};
      x+=m1.x-m0.x;y+=m1.y-m0.y;ptrs.set(e.pointerId,cur);
      if(d0>0) zoomAt(d1/d0,m1.x-rect.left,m1.y-rect.top); else apply();
    }
  });
  function up(e){
    var wasOne=ptrs.size===1&&ptrs.has(e.pointerId);
    ptrs.delete(e.pointerId);
    if(wasOne&&tapOK&&e.type==='pointerup'&&performance.now()-start.t<450){
      var el=document.elementFromPoint(e.clientX,e.clientY), g=el&&el.closest?el.closest('[data-goto]'):null;
      if(g){goTo(g.getAttribute('data-goto'));return;}
      var pg=el&&el.closest?el.closest('.pg'):null;
      if(pg&&pg.getAttribute('data-id')!==currentId&&pages[pg.getAttribute('data-id')].depth>pages[currentId].depth) goTo(pg.getAttribute('data-id'));
    }
  }
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',function(e){
    e.preventDefault();anim=null;touched=true;hint.style.display='none';
    var rect=stage.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.012:0.0024)),e.clientX-rect.left,e.clientY-rect.top);
  },{passive:false});
  document.getElementById('zin').onclick=function(){anim=null;touched=true;zoomAt(1.6,SW/2,SH/2);};
  document.getElementById('zout').onclick=function(){anim=null;touched=true;zoomAt(1/1.6,SW/2,SH/2);};
  document.getElementById('zhome').onclick=function(){goTo(root.id);};

  function init(){measure();setView(viewFor(root));}
  init();
  if(window.ResizeObserver){
    new ResizeObserver(function(){measure();if(!touched) setView(viewFor(root)); else apply();}).observe(stage);
  }else{window.addEventListener('resize',function(){measure();apply();});}
})();
</script>

</body></html>
