<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flashcards & Science Kits Gallery</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  html,body{width:100%;min-height:100%;margin:0}
  body{
    min-height:100vh;min-height:100dvh;
    padding:clamp(10px,3vw,28px);
    padding-left:max(clamp(10px,3vw,28px),env(safe-area-inset-left));
    padding-right:max(clamp(10px,3vw,28px),env(safe-area-inset-right));
    background:#0a0a0a radial-gradient(circle at 15% 10%,rgba(123,156,255,.18),transparent 45%),radial-gradient(circle at 85% 90%,rgba(255,123,136,.16),transparent 45%);
    background-attachment:fixed;
    color:#fff;overflow-x:hidden;
  }

  /* ===== MAIN GRID: poori screen cover karta hai ===== */
  .albums-grid{
    display:grid;width:100%;margin:0 auto;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));
    gap:clamp(14px,2.5vw,26px);
  }

  .behance-card{background:#111;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.3);transition:transform .3s ease;border:1px solid rgba(255,255,255,.08)}
  .behance-card:hover{transform:translateY(-6px)}
  .img-wrapper{width:100%;aspect-ratio:4/3;background:#222}
  .img-wrapper img{width:100%;height:100%;object-fit:cover;display:block}
  .card-info{padding:16px}
  .card-title{font-size:clamp(14px,1.2vw+10px,18px);font-weight:600;margin:0 0 8px;color:#fff}
  .card-meta{font-size:12px;color:#aaa;display:flex;justify-content:space-between;align-items:center}
  .badge{background:rgba(255,255,255,.12);padding:3px 8px;border-radius:4px}

  /* ===== GALLERY VIEW ===== */
  .gallery-view,.notes-view{display:none;width:100%;margin:0 auto;background:#0d0d0d;border-radius:16px;padding:clamp(12px,2.5vw,26px);box-shadow:0 12px 35px rgba(0,0,0,.4);animation:fadeIn .4s ease-in-out;color:#fff}
  .gallery-view{position:relative;overflow:hidden}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .gallery-header{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.15)}
  .back-btn{background:#000;color:#fff;border:1px solid rgba(255,255,255,.2);padding:9px 15px;border-radius:20px;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
  .gallery-title{font-size:clamp(14px,2vw+8px,20px);font-weight:700;color:#fff;margin:0;text-align:right}
  .gallery-stream{position:relative;z-index:3;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
  .gallery-stream img{width:100%;height:auto;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,.3)}

  /* FIRE THEME */
  .modal-fire-bg,.modal-science-bg{display:none;position:absolute;top:0;right:0;width:100%;height:200px;pointer-events:none;z-index:1}
  .gallery-view.fire-active .modal-fire-bg,.gallery-view.science-active .modal-science-bg{display:block}
  .modal-glow-fire{position:absolute;top:-20px;right:10px;width:180px;height:180px;border-radius:50%;background:rgba(255,69,0,.35);filter:blur(40px)}
  .modal-flame-wrapper{position:absolute;top:15px;right:30px;width:60px;height:70px}
  .flame-layer{position:absolute;bottom:0;left:50%;border-radius:50% 50% 35% 35%/60% 60% 40% 40%;transform-origin:center bottom}
  .flame-main{width:50px;height:75px;margin-left:-25px;background:linear-gradient(to top,#ff2200,#ff6600,#ffae00,transparent);filter:blur(1px);animation:real-flicker .15s infinite alternate}
  .flame-mid{width:32px;height:50px;margin-left:-16px;bottom:3px;background:linear-gradient(to top,#ff7700,#ffcc00,#ffffaa);filter:blur(.5px);animation:real-flicker .1s infinite alternate}
  .flame-core{width:16px;height:30px;margin-left:-8px;bottom:5px;background:linear-gradient(to top,#ffddaa,#fff)}
  @keyframes real-flicker{0%{opacity:.85;transform:scaleY(.98)}100%{opacity:1;transform:scaleY(1.04)}}

  /* SCIENCE THEME */
  .modal-glow-science{position:absolute;top:-20px;right:10px;width:220px;height:250px;border-radius:50%;background:rgba(0,255,200,.25);filter:blur(50px);animation:pulse-lab 3s infinite alternate ease-in-out}
  .lab-items-wrapper{position:absolute;top:10px;right:25px;width:120px;height:140px}
  .lab-icon{position:absolute;bottom:-10px;filter:drop-shadow(0 0 12px rgba(0,255,200,.8));opacity:0;animation:float-up 3.5s infinite linear}
  .icon-flask{left:10px;width:32px;animation-duration:3.2s}
  .icon-testtube{left:55px;width:24px;animation-duration:4s;animation-delay:1.2s}
  .icon-beaker{left:85px;width:28px;animation-duration:3.6s;animation-delay:.6s}
  .icon-drop{left:40px;width:14px;animation-duration:2.5s;animation-delay:1.8s}
  @keyframes float-up{0%{transform:translateY(0) rotate(-10deg) scale(.7);opacity:0}20%,80%{opacity:.9}100%{transform:translateY(-120px) rotate(15deg) scale(1.1);opacity:0}}
  @keyframes pulse-lab{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.25);opacity:.8}}

  /* ===== KIDS CARDS ===== */
  .kids-card{
    background:#fff;border-radius:24px;padding:clamp(16px,3vw,26px);
    display:flex;flex-direction:column;align-items:center;text-align:center;
    border:3px solid #f0e6d2;box-shadow:0 10px 25px rgba(0,0,0,.3);
    text-decoration:none;color:#333;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .3s ease;-webkit-tap-highlight-color:transparent;
  }
  .kids-card:hover{transform:translateY(-6px)}
  .kids-card:active{transform:scale(.97)}
  .character-container{position:relative;width:clamp(120px,38%,180px);aspect-ratio:1;display:flex;justify-content:center;align-items:flex-end;margin-bottom:8px}
  .floating-file{position:absolute;top:0;z-index:2;width:clamp(42px,30%,56px);aspect-ratio:1;background:#ff7b88;border-radius:12px;box-shadow:0 8px 18px rgba(255,123,136,.4);display:flex;align-items:center;justify-content:center;border:2px solid #fff;animation:floatFile 2.5s infinite ease-in-out}
  @keyframes floatFile{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(4deg)}}
  .floating-file svg{width:56%;height:56%;fill:#fff}
  .bob-cut-child{width:72%;height:72%}
  .tag-btn{background:#e2f0cb;color:#5b8a3c;font-size:clamp(11px,1.2vw+7px,13px);font-weight:800;padding:5px 12px;border-radius:20px;margin-bottom:6px}
  .kids-title{color:#4a4e69;font-size:clamp(20px,3vw+10px,28px);font-weight:800;margin:2px 0}
  .click-text{color:#ff9aa2;font-size:clamp(12px,1.2vw+8px,15px);font-weight:700;margin:6px 0 12px}
  .card-footer{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:2px dashed #f0e6d2;padding-top:10px;margin-top:auto}
  .class-label{color:#9a8c98;font-size:12px;font-weight:700}
  .view-badge{background:#b5ead7;color:#2e6f51;font-size:11px;font-weight:800;padding:5px 11px;border-radius:12px;white-space:nowrap}

  /* DOODLE NOTES CARD (cute notebook mascot) */
  .notes-card{border-color:#d6e0ff;background:linear-gradient(180deg,#fff,#f3f6ff)}
  .notes-card .floating-file{background:#7b9cff;box-shadow:0 8px 18px rgba(123,156,255,.45)}
  .notes-card .tag-btn{background:#dfe7ff;color:#3f5bd6}
  .notes-card .click-text{color:#7b9cff}
  .notes-card .card-footer{border-top-color:#d6e0ff}
  .notes-card .view-badge{background:#cfe0ff;color:#2c4aa8}
  .notes-card .character-container{width:clamp(130px,44%,200px)}
  .mascot{width:100%;height:100%;overflow:visible;animation:hop 2.6s infinite ease-in-out;transform-origin:50% 100%}
  .notes-card:hover .mascot{animation-duration:.8s}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .pencil{transform-box:fill-box;transform-origin:20% 90%;animation:write 1.6s infinite ease-in-out}
  @keyframes write{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg) translateY(-2px)}}
  .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2s infinite ease-in-out}
  .spark.s2{animation-delay:.6s}.spark.s3{animation-delay:1.1s}.spark.s4{animation-delay:1.6s}
  @keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
  /* tairte hue chhote rang-birange dots (sirf CSS, halka) */
  .notes-card::before,.notes-card::after{content:"";position:absolute;border-radius:50%;pointer-events:none;animation:drift 6s infinite ease-in-out}
  .notes-card::before{width:46px;height:46px;left:-12px;top:30%;background:#ffe1e8}
  .notes-card::after{width:34px;height:34px;right:-8px;bottom:22%;background:#d9f3e6;animation-delay:2s}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  /* NOTES VIEW */
  .notes-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
  .note-item{background:#161a2b;border:1px solid rgba(123,156,255,.35);border-radius:14px;padding:clamp(14px,2.5vw,22px);cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .25s,background .25s}
  .note-item:hover{transform:translateY(-4px);background:#1d2340}
  .note-emoji{font-size:30px}
  .note-name{font-size:clamp(15px,1.2vw+10px,18px);font-weight:700;margin:0}
  .note-type{font-size:11px;color:#9fb0ee;margin-top:3px}
  .note-frame-wrap{display:none}
  .note-frame-wrap iframe{width:100%;height:calc(100vh - 150px);height:calc(100dvh - 150px);min-height:420px;border:0;border-radius:12px;background:#fff}
  .open-tab-link{color:#9fb0ee;font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.2);padding:8px 12px;border-radius:20px}


  /* ===== CUTE BACKGROUND FX (har section ke liye alag emoji) ===== */
  #bgFx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #bgFx span{position:absolute;bottom:-50px;opacity:0;animation:riseFx linear infinite;will-change:transform}
  @keyframes riseFx{0%{transform:translateY(0) rotate(-10deg);opacity:0}10%,85%{opacity:.55}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
  .albums-grid,.gallery-view,.notes-view{position:relative;z-index:1}
  .gallery-view,.notes-view{background:rgba(13,13,13,.55)}

  /* ===== CHHOTE BUTTONS ===== */
  .back-btn{padding:6px 12px;font-size:11px}
  .open-tab-link{display:none;font-size:11px;padding:6px 10px;white-space:nowrap}
  .gallery-title{font-size:clamp(13px,1.6vw+8px,18px)}

  /* ===== NOTE KHULNE PAR: bezels khatam, poori screen ===== */
  body.note-open{padding:0}
  body.note-open .notes-view{padding:0;border-radius:0;box-shadow:none;background:#0d0d0d;animation:none}
  body.note-open .gallery-header{margin:0;padding:6px 8px;gap:8px;border-bottom:1px solid rgba(255,255,255,.12)}
  body.note-open .gallery-title{flex:1;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.note-open .open-tab-link{display:inline-block}
  body.note-open .note-frame-wrap iframe{height:calc(100vh - 42px);height:calc(100dvh - 42px);min-height:0;border-radius:0}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#bgFx{display:none}}
</style>
</head>

  </div>

  <!-- EXPANDED GALLERY VIEW -->
  <div id="galleryView" class="gallery-view">

  const albumsData = [
    { id: 1, title: "Interactive Science Kit & Charts", author: "Akshat Raj", theme: "science", type: "image",

      images: ["https://i.postimg.cc/T3kb4TLP/20260804-131206.jpg"] }
  ];

  const BG = {
    home:    ['⭐','☁️','🎈','🌈','✨','🦋','🌸','💫','🐥','🍭'],
    notes:   ['✏️','📚','🖍️','💡','📝','🌟','🎨','🧠','📘','✨','🖼'],
    science: ['🧪','🔬','🫧','⚗️','🌟','🚀','🫧','🧬'],
    fire:    ['🔥','✨','🌟','🧯','💥','🔥','⭐']
  };
  function setBg(k) {
    document.getElementById('bgFx').innerHTML = BG[k].map((e, i) =>
      `<span style="left:${(i * 17 + 5) % 94}%;font-size:${18 + (i % 4) * 7}px;animation-duration:${10 + (i % 5) * 2}s;animation-delay:${-i * 2.1}s">${e}</span>`).join('');
  }

  function renderAlbums() {
    const grid = document.getElementById('albumsGrid');
    albumsData.forEach(album => {
      const badgeText = `${album.images ? album.images.length : 1} Photos`;
      grid.insertAdjacentHTML('beforeend', `
        <div class="behance-card" onclick="openGallery(${album.id})">
          <div class="img-wrapper"><img src="${album.thumbnail}" alt="${album.title}" loading="lazy" decoding="async"></div>
          <div class="card-info">
            <div class="card-title">${album.title}</div>
            <div class="card-meta"><span>${album.author}</span><span class="badge">${badgeText}</span></div>
          </div>
        </div>`);
    });
  }

  function openGallery(albumId) {
    const album = albumsData.find(a => a.id === albumId);
    if (!album) return;
    const galleryModal = document.getElementById('galleryView');
    document.getElementById('galleryTitle').innerText = album.title;
    galleryModal.classList.remove('fire-active', 'science-active');
    document.getElementById('galleryStream').innerHTML = album.images.map(u =>
      `<img src="${u}" loading="lazy" decoding="async" alt="${album.title}">`).join('');
    if (album.theme === 'fire') galleryModal.classList.add('fire-active');
    else if (album.theme === 'science') galleryModal.classList.add('science-active');
    setBg(album.theme);
    document.getElementById('albumsGrid').style.display = 'none';
    galleryModal.style.display = 'block';
    window.scrollTo(0, 0);
  }

  function closeGallery() {
    const g = document.getElementById('galleryView');
    g.style.display = 'none';
    g.classList.remove('fire-active', 'science-active');
    document.getElementById('albumsGrid').style.display = 'grid';
    setBg('home');
  }

  // Naam ke spaces ki jagah URL mein %20 lagana hai.
  const notesData = [
    { title: "Mixtures Mind Map", emoji: "🧪", type: "Mind Map",
      url: "https://2025akshat-lang.github.io/Akshat/sep/mixtures.html" },
    { title: "Neuron Doodle Notes", emoji: "🧠", type: "Doodle Notes",
      url: "https://2025akshat-lang.github.io/Akshat/sep/Neuron%20Doodle%20Notes.html" },
    { title: "Class 6th Revision Notes", emoji: "📘", type: "Revision Notes",
      url: "https://2025akshat-lang.github.io/Akshat/sep/class-6th-revision-notes.html" },
 { title: "Blackboard Summary", emoji: "🖼", type: "Revision Notes",
      url: "https://2025akshat-lang.github.io/Akshat/sep/blackboard/index.html" }   
  ];

  let noteOpen = false;

  function openNotes() {
    const list = document.getElementById('notesList');
    list.innerHTML = notesData.map((n, i) => `
      <div class="note-item" onclick="openNote(${i})">
        <div class="note-emoji">${n.emoji}</div>
        <div><div class="note-name">${n.title}</div><div class="note-type">${n.type}</div></div>
      </div>`).join('');
    document.getElementById('albumsGrid').style.display = 'none';
    document.getElementById('noteFrameWrap').style.display = 'none';
    list.style.display = 'grid';
    document.getElementById('notesTitle').innerText = 'Doodle Notes';
    document.getElementById('notesView').style.display = 'block';
    noteOpen = false;
    document.body.classList.remove('note-open');
    setBg('notes');
    window.scrollTo(0, 0);
  }

  function openNote(i) {
    const n = notesData[i];
    document.getElementById('noteFrame').src = n.url;
    document.getElementById('openTabLink').href = n.url;
    document.getElementById('notesTitle').innerText = n.title;
    document.getElementById('notesList').style.display = 'none';
    document.getElementById('noteFrameWrap').style.display = 'block';
    noteOpen = true;
    document.body.classList.add('note-open');
    window.scrollTo(0, 0);
  }

  function notesBack() {
    if (noteOpen) {
      document.getElementById('noteFrame').src = 'about:blank';
      document.getElementById('noteFrameWrap').style.display = 'none';
      document.getElementById('notesList').style.display = 'grid';
      document.getElementById('notesTitle').innerText = 'Doodle Notes';
      noteOpen = false;
      document.body.classList.remove('note-open');
    } else {
      document.getElementById('notesView').style.display = 'none';
      document.getElementById('albumsGrid').style.display = 'grid';
      setBg('home');
    }
  }

  renderAlbums();
  setBg('home');
</script>
</body>
</html>
