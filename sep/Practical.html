<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards & Science Kits Gallery</title>
<style>
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 12px;
    background-color: #0a0a0a;
    color: #fff;
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .behance-card {
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .behance-card:hover { transform: translateY(-6px); }
  .img-wrapper { width: 100%; height: 220px; background: #222; position: relative; }
  .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
  .card-info { padding: 16px; }
  .card-title { font-size: 15px; font-weight: 600; margin: 0 0 8px 0; color: #fff; }
  .card-meta { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; align-items: center; }
  .badge { background: rgba(255, 255, 255, 0.12); padding: 3px 8px; border-radius: 4px; }

  /* EXPANDED GALLERY VIEW */
  .gallery-view {
    display: none;
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    background: #0d0d0d;
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.4);
    animation: fadeIn 0.4s ease-in-out;
    color: white;
    overflow: hidden;
  }

  @media (min-width: 600px) {
    .gallery-view { padding: 24px; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .gallery-header {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }

  .back-btn {
    background: #000;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }

  .gallery-title { font-size: 16px; font-weight: 700; color: #fff; margin: 0; }

  .gallery-stream {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .gallery-stream img {
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }

  /* FIRE THEME */
  .modal-fire-bg { display: none; position: absolute; top: 0; right: 0; width: 100%; height: 200px; pointer-events: none; z-index: 1; }
  .gallery-view.fire-active .modal-fire-bg { display: block; }
  .modal-glow-fire { position: absolute; top: -20px; right: 10px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255, 69, 0, 0.35); filter: blur(40px); }
  .modal-flame-wrapper { position: absolute; top: 15px; right: 30px; width: 60px; height: 100px; }
  .flame-layer { position: absolute; bottom: 0; left: 50%; border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%; transform-origin: center bottom; }
  .flame-main { width: 50px; height: 75px; margin-left: -25px; background: linear-gradient(to top, #ff2200, #ff6600, #ffae00, transparent); filter: blur(1px); animation: real-flicker 0.15s infinite alternate; }
  .flame-mid { width: 32px; height: 50px; margin-left: -16px; bottom: 3px; background: linear-gradient(to top, #ff7700, #ffcc00, #ffffaa); filter: blur(0.5px); animation: real-flicker 0.10s infinite alternate; }
  .flame-core { width: 16px; height: 30px; margin-left: -8px; bottom: 5px; background: linear-gradient(to top, #ffddaa, #ffffff); }

  @keyframes real-flicker {
    0% { opacity: 0.85; transform: scaleY(0.98); }
    100% { opacity: 1; transform: scaleY(1.04); }
  }

  /* SCIENCE KIT THEME */
  .modal-science-bg { display: none; position: absolute; top: 0; right: 0; width: 100%; height: 200px; pointer-events: none; z-index: 1; }
  .gallery-view.science-active .modal-science-bg { display: block; }
  .modal-glow-science { position: absolute; top: -20px; right: 10px; width: 220px; height: 200px; border-radius: 50%; background: rgba(0, 255, 200, 0.25); filter: blur(50px); animation: pulse-lab 3s infinite alternate ease-in-out; }
  .lab-items-wrapper { position: absolute; top: 10px; right: 25px; width: 120px; height: 140px; }
  .lab-icon { position: absolute; bottom: -10px; filter: drop-shadow(0 0 12px rgba(0, 255, 200, 0.8)); opacity: 0; animation: float-up 3.5s infinite linear; }
  .icon-flask { left: 10px; width: 32px; animation-duration: 3.2s; animation-delay: 0s; }
  .icon-testtube { left: 55px; width: 24px; animation-duration: 4s; animation-delay: 1.2s; }
  .icon-beaker { left: 85px; width: 28px; animation-duration: 3.6s; animation-delay: 0.6s; }
  .icon-drop { left: 40px; width: 14px; animation-duration: 2.5s; animation-delay: 1.8s; }

  @keyframes float-up {
    0% { transform: translateY(0) rotate(-10deg) scale(0.7); opacity: 0; }
    20% { opacity: 0.9; }
    80% { opacity: 0.9; }
    100% { transform: translateY(-120px) rotate(15deg) scale(1.1); opacity: 0; }
  }

  @keyframes pulse-lab {
    0% { transform: scale(0.9); opacity: 0.5; }
    100% { transform: scale(1.25); opacity: 0.8; }
  }

  /* CUSTOM KIDS CARD WITH ANIMATION */
  .kids-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    border: 3px solid #f0e6d2;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    text-decoration: none;
    color: #333;
    transition: transform 0.3s ease;
    cursor: pointer;
  }

  .kids-card:hover { transform: translateY(-6px); }

  .character-container {
    position: relative;
    width: 130px;
    height: 130px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    margin-bottom: 8px;
  }

  .floating-file {
    position: absolute;
    top: 0px;
    z-index: 2;
    width: 46px;
    height: 46px;
    background: #ff7b88;
    border-radius: 10px;
    box-shadow: 0 8px 18px rgba(255, 123, 136, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
    animation: floatFile 2.5s infinite ease-in-out;
  }

  @keyframes floatFile {
    0%, 100% { transform: translateY(0px) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(4deg); }
  }

  .floating-file svg { width: 26px; height: 26px; fill: #ffffff; }
  .bob-cut-child { width: 95px; height: 95px; }

  .tag-btn {
    background: #e2f0cb;
    color: #5b8a3c;
    font-size: 11px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 6px;
  }

  .kids-title { color: #4a4e69; font-size: 20px; font-weight: 800; margin: 2px 0; }
  .click-text { color: #ff9aa2; font-size: 12px; font-weight: 700; margin: 6px 0 12px 0; }

  .card-footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px dashed #f0e6d2;
    padding-top: 10px;
  }

  .class-label { color: #9a8c98; font-size: 12px; font-weight: 700; }
  .view-badge { background: #b5ead7; color: #2e6f51; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 12px; }

  /* DOODLE NOTES / MIND MAPS */
  .notes-card { border-color: #d6e0ff; }
  .notes-card .floating-file { background: #7b9cff; box-shadow: 0 8px 18px rgba(123,156,255,0.45); }
  .notes-card .tag-btn { background: #dfe7ff; color: #3f5bd6; }
  .notes-card .click-text { color: #7b9cff; }
  .notes-card .card-footer { border-top-color: #d6e0ff; }
  .notes-card .view-badge { background: #cfe0ff; color: #2c4aa8; }

  .notes-view { display: none; max-width: 900px; margin: 0 auto; background: #0d0d0d; border-radius: 16px; padding: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.4); animation: fadeIn 0.4s ease-in-out; color: #fff; }
  @media (min-width: 600px) { .notes-view { padding: 24px; } }
  .notes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .note-item { background: #161a2b; border: 1px solid rgba(123,156,255,0.35); border-radius: 14px; padding: 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: transform 0.25s ease, background 0.25s ease; }
  .note-item:hover { transform: translateY(-4px); background: #1d2340; }
  .note-emoji { font-size: 28px; }
  .note-name { font-size: 15px; font-weight: 700; margin: 0; }
  .note-type { font-size: 11px; color: #9fb0ee; margin-top: 3px; }
  .note-frame-wrap { display: none; }
  .note-frame-wrap iframe { width: 100%; height: 78vh; border: 0; border-radius: 12px; background: #fff; }
  .open-tab-link { color: #9fb0ee; font-size: 12px; text-decoration: none; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 20px; }
</style>
</head>
<body>

  <!-- MAIN GRID INCLUDING KIDS CARD & GALLERY CARDS -->
  <div id="albumsGrid" class="albums-grid">

    <!-- Kids Practical File Floating Card -->
    <a href="https://drive.google.com/file/d/1GYL5wSm8ppEZUiiH1GGwIr1KkPPIrBRO/view?usp=sharing" target="_blank" class="kids-card">
      <div class="character-container">
        <div class="floating-file">
          <svg viewBox="0 0 24 24">
            <path d="M18 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V4C20 2.9 19.1 2 18 2ZM9 4H11V12L10 11.25L9 12V4ZM18 20H6V4H7V15L10 12.75L13 15V4H18V20Z"/>
          </svg>
        </div>

        <svg class="bob-cut-child" viewBox="0 0 100 100">
          <path d="M20 50 Q 20 15, 50 15 Q 80 15, 80 50 Q 82 72, 75 72 L 25 72 Q 18 72, 20 50 Z" fill="#3d2314"/>
          <circle cx="50" cy="52" r="24" fill="#ffd1b3"/>
          <path d="M26 42 Q 50 30, 74 42 Q 68 28, 50 28 Q 32 28, 26 42 Z" fill="#3d2314"/>
          <circle cx="42" cy="52" r="3" fill="#222"/>
          <circle cx="58" cy="52" r="3" fill="#222"/>
          <circle cx="37" cy="57" r="3" fill="#ffb3b3" opacity="0.6"/>
          <circle cx="63" cy="57" r="3" fill="#ffb3b3" opacity="0.6"/>
          <path d="M 45 60 Q 50 65, 55 60" stroke="#cc5555" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M 30 76 Q 50 68, 70 76 L 75 100 L 25 100 Z" fill="#ffb7b2"/>
        </svg>
      </div>

      <span class="tag-btn">🎨 Practical File</span>
      <h2 class="kids-title">science</h2>
      <div class="click-text">✨ Click to Open File 📂 ✨</div>

      <div class="card-footer">
        <span class="class-label">Upper Primary Class</span>
        <span class="view-badge">VIEW FILE ➔</span>
      </div>
    </a>

    <!-- Doodle Notes & Mind Maps Card (opens inside this page) -->
    <div class="kids-card notes-card" onclick="openNotes()">
      <div class="character-container">
        <div class="floating-file">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </div>
        <svg class="bob-cut-child" viewBox="0 0 100 100">
          <path d="M20 50 Q 20 15, 50 15 Q 80 15, 80 50 Q 82 72, 75 72 L 25 72 Q 18 72, 20 50 Z" fill="#3d2314"/>
          <circle cx="50" cy="52" r="24" fill="#ffd1b3"/>
          <path d="M26 42 Q 50 30, 74 42 Q 68 28, 50 28 Q 32 28, 26 42 Z" fill="#3d2314"/>
          <circle cx="42" cy="52" r="3" fill="#222"/>
          <circle cx="58" cy="52" r="3" fill="#222"/>
          <circle cx="37" cy="57" r="3" fill="#ffb3b3" opacity="0.6"/>
          <circle cx="63" cy="57" r="3" fill="#ffb3b3" opacity="0.6"/>
          <path d="M 45 60 Q 50 65, 55 60" stroke="#cc5555" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M 30 76 Q 50 68, 70 76 L 75 100 L 25 100 Z" fill="#a8c0ff"/>
        </svg>
      </div>

      <span class="tag-btn">🧠 Mind Maps</span>
      <h2 class="kids-title">Doodle Notes</h2>
      <div class="click-text">✨ Click to Open Notes 📝 ✨</div>

      <div class="card-footer">
        <span class="class-label">Mind Maps &amp; Revision</span>
        <span class="view-badge">OPEN ➔</span>
      </div>
    </div>

  </div>

  <!-- EXPANDED GALLERY VIEW -->
  <div id="galleryView" class="gallery-view">
    <div class="modal-fire-bg">
      <div class="modal-glow-fire"></div>
      <div class="modal-flame-wrapper">
        <div class="flame-layer flame-main"></div>
        <div class="flame-layer flame-mid"></div>
        <div class="flame-layer flame-core"></div>
      </div>
    </div>

    <div class="modal-science-bg">
      <div class="modal-glow-science"></div>
      <div class="lab-items-wrapper">
        <svg class="lab-icon icon-flask" viewBox="0 0 24 24" fill="none" stroke="#00ffcc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 2v5.5L4.1 17.3A2 2 0 0 0 5.8 20h12.4a2 2 0 0 0 1.7-2.7L14 7.5V2"/>
          <line x1="8" y1="2" x2="16" y2="2"/>
          <path d="M6.5 15h11" stroke="#00e5ff" stroke-width="2"/>
        </svg>
        <svg class="lab-icon icon-testtube" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2v17.5a2.5 2.5 0 0 1-5 0V2"/>
          <line x1="8.5" y1="2" x2="15.5" y2="2"/>
          <path d="M9.5 12h5" stroke="#00ff88" stroke-width="2"/>
        </svg>
        <svg class="lab-icon icon-beaker" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 3h15v15a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3V3z"/>
          <line x1="4.5" y1="3" x2="19.5" y2="3"/>
          <line x1="6" y1="9" x2="10" y2="9"/>
          <line x1="6" y1="13" x2="12" y2="13"/>
        </svg>
        <svg class="lab-icon icon-drop" viewBox="0 0 24 24" fill="#00ffcc" stroke="#00ffcc" stroke-width="1">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
      </div>
    </div>

    <div class="gallery-header">
      <button class="back-btn" onclick="closeGallery()">← Back to Overview</button>
      <div id="galleryTitle" class="gallery-title">Project Details</div>
    </div>
    <div id="galleryStream" class="gallery-stream"></div>
  </div>

  <!-- DOODLE NOTES VIEW -->
  <div id="notesView" class="notes-view">
    <div class="gallery-header">
      <button class="back-btn" id="notesBackBtn" onclick="notesBack()">← Back to Overview</button>
      <div id="notesTitle" class="gallery-title">Doodle Notes</div>
    </div>
    <div id="notesList" class="notes-list"></div>
    <div id="noteFrameWrap" class="note-frame-wrap">
      <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
        <a id="openTabLink" class="open-tab-link" href="#" target="_blank" rel="noopener">Open in new tab ↗</a>
      </div>
      <iframe id="noteFrame" title="Note" loading="lazy" allowfullscreen></iframe>
    </div>
  </div>

<script>
  const albumsData = [
    {
      id: 1,
      title: "Interactive Science Kit & Charts",
      author: "Akshat Raj",
      theme: "science",
      type: "image",
      thumbnail: "https://i.postimg.cc/FsGySyZh/20260804-131229.jpg",
      images: [
        "https://i.postimg.cc/FsGySyZh/20260804-131229.jpg",
        "https://i.postimg.cc/wvLqKkvY/20260804-131234.jpg",
        "https://i.postimg.cc/9MZm3BMj/20260804-131249.jpg",
        "https://i.postimg.cc/nzBF81zx/20260804-131352.jpg"
      ]
    },
    {
      id: 2,
      title: "Types of combustion A3 flash card",
      author: "Akshat Raj",
      theme: "fire",
      type: "image",
      thumbnail: "https://i.postimg.cc/T3kb4TLP/20260804-131206.jpg",
      images: [
        "https://i.postimg.cc/T3kb4TLP/20260804-131206.jpg"
      ]
    }
  ];

  function renderAlbums() {
    const grid = document.getElementById('albumsGrid');

    albumsData.forEach(album => {
      const badgeText = `${album.images ? album.images.length : 1} Photos`;

      const cardHtml = `
        <div class="behance-card" onclick="openGallery(${album.id})">
          <div class="img-wrapper">
            <img src="${album.thumbnail}" alt="${album.title}">
          </div>
          <div class="card-info">
            <div class="card-title">${album.title}</div>
            <div class="card-meta">
              <span>${album.author}</span>
              <span class="badge">${badgeText}</span>
            </div>
          </div>
        </div>
      `;
      grid.insertAdjacentHTML('beforeend', cardHtml);
    });
  }

  // --- GALLERY OPEN / CLOSE SYSTEM ---
  function openGallery(albumId) {
    const album = albumsData.find(a => a.id === albumId);
    if (!album) return;

    const galleryModal = document.getElementById('galleryView');
    document.getElementById('galleryTitle').innerText = album.title;
    const stream = document.getElementById('galleryStream');

    galleryModal.classList.remove('fire-active', 'science-active');

    stream.innerHTML = album.images.map(imgUrl =>
      `<img src="${imgUrl}" loading="lazy" alt="${album.title}">`
    ).join('');

    if (album.theme === 'fire') galleryModal.classList.add('fire-active');
    else if (album.theme === 'science') galleryModal.classList.add('science-active');

    document.getElementById('albumsGrid').style.display = 'none';
    galleryModal.style.display = 'block';
  }

  function closeGallery() {
    const galleryModal = document.getElementById('galleryView');
    galleryModal.style.display = 'none';
    galleryModal.classList.remove('fire-active', 'science-active');
    document.getElementById('albumsGrid').style.display = 'grid';
  }

  // --- DOODLE NOTES / MIND MAPS (add new ones to this list) ---
  // Naam ke spaces ki jagah URL mein %20 lagana hai.
  const notesData = [
    { title: "Mixtures Mind Map", emoji: "🧪", type: "Mind Map",
      url: "https://2025akshat-lang.github.io/Akshat/sep/mixtures.html" },
    { title: "Neuron Doodle Notes", emoji: "🧠", type: "Doodle Notes",
      url: "https://2025akshat-lang.github.io/Akshat/sep/Neuron%20Doodle%20Notes.html" },
    { title: "Class 6th Revision Notes", emoji: "📘", type: "Revision Notes",
      url: "https://2025akshat-lang.github.io/Akshat/sep/class-6th-revision-notes.html" }
  ];

  let noteOpen = false;

  function openNotes() {
    const list = document.getElementById('notesList');
    list.innerHTML = notesData.map((n, i) => `
      <div class="note-item" onclick="openNote(${i})">
        <div class="note-emoji">${n.emoji}</div>
        <div>
          <div class="note-name">${n.title}</div>
          <div class="note-type">${n.type}</div>
        </div>
      </div>`).join('');
    document.getElementById('albumsGrid').style.display = 'none';
    document.getElementById('noteFrameWrap').style.display = 'none';
    list.style.display = 'grid';
    document.getElementById('notesTitle').innerText = 'Doodle Notes';
    document.getElementById('notesView').style.display = 'block';
    noteOpen = false;
    window.scrollTo(0, 0);
  }

  function openNote(i) {
    const n = notesData[i];
    document.getElementById('noteFrame').src = n.url;
    document.getElementById('openTabLink').href = n.url;
    document.getElementById('notesTitle').innerText = n.title;
    document.getElementById('notesList').style.display = 'none';
    document.getElementById('noteFrameWrap').style.display = 'block';
    noteOpen = true;
    window.scrollTo(0, 0);
  }

  function notesBack() {
    if (noteOpen) {
      document.getElementById('noteFrame').src = 'about:blank';
      document.getElementById('noteFrameWrap').style.display = 'none';
      document.getElementById('notesList').style.display = 'grid';
      document.getElementById('notesTitle').innerText = 'Doodle Notes';
      noteOpen = false;
    } else {
      document.getElementById('notesView').style.display = 'none';
      document.getElementById('albumsGrid').style.display = 'grid';
    }
  }

  renderAlbums();
</script>

</body>
</html>
