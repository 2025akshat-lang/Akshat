<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blackboard Animator</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f3c;--panel:#141c5a;--ink:#f4f6ff;--mute:#9aa6e8;--cy:#4fd8ff;--rd:#ff5a5a;--yl:#ffd54a;--gr:#6cf29a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif}
body{margin:0;height:100dvh;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:2px solid #2c3a9a;border-radius:10px;padding:6px 12px;min-height:40px}
select{max-width:100%;flex:1 1 150px}
button{cursor:pointer}
button:hover{border-color:var(--cy)}
button.go{background:var(--yl);color:#1a1a00;border-color:var(--yl);font-weight:700}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
#wrap{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0,#12195f,var(--bg))}
#board{position:absolute;inset:0;overflow-y:auto;padding:64px 18px 45vh 18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.ln{align-self:center;max-width:min(760px,92%);font-size:clamp(20px,3.4vw,30px);line-height:1.35;visibility:hidden;padding:2px 10px}
.ln small{display:block;font-size:.72em;color:var(--mute)}
.title{font-size:clamp(26px,4.6vw,42px);color:var(--yl);font-weight:700;text-align:center}
.eq{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--cy);font-size:clamp(22px,3.8vw,34px)}
.q{color:#ffb3b3}
.q::before{content:"Q. ";color:var(--rd);font-weight:700}
.ans{color:var(--gr);border:3px solid var(--gr);border-radius:10px;padding:6px 14px}
.def{border:3px solid var(--cy);border-radius:10px;padding:6px 14px}
.c-cyan{color:var(--cy)}.c-red{color:var(--rd)}.c-yellow{color:var(--yl)}.c-green{color:var(--gr)}
#ov{position:absolute;inset:0;pointer-events:none}
#char{position:absolute;left:-12px;bottom:10px;width:96px;height:224px;pointer-events:none;display:none;animation:breathe 3.2s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes breathe{50%{transform:translateY(-3px)}}
#arm{stroke:var(--rd);stroke-width:12;fill:none;stroke-linejoin:miter;display:none}
#ptr{position:absolute;left:0;top:0;font-size:42px;line-height:1;will-change:transform}
.hand{display:block;width:34px;height:34px;border-radius:50%;background:#f7c3a0;border:2px solid #d9906a}
.dot{display:block;width:18px;height:18px;border-radius:50%;background:var(--rd);box-shadow:0 0 0 4px #ff5a5a55,0 0 18px 6px var(--rd);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(34px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%{opacity:0;text-shadow:0 0 0 #fff}50%{opacity:1;text-shadow:0 0 26px #fff}100%{opacity:1;text-shadow:none}}
@keyframes blur{from{filter:blur(12px);opacity:0}to{filter:none;opacity:1}}
.fx-type{animation:wipe var(--d) linear both}
.fx-pop{animation:pop var(--d) cubic-bezier(.3,1.4,.5,1) both}
.fx-rise{animation:rise var(--d) ease-out both}
.fx-glow{animation:glow var(--d) ease-out both}
.fx-sparkle{animation:blur var(--d) ease-out both}
.done{visibility:visible}
#msg{position:absolute;inset:auto 0 50% 0;text-align:center;color:var(--mute);font-size:20px;padding:0 20px}
#count{color:var(--mute);text-align:center;font-size:14px}
#fab{position:fixed;top:10px;right:10px;z-index:20;width:46px;height:46px;border-radius:50%;padding:0;font-size:22px;opacity:.8}
#sheetBg{position:fixed;inset:0;z-index:25;background:#0008;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0 auto;max-width:640px;background:var(--panel);border-top:3px solid #2c3a9a;border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;transform:translateY(105%);transition:transform .28s ease;visibility:hidden}
body.open #sheet{transform:none;visibility:visible}
body.open #sheetBg{display:block}
.row{display:flex;gap:8px}.row>*{flex:1}
.grab{width:46px;height:5px;border-radius:3px;background:#2c3a9a;margin:0 auto 2px}
@media (prefers-reduced-motion:reduce){.dot,.eye,#char{animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="board" tabindex="0" aria-live="polite"></div>
  <div id="msg"></div>
  <svg id="char" viewBox="0 0 120 280" aria-hidden="true">
    <rect x="30" y="200" width="22" height="80" fill="#1a2470"/><rect x="62" y="200" width="22" height="80" fill="#1a2470"/>
    <rect x="24" y="118" width="64" height="92" rx="4" fill="#fff5f5"/>
    <rect x="70" y="118" width="42" height="92" rx="4" fill="#ff5a5a"/><rect x="8" y="118" width="18" height="92" rx="4" fill="#ff5a5a"/>
    <text x="30" y="168" font-size="15" font-weight="700" fill="#2a2a55" font-family="sans-serif">SCI</text>
    <rect x="46" y="98" width="16" height="22" fill="#f7c3a0"/>
    <polygon points="22,40 92,40 92,78 57,102 22,78" fill="#f7c3a0" stroke="#d9906a" stroke-width="2"/>
    <polygon points="18,50 12,20 30,34 38,6 52,30 66,2 76,30 94,12 96,50 80,38 56,32 34,38" fill="#1a2470"/>
    <g class="eye"><circle cx="38" cy="62" r="10" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="38" cy="62" r="5" fill="#e0334c"/></g>
    <g class="eye"><circle cx="74" cy="62" r="10" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="74" cy="62" r="5" fill="#e0334c"/></g>
    <path d="M46 82 Q56 91 68 82" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>
  <svg id="ov" width="100%" height="100%"><polyline id="arm" points=""/></svg>
  <div id="ptr" style="display:none"></div>
</div>
<button id="fab" aria-label="Menu" aria-expanded="false">&#9776;</button>
<div id="sheetBg"></div>
<div id="sheet" role="dialog" aria-label="Controls">
  <div class="grab"></div>
  <select id="lesson" aria-label="Chapter and lesson"></select>
  <div class="row">
    <select id="style" aria-label="Pointer style"></select>
    <select id="speed" aria-label="Speed"><option value="0.6">Slow</option><option value="1" selected>Normal</option><option value="1.6">Fast</option></select>
  </div>
  <div class="row"><button id="prev" aria-label="Previous line">Back</button><button id="next" class="go">Next line</button></div>
  <div class="row"><button id="auto">Auto play</button><button id="reset">Restart</button></div>
  <span id="count"></span>
</div>

<script src="manifest.js"></script>
<script>
window.LESSONS={};
window.registerLesson=l=>{LESSONS[l.id]=l};

const $=s=>document.querySelector(s);
const board=$('#board'),wrap=$('#wrap'),ptr=$('#ptr'),arm=$('#arm'),msg=$('#msg');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* Pointer styles: add a new one here and it shows up in the menu.
   fx = reveal effect (type, pop, rise, glow, sparkle). off = [x,y] offset of the tip. arc = flight height. */
const P={
  arm:   {name:'Teacher arm',   html:'<i class="hand"></i>', fx:'type',    off:[-17,-17], arc:0},
  wand:  {name:'Magic wand',    html:'🪄',                   fx:'sparkle', off:[-8,-34],  arc:50},
  rocket:{name:'Rocket',        html:'🚀',                   fx:'pop',     off:[-36,-6],  arc:90},
  hand:  {name:'Pointing finger',html:'👆',                  fx:'rise',    off:[-20,2],   arc:30},
  laser: {name:'Laser dot',     html:'<i class="dot"></i>',  fx:'glow',    off:[-9,-9],   arc:0}
};
let lesson=null,idx=0,busy=false,auto=false,style='arm',token=0;
let cur={x:60,y:300};
const speed=()=>parseFloat($('#speed').value);

const fmt=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/\^(\{[^}]+\}|\w+)/g,(_,a)=>'<sup>'+a.replace(/[{}]/g,'')+'</sup>')
  .replace(/_(\{[^}]+\}|\w+)/g,(_,a)=>'<sub>'+a.replace(/[{}]/g,'')+'</sub>');

/* ---------- menus ---------- */
function buildMenus(){
  const sel=$('#lesson'),groups={};
  (window.MANIFEST||[]).forEach(m=>{(groups[m.chapter||'Lessons']=groups[m.chapter||'Lessons']||[]).push(m)});
  sel.innerHTML='';
  Object.keys(groups).forEach(c=>{
    const g=document.createElement('optgroup');g.label=c;
    groups[c].forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.title;g.appendChild(o)});
    sel.appendChild(g);
  });
  $('#style').innerHTML=Object.keys(P).map(k=>`<option value="${k}">${P[k].name}</option>`).join('');
  sel.onchange=()=>load(sel.value);
  $('#style').onchange=e=>{style=e.target.value;setStyle();};
}

function setStyle(){
  const p=P[style];
  ptr.innerHTML=p.html;
  arm.style.display=style==='arm'?'block':'none';
  $('#char').style.display=style==='arm'?'block':'none';
  ptr.style.display='block';
  place(cur.x,cur.y);
}

/* ---------- pointer movement ---------- */
function place(x,y){
  const p=P[style];
  cur={x,y};
  ptr.style.transform=`translate(${x+p.off[0]}px,${y+p.off[1]}px)`;
  if(style==='arm'){
    const H=wrap.clientHeight,S={x:-12+104*.8,y:H-10-224+140*.8};
    let dx=x-S.x,dy=y-S.y,d=Math.hypot(dx,dy)||1;
    const L=d*.52+16,h=Math.sqrt(Math.max(L*L-d*d/4,0)),mx=S.x+dx/2,my=S.y+dy/2;
    let px=-dy/d,py=dx/d;if(py<0){px=-px;py=-py}
    let ex=mx+px*h,ey=Math.min(my+py*h,H-10);
    arm.setAttribute('points',`${S.x},${S.y} ${ex},${ey} ${x},${y}`);
  }
}
function moveTo(tx,ty,dur){
  const a={...cur},arc=P[style].arc,my=token;
  return new Promise(res=>{
    const t0=performance.now();
    (function f(now){
      let t=Math.min((now-t0)/dur,1);if(my!==token)t=1;
      const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      place(a.x+(tx-a.x)*e,a.y+(ty-a.y)*e-Math.sin(Math.PI*t)*arc);
      t<1?requestAnimationFrame(f):res();
    })(t0);
  });
}

/* ---------- lines ---------- */
function makeLine(s){
  const el=document.createElement('div');
  el.className='ln '+(s.k||'note')+(s.c?' c-'+s.c:'');
  el.innerHTML=fmt(s.t)+(s.h?'<small>'+fmt(s.h)+'</small>':'');
  board.appendChild(el);
  return el;
}
async function show(s){
  const el=makeLine(s),fx=P[style].fx,d=700/speed();
  const bt=el.offsetTop;
  if(bt+el.offsetHeight>board.scrollTop+board.clientHeight*.6){board.scrollTop=bt-board.clientHeight*.3;await sleep(60)}
  const r=el.getBoundingClientRect(),w=wrap.getBoundingClientRect();
  const sx=r.left-w.left+12,ex=r.right-w.left-12,y=r.bottom-w.top+4;
  await moveTo(sx,y,650/speed());
  el.style.setProperty('--d',d+'ms');
  el.classList.add('done','fx-'+fx);
  if(fx==='type') await moveTo(ex,y,d); else await sleep(d);
}
function renderInstant(n){
  board.innerHTML='';
  for(let i=0;i<n;i++){const e=makeLine(lesson.steps[i]);e.classList.add('done')}
}

/* ---------- controls ---------- */
function ui(){
  const n=lesson?lesson.steps.length:0;
  $('#count').textContent=n?`${idx} / ${n}`:'';
  $('#next').textContent=idx>=n&&n?'Finished':'Next line';
  $('#auto').textContent=auto?'Pause':'Auto play';
}
async function next(){
  if(busy||!lesson||idx>=lesson.steps.length){auto=false;ui();return}
  busy=true;const my=token;msg.textContent='';
  await show(lesson.steps[idx++]);
  busy=false;ui();
  if(auto&&my===token){await sleep(1000/speed());if(auto&&my===token)next()}
  else if(idx>=lesson.steps.length){auto=false;ui()}
}
function reset(n=0){
  token++;busy=false;idx=n;
  board.innerHTML='';board.scrollTop=0;
  if(n)renderInstant(n);
  cur={x:wrap.clientWidth*.3,y:wrap.clientHeight-60};place(cur.x,cur.y);
  msg.textContent=n||!lesson?'':'Board par tap karo';
  ui();
}
function load(id){
  const m=MANIFEST.find(x=>x.id===id);if(!m)return;
  auto=false;
  const go=()=>{lesson=LESSONS[id];reset()};
  if(LESSONS[id])return go();
  const s=document.createElement('script');
  s.src=m.file;s.onload=go;
  s.onerror=()=>{lesson=null;reset();msg.textContent='Lesson file not found: '+m.file};
  document.head.appendChild(s);
}
$('#next').onclick=()=>{auto=false;next()};
$('#prev').onclick=()=>{auto=false;if(lesson&&idx>0)reset(idx-1)};
$('#reset').onclick=()=>{auto=false;reset()};
$('#auto').onclick=()=>{auto=!auto;ui();if(auto)next()};
board.onclick=()=>{if(!auto)next()};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();auto=false;next()}if(e.key==='ArrowLeft'){$('#prev').click()}});
addEventListener('resize',()=>place(cur.x,cur.y));

const setOpen=o=>{document.body.classList.toggle('open',o);$('#fab').setAttribute('aria-expanded',o)};
$('#fab').onclick=()=>setOpen(!document.body.classList.contains('open'));
$('#sheetBg').onclick=()=>setOpen(false);
$('#sheet').addEventListener('click',e=>{if(e.target.closest('button'))setOpen(false)});
$('#sheet').addEventListener('change',()=>setOpen(false));
addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
buildMenus();setStyle();
if(MANIFEST&&MANIFEST.length){load(MANIFEST[0].id)}else{msg.textContent='manifest.js mein koi lesson nahi hai'}
</script>
</body>
</html>
