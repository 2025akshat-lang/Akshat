<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Blooming Flowers</title>
    <style>
        *,
        *::after,
        *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-color: #030303;
            /* New Color Palette based on screenshot */
            --petal-color-1: #ff6b8b;
            --petal-color-2: #f1426c;
            --stem-color: #a85827;
            --leaf-color: #0b6838;
            --center-yellow: #f5d020;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-color);
        }

        body {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            perspective: 1000px;
        }

        .night {
            position: fixed;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            filter: blur(0.1vmin);
            background-image: 
                radial-gradient(ellipse at top, transparent 0%, var(--dark-color)), 
                radial-gradient(ellipse at bottom, var(--dark-color), rgba(255, 107, 139, 0.15)), 
                repeating-linear-gradient(220deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px);
        }

        .flowers {
            position: relative;
            transform: scale(0.85);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 2vmin;
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .flowers {
                transform: scale(0.65);
                margin-bottom: 5vmin;
            }
        }

        .flower {
            position: absolute;
            bottom: 2vmin;
            transform-origin: bottom center;
            z-index: 10;
            --fl-speed: 0.8s;
        }

        .flower--1 {
            animation: moving-flower-1 4s linear infinite alternate;
        }

        .flower--1 .flower__line {
            height: 65vmin;
            animation-delay: 0.3s;
        }

        .flower--1 .flower__line__leaf--1 {
            animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
        }

        .flower--1 .flower__line__leaf--2 {
            animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
        }

        .flower--1 .flower__line__leaf--3 {
            animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
        }

        .flower--1 .flower__line__leaf--4 {
            animation: blooming-leaf-left var(--fl-speed) 1s backwards;
        }

        .flower--2 {
            left: 50%;
            transform: rotate(18deg);
            animation: moving-flower-2 4s linear infinite alternate;
        }

        .flower--2 .flower__line {
            height: 55vmin;
            animation-delay: 0.6s;
        }

        .flower--2 .flower__line__leaf--1 {
            animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
        }

        .flower--2 .flower__line__leaf--2 {
            animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
        }

        .flower--2 .flower__line__leaf--3 {
            animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
        }

        .flower--2 .flower__line__leaf--4 {
            animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
        }

        .flower--3 {
            left: 50%;
            transform: rotate(-16deg);
            animation: moving-flower-3 4s linear infinite alternate;
        }

        .flower--3 .flower__line {
            height: 48vmin;
            animation-delay: 0.9s;
        }

        .flower--3 .flower__line__leaf--1 {
            animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
        }

        .flower--3 .flower__line__leaf--2 {
            animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
        }

        .flower--3 .flower__line__leaf--3 {
            animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
        }

        .flower--3 .flower__line__leaf--4 {
            animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
        }

        .flower__leafs {
            position: relative;
            animation: blooming-flower 2s backward;
        }

        .flower__leafs--1 { animation-delay: 1.1s; }
        .flower__leafs--2 { animation-delay: 1.4s; }
        .flower__leafs--3 { animation-delay: 1.7s; }

        .flower__leafs::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -100%);
            width: 9vmin;
            height: 9vmin;
            background-color: var(--petal-color-1);
            filter: blur(8vmin);
            opacity: 0.8;
        }

        .flower__leaf {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 9vmin;
            height: 11vmin;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background-image: linear-gradient(to top, var(--petal-color-2), var(--petal-color-1));
            transform-origin: bottom center;
            opacity: 0.95;
            box-shadow: inset 0 0 1.5vmin rgba(255, 255, 255, 0.4);
        }

        .flower__leaf--1 {
            transform: translate(-10%, 1%) rotate(45deg);
        }

        .flower__leaf--2 {
            transform: translate(-50%, -4%) rotate(135deg);
        }

        .flower__leaf--3 {
            transform: translate(-50%, -4%) rotate(225deg);
        }

        .flower__leaf--4 {
            transform: translate(-50%, 10%) rotate(315deg);
        }

        .flower__white-circle {
            position: absolute;
            left: -3.5vmin;
            top: -3vmin;
            width: 8vmin;
            height: 4vmin;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 0 1vmin rgba(255, 255, 255, 0.8);
        }

        .flower__white-circle::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border-radius: inherit;
            background-color: var(--center-yellow);
        }

        /* Stem Color - Golden Brown */
        .flower__line {
            height: 55vmin;
            width: 1.8vmin;
            background-image: linear-gradient(to left, rgba(0,0,0,0.3), transparent), linear-gradient(to top, #733918, var(--stem-color));
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
            animation: grow-flower-tree 4s backwards;
            border-radius: 1vmin;
        }

        /* Leaf Colors - Deep Vibrant Green */
        .flower__line__leaf {
            --w: 8vmin;
            --h: 12vmin;
            position: absolute;
            top: 20%;
            left: 90%;
            width: var(--w);
            height: var(--h);
            border-top-right-radius: 100%;
            border-bottom-left-radius: 100%;
            background-image: linear-gradient(to top, #054021, var(--leaf-color));
            opacity: 0.9;
        }

        .flower__line__leaf--1 {
            transform: rotate(65deg) rotateY(20deg);
        }

        .flower__line__leaf--2 {
            top: 45%;
            transform: rotate(65deg) rotateY(20deg);
        }

        .flower__line__leaf--3,
        .flower__line__leaf--4 {
            border-top-right-radius: 0;
            border-bottom-left-radius: 0;
            border-top-left-radius: 100%;
            border-bottom-right-radius: 100%;
            left: -420%;
        }

        .flower__line__leaf--3 {
            top: 15%;
            transform: rotate(-65deg) rotateY(20deg);
        }

        .flower__line__leaf--4 {
            top: 40%;
            transform: rotate(-65deg) rotateY(20deg);
        }

        /* Floating Sparks/Particles */
        .flower__light {
            position: absolute;
            bottom: 0vmin;
            width: 1vmin;
            height: 1vmin;
            background-color: #fff2a3;
            border-radius: 50%;
            filter: blur(0.15vmin);
            animation: light-ans 4s linear infinite alternate;
        }

        .flower__light--1 { left: -2vmin; animation-delay: 0.5s; }
        .flower__light--2 { left: 3vmin; animation-delay: 0.8s; }
        .flower__light--3 { left: -5vmin; animation-delay: 1.5s; }
        .flower__light--4 { left: 5vmin; animation-delay: 2s; }
        .flower__light--5 { left: -1vmin; animation-delay: 2.5s; }

        @keyframes grow-flower-tree {
            0% {
                height: 0;
                border-radius: 1vmin;
            }
        }

        @keyframes blooming-flower {
            0% {
                transform: scale(0);
            }
        }

        @keyframes blooming-leaf-right {
            0% {
                transform-origin: left;
                transform: rotate(65deg) rotateY(20deg) scale(0);
            }
        }

        @keyframes blooming-leaf-left {
            0% {
                transform-origin: right;
                transform: rotate(-65deg) rotateY(20deg) scale(0);
            }
        }

        @keyframes moving-flower-1 {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
        }

        @keyframes moving-flower-2 {
            0%, 100% { transform: rotate(18deg); }
            50% { transform: rotate(14deg); }
        }

        @keyframes moving-flower-3 {
            0%, 100% { transform: rotate(-16deg); }
            50% { transform: rotate(-20deg); }
        }

        @keyframes light-ans {
            0% {
                opacity: 0;
                transform: translateY(0vmin);
            }
            25% {
                opacity: 1;
                transform: translateY(-8vmin) translateX(-2vmin);
            }
            50% {
                opacity: 0.5;
                transform: translateY(-18vmin) translateX(2vmin);
            }
            75% {
                opacity: 0.9;
                transform: translateY(-28vmin) translateX(-2vmin);
            }
            100% {
                opacity: 0;
                transform: translateY(-35vmin) translateX(2vmin);
            }
        }
    </style>
</head>
<body>
    <div class="night"></div>
    <div class="flowers">
        <!-- Center Main Flower -->
        <div class="flower flower--1">
            <div class="flower__leafs flower__leafs--1">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
                <div class="flower__light flower__light--1"></div>
                <div class="flower__light flower__light--2"></div>
                <div class="flower__light flower__light--3"></div>
                <div class="flower__light flower__light--4"></div>
                <div class="flower__light flower__light--5"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div>
                <div class="flower__line__leaf flower__line__leaf--2"></div>
                <div class="flower__line__leaf flower__line__leaf--3"></div>
                <div class="flower__line__leaf flower__line__leaf--4"></div>
            </div>
        </div>

        <!-- Right Flower -->
        <div class="flower flower--2">
            <div class="flower__leafs flower__leafs--2">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div>
                <div class="flower__line__leaf flower__line__leaf--2"></div>
                <div class="flower__line__leaf flower__line__leaf--3"></div>
                <div class="flower__line__leaf flower__line__leaf--4"></div>
            </div>
        </div>

        <!-- Left Flower -->
        <div class="flower flower--3">
            <div class="flower__leafs flower__leafs--3">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div>
                <div class="flower__line__leaf flower__line__leaf--2"></div>
                <div class="flower__line__leaf flower__line__leaf--3"></div>
                <div class="flower__line__leaf flower__line__leaf--4"></div>
            </div>
        </div>
    </div>
</body>
</html>
