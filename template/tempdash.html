<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Templates</title>
<style>
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #0b0f19;
    color: #fff;
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: #0d1117;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0, 229, 255, 0.2);
  }

  .card-thumbnail {
    width: 100%;
    height: 190px;
    position: relative;
    overflow: hidden;
    background: #eef7ff;
  }

  .card-thumbnail svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-content {
    padding: 16px;
    background: #0d1117;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .card-author {
    font-size: 13px;
    color: #94a3b8;
  }

  .badge {
    background: #9333ea;
    color: #ffffff;
    padding: 5px 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.3px;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .modal-container {
    background: #111827;
    width: 100%;
    max-width: 1000px;
    height: 90vh;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .modal-header {
    padding: 14px 20px;
    background: #1f2937;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: #c084fc;
  }

  .close-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
  }

  .close-btn:hover {
    background: #dc2626;
  }

  .modal-body {
    flex: 1;
    width: 100%;
    height: 100%;
    background: #000;
  }

  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

  <!-- CARDS GRID -->
  <div class="albums-grid" id="cardsGrid"></div>

  <!-- POPUP MODAL FRAME -->
  <div class="modal-overlay" id="simModal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Template</span>
        <button class="close-btn" onclick="closeModal()">✕ Close</button>
      </div>
      <div class="modal-body">
        <iframe id="modalFrame" src=""></iframe>
      </div>
    </div>
  </div>

    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = data.map(item => `
      <div class="card" onclick="openModal('${item.title}', '${item.file}')">
        <div class="card-thumbnail">
          ${svgThumbnails[item.svg]}

        <div class="card-content">

            <span class="badge">Template</span>
          </div>
        </div>

    `).join('');

  function openModal(title, file) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalFrame').src = file;
    document.getElementById('simModal').style.display = 'flex';

  function closeModal() {
    document.getElementById('modalFrame').src = '';
    document.getElementById('simModal').style.display = 'none';
  }

  render();
