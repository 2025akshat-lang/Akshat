<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sardarji Smooth Bhangra Dance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #05050a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Card Container - Padding badha di hai taaki boundary na kate */
        .party-card {
            width: 92vw;
            max-width: 400px;
            height: 540px;
            background: radial-gradient(circle at center, #230b3b 0%, #08030f 100%);
            border-radius: 28px;
            border: 2px solid rgba(255, 140, 0, 0.4);
            box-shadow: 0 0 30px rgba(255, 100, 0, 0.4), inset 0 0 20px rgba(147, 51, 234, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 15px 15px 15px;
            position: relative;
            overflow: hidden;
        }

        /* Glowing Disco Background */
        .spotlight {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.3) 0%, rgba(236, 72, 153, 0.15) 50%, rgba(0,0,0,0) 75%);
            top: 20%;
            border-radius: 50%;
            animation: smoothSpotlight 1.6s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* Floating Confetti */
        .confetti {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: floatUp 2.5s linear infinite;
            will-change: transform;
        }
        .c1 { background: #ff0055; left: 10%; animation-delay: 0s; }
        .c2 { background: #00ffcc; left: 85%; animation-delay: 0.5s; }
        .c3 { background: #ffe600; left: 50%; animation-delay: 1.1s; }
        .c4 { background: #ff7700; left: 22%; animation-delay: 1.6s; }

        /* Neon Title Animation */
        .balle-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            animation: smoothTextGlow 0.8s ease-in-out infinite alternate;
            z-index: 5;
        }

        /* Main SVG Container - No Clipping */
        .sardarji-character {
            width: 100%;
            height: auto;
            max-height: 400px;
            z-index: 4;
            overflow: visible !important; /* Visual cutoff prevent karta hai */
            animation: smoothBodyDance 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            transform-origin: 200px 450px;
            will-change: transform;
        }

        /* Arm Dance Movements - Smooth Curves */
        .arm-left {
            animation: smoothArmLeft 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            transform-origin: 130px 200px;
            will-change: transform;
        }

        .arm-right {
            animation: smoothArmRight 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            transform-origin: 270px 200px;
            will-change: transform;
        }

        /* Turla Wiggle */
        .turla {
            animation: smoothTurla 0.4s ease-in-out infinite alternate;
            transform-origin: 200px 45px;
            will-change: transform;
        }

        /* Shadow Elastic Effect */
        .shadow {
            animation: smoothShadow 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            transform-origin: 200px 450px;
            will-change: transform;
        }

        /* --- Smooth 60FPS Animations --- */
        @keyframes smoothBodyDance {
            0% { transform: translateY(0px) rotate(-4deg); }
            25% { transform: translateY(-16px) rotate(0deg) scaleY(1.02); }
            50% { transform: translateY(0px) rotate(4deg); }
            75% { transform: translateY(-16px) rotate(0deg) scaleY(1.02); }
            100% { transform: translateY(0px) rotate(-4deg); }
        }

        @keyframes smoothArmLeft {
            0% { transform: rotate(-15deg) translateY(0px); }
            50% { transform: rotate(30deg) translateY(-8px); }
            100% { transform: rotate(-15deg) translateY(0px); }
        }

        @keyframes smoothArmRight {
            0% { transform: rotate(30deg) translateY(-8px); }
            50% { transform: rotate(-15deg) translateY(0px); }
            100% { transform: rotate(30deg) translateY(-8px); }
        }

        @keyframes smoothTurla {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(8deg); }
        }

        @keyframes smoothShadow {
            0%, 50%, 100% { transform: scaleX(1); opacity: 0.5; }
            25%, 75% { transform: scaleX(0.6); opacity: 0.2; }
        }

        @keyframes smoothSpotlight {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.25); opacity: 0.9; }
        }

        @keyframes smoothTextGlow {
            0% { 
                transform: scale(0.98); 
                text-shadow: 0 0 10px #ff7700, 0 0 20px #ff4500; 
            }
            100% { 
                transform: scale(1.05); 
                text-shadow: 0 0 15px #ffe600, 0 0 30px #ff0055, 0 0 40px #00ffcc; 
            }
        }

        @keyframes floatUp {
            0% { transform: translateY(500px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="party-card">
        <!-- Background Confetti -->
        <div class="confetti c1"></div>
        <div class="confetti c2"></div>
        <div class="confetti c3"></div>
        <div class="confetti c4"></div>

        <!-- Spotlight -->
        <div class="spotlight"></div>

        <!-- Title -->
        <div class="balle-title">BALLE BALLE!</div>

        <!-- SVG Extended ViewBox (-50 -50 500 530) to prevent ANY cropping -->
        <svg class="sardarji-character" viewBox="-50 -50 500 530">
            
            <!-- Ground Shadow -->
            <ellipse class="shadow" cx="200" cy="450" rx="75" ry="12" fill="rgba(0,0,0,0.5)"/>

            <!-- Legs & Punjabi Jutti -->
            <path d="M 155 360 L 142 432 L 120 440" stroke="#fdd835" stroke-width="22" stroke-linecap="round" fill="none"/>
            <path d="M 245 360 L 258 432 L 280 440" stroke="#fdd835" stroke-width="22" stroke-linecap="round" fill="none"/>
            
            <!-- Jutti Shoes -->
            <path d="M 110 432 Q 128 427 138 442 Z" fill="#d81b60"/>
            <path d="M 290 432 Q 272 427 262 442 Z" fill="#d81b60"/>

            <!-- Orange Kurta -->
            <path d="M 130 190 Q 200 170 270 190 L 288 370 Q 200 390 112 370 Z" fill="#ff6f00"/>

            <!-- Bhangra Jacket -->
            <path d="M 140 190 L 200 190 L 192 310 L 132 290 Z" fill="#1565c0"/>
            <path d="M 260 190 L 200 190 L 208 310 L 268 290 Z" fill="#1565c0"/>
            <path d="M 140 190 L 200 190 L 260 190" stroke="#ffd700" stroke-width="4" fill="none"/>

            <!-- Left Arm -->
            <g class="arm-left">
                <path d="M 130 200 Q 70 150 50 80" stroke="#ff6f00" stroke-width="26" stroke-linecap="round" fill="none"/>
                <circle cx="50" cy="80" r="13" fill="#ffcc80"/>
                <path d="M 50 80 L 42 52" stroke="#ffcc80" stroke-width="8" stroke-linecap="round"/>
            </g>

            <!-- Right Arm -->
            <g class="arm-right">
                <path d="M 270 200 Q 330 150 350 80" stroke="#ff6f00" stroke-width="26" stroke-linecap="round" fill="none"/>
                <circle cx="350" cy="80" r="13" fill="#ffcc80"/>
                <path d="M 350 80 L 358 52" stroke="#ffcc80" stroke-width="8" stroke-linecap="round"/>
            </g>

            <!-- Face -->
            <circle cx="200" cy="145" r="45" fill="#ffcc80"/>

            <!-- Beard -->
            <path d="M 155 145 Q 200 222 245 145 Z" fill="#212121"/>

            <!-- Mouth & Teeth -->
            <path d="M 173 155 Q 200 188 227 155 Z" fill="#ffffff"/>
            <path d="M 180 170 Q 200 185 220 170 Z" fill="#e53935"/>

            <!-- Mustache -->
            <path d="M 152 148 Q 200 174 248 148 Q 200 138 152 148" fill="#000000"/>

            <!-- Eyes -->
            <path d="M 173 130 Q 183 118 193 130" stroke="#000" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <path d="M 207 130 Q 217 118 227 130" stroke="#000" stroke-width="4.5" stroke-linecap="round" fill="none"/>

            <!-- Nose -->
            <circle cx="200" cy="138" r="7.5" fill="#ffab91"/>

            <!-- Turban (Pagri) -->
            <path d="M 142 135 C 128 72, 272 72, 258 135 C 272 100, 252 42, 200 42 C 148 42, 128 100, 142 135 Z" fill="#1e88e5"/>
            <path d="M 152 115 Q 200 76 248 115 Q 200 91 152 115" fill="#1565c0"/>

            <!-- Turla (Fan on top) -->
            <g class="turla">
                <path d="M 172 44 Q 200 -12 228 44 Z" fill="#ffd700"/>
                <path d="M 181 44 Q 200 2 219 44 Z" fill="#ff6f00"/>
            </g>

            <!-- Turban Gem -->
            <circle cx="200" cy="74" r="6.5" fill="#ffd700"/>
            <circle cx="200" cy="74" r="3.5" fill="#d81b60"/>

        </svg>
    </div>

</body>
</html>
