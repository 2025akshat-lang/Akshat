<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star FX & Animation Lab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* Fullscreen Canvas */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Control Panel Overlay */
        .controls-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 20, 35, 0.75);
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(100, 200, 255, 0.2);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .btn.active {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.8);
        }

        /* Header Info */
        .header-title {
            position: absolute;
            top: 25px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
        }

        .header-title h1 {
            font-size: 26px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>STAR ANIMATION LAB</h1>
        <p>Click anywhere for Star Explosion | Switch Modes Below</p>
    </div>

    <!-- Main Canvas -->
    <canvas id="fx-canvas"></canvas>

    <!-- Interactive Mode Switcher Panel -->
    <div class="controls-panel">
        <button class="btn active" onclick="setMode('orbit')">🌀 Orbit Galaxy</button>
        <button class="btn" onclick="setMode('warp')">🚀 Warp Speed</button>
        <button class="btn" onclick="setMode('constellation')">✨ Constellation</button>
        <button class="btn" onclick="setMode('pulse')">💫 Pulsating Field</button>
    </div>

    <script>
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        let explosions = [];
        let currentMode = 'orbit';

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Star Constructor
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 1.5;
                this.y = (Math.random() - 0.5) * height * 1.5;
                this.z = Math.random() * width; // Depth for warp effect
                this.dist = Math.random() * Math.max(width, height) * 0.6;
                this.angle = Math.random() * Math.PI * 2;
                this.size = Math.random() * 2.5 + 1;
                this.speed = Math.random() * 0.005 + 0.002;
                this.warpSpeed = Math.random() * 15 + 10;
                this.color = ['#00f2fe', '#4facfe', '#ff007f', '#ffffff', '#ffea00'][Math.floor(Math.random() * 5)];
                this.alpha = Math.random();
                this.pulseSpeed = Math.random() * 0.03 + 0.01;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
            }

            update() {
                if (currentMode === 'orbit') {
                    // MODE 1: Rotating Orbit
                    this.angle += this.speed;
                    this.posX = centerX + this.dist * Math.cos(this.angle);
                    this.posY = centerY + this.dist * Math.sin(this.angle);

                } else if (currentMode === 'warp') {
                    // MODE 2: Sci-Fi Warp Speed
                    this.z -= this.warpSpeed;
                    if (this.z <= 0) {
                        this.z = width;
                        this.x = (Math.random() - 0.5) * width * 1.5;
                        this.y = (Math.random() - 0.5) * height * 1.5;
                    }
                    this.posX = (this.x / this.z) * 200 + centerX;
                    this.posY = (this.y / this.z) * 200 + centerY;

                } else if (currentMode === 'constellation' || currentMode === 'pulse') {
                    // MODE 3 & 4: Floating & Pulsating
                    this.posX = (this.posX || centerX + this.x) + this.vx;
                    this.posY = (this.posY || centerY + this.y) + this.vy;

                    if (this.posX < 0 || this.posX > width) this.vx *= -1;
                    if (this.posY < 0 || this.posY > height) this.vy *= -1;

                    // Opacity Pulse Effect
                    this.alpha += this.pulseSpeed;
                    if (this.alpha > 1 || this.alpha < 0.2) this.pulseSpeed *= -1;
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = (currentMode === 'pulse') ? 15 : 6;
                ctx.globalAlpha = (currentMode === 'warp') ? Math.min(1, (width - this.z) / 200) : this.alpha;

                if (currentMode === 'warp') {
                    // Streak Lines for Warp Speed
                    let prevX = ((this.x / (this.z + this.warpSpeed * 2)) * 200) + centerX;
                    let prevY = ((this.y / (this.z + this.warpSpeed * 2)) * 200) + centerY;
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = Math.max(0.5, (1 - this.z / width) * 4);
                    ctx.beginPath();
                    ctx.moveTo(prevX, prevY);
                    ctx.lineTo(this.posX, this.posY);
                    ctx.stroke();
                } else {
                    // Star Shape/Circle
                    ctx.beginPath();
                    let currentRadius = (currentMode === 'pulse') ? this.size * (1 + Math.sin(this.alpha * 3)) : this.size;
                    ctx.arc(this.posX, this.posY, Math.max(0.1, currentRadius), 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // Initialize 200 Stars
        for (let i = 0; i < 200; i++) {
            stars.push(new Star());
        }

        // Mode Controller
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            stars.forEach(s => s.reset());
        }

        // Constellation Mode Line Connection Logic
        function drawConstellations() {
            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    let dx = stars[i].posX - stars[j].posX;
                    let dy = stars[i].posY - stars[j].posY;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 110) {
                        ctx.save();
                        ctx.strokeStyle = '#4facfe';
                        ctx.globalAlpha = (1 - dist / 110) * 0.4;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(stars[i].posX, stars[i].posY);
                        ctx.lineTo(stars[j].posX, stars[j].posY);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }
        }

        // Click / Tap Starburst Explosion Effect
        window.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            for (let i = 0; i < 30; i++) {
                explosions.push({
                    x: e.clientX,
                    y: e.clientY,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 4 + 2,
                    color: ['#ff007f', '#ffea00', '#00f2fe', '#ffffff'][Math.floor(Math.random() * 4)],
                    life: 1
                });
            }
        });

        function handleExplosions() {
            for (let i = 0; i < explosions.length; i++) {
                let p = explosions[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;

                if (p.life <= 0) {
                    explosions.splice(i, 1);
                    i--;
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Main Animation Loop
        function animate() {
            // Dark trail background effect
            ctx.fillStyle = (currentMode === 'warp') ? 'rgba(5, 5, 8, 0.25)' : 'rgba(5, 5, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            if (currentMode === 'constellation') {
                drawConstellations();
            }

            handleExplosions();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
