* **Initial Setup & Measurements:**
  • Measure the diameter (d) of the copper rod at multiple places using a Vernier Calliper to find its mean diameter.
  • Measure the distance (L) between the centers of the two steam-chamber thermometer slots (T1 & T2).

* **Water & Steam Connections:**
  • Connect the steam generator to the steam chamber at one end of the copper rod.
  • Connect a steady supply of cold water to the cooling tube at the other end. Ensure water flows from lower inlet to upper outlet to avoid air bubbles.

* **Reaching Steady State:**
  • Start heating the water in the steam generator to pass steam through the steam chamber.
  • Adjust the water flow through the cooling jacket so that the temperature difference between the outlet and inlet (T4 - T3) remains around 5°C to 10°C.
  • Wait for 15–20 minutes until all thermometer readings (T1, T2, T3, T4) become constant (Steady State achieved).

* **Taking Observations:**
  • Record the steady-state temperature readings of all four thermometers: T1 and T2 (hot end) and T3 and T4 (cold water end).
  • Collect the water flowing out from the cooling jacket into a clean, dry measuring cylinder for a fixed time interval (t = 300 seconds).
  • Measure the volume (or mass 'm') of the collected water.

* **Calculations:**
  • Repeat the observations 2 to 3 times by slightly altering the water flow rate.
  • Calculate the thermal conductivity (K) using the formula: K = (m × L × (T4 - T3)) / (A × (T1 - T2) × t).
`

**Step 1: Formula Used for Thermal Conductivity (K)**

The coefficient of thermal conductivity is given by:

\\[ K = \\frac{m \\cdot L \\cdot (T_4 - T_3)}{A \\cdot (T_1 - T_2) \\cdot t} \\]

Where:
* \\( m \\) = Mass of water collected in time \\( t \\) (in grams)
* \\( L \\) = Distance between steam chambers / thermometers (\\(\\text{cm}\\))
* \\( A \\) = Cross-sectional area of the rod = \\(\\frac{\\pi \\cdot d^2}{4}\\) (\\(\\text{cm}^2\\))
* \\( d \\) = Mean diameter of the rod = \\(3.8023 \\text{ cm}\\)
* \\( T_1, T_2 \\) = Temperatures of hot end thermometers (\\(^\\circ\\text{C}\\))
* \\( T_3, T_4 \\) = Temperatures of cold water inlet & outlet (\\(^\\circ\\text{C}\\))
* \\( t \\) = Time for water collection = \\(300 \\text{ seconds}\\)

---

**Step 2: Area Calculation of Metal Rod (A)**

Mean Diameter \\( d \\):
\\[ d_{mean} = \\frac{3.802 + 3.802 + 3.803}{3} = 3.8023 \\text{ cm} \\]

Cross-sectional Area \\( A \\):
\\[ A = \\frac{\\pi \\cdot d^2}{4} = \\frac{3.1416 \\times (3.8023)^2}{4} = 11.355 \\text{ cm}^2 \\]

---

**Step 3: Trial-wise Thermal Conductivity (K) Calculation**

*(Assuming distance between steam points \\( L = 10 \\text{ cm}\\))*

* **Observation 1:**
  \\[ K_1 = \\frac{39 \\times 10 \\times (63 - 35.5)}{11.355 \\times (84 - 76.5) \\times 300} \\]
  \\[ K_1 = \\frac{390 \\times 27.5}{11.355 \\times 7.5 \\times 300} = \\frac{10725}{25548.75} = 0.420 \\text{ cal/s}\\cdot\\text{cm}\\cdot^\\circ\\text{C} \\]

* **Observation 2:**
  \\[ K_2 = \\frac{118 \\times 10 \\times (53 - 27)}{11.355 \\times (76 - 63) \\times 300} \\]
  \\[ K_2 = \\frac{1180 \\times 26}{11.355 \\times 13 \\times 300} = \\frac{30680}{44284.5} = 0.693 \\text{ cal/s}\\cdot\\text{cm}\\cdot^\\circ\\text{C} \\]

* **Observation 3:**
  \\[ K_3 = \\frac{36 \\times 10 \\times (65 - 28)}{11.355 \\times (81 - 72) \\times 300} \\]
  \\[ K_3 = \\frac{360 \\times 37}{11.355 \\times 9 \\times 300} = \\frac{13320}{30658.5} = 0.434 \\text{ cal/s}\\cdot\\text{cm}\\cdot^\\circ\\text{C} \\]

---

**Step 4: Mean Value of Coefficient of Thermal Conductivity (K_mean)**

\\[ K_{mean} = \\frac{K_1 + K_2 + K_3}{3} \\]
\\[ K_{mean} = \\frac{0.420 + 0.693 + 0.434}{3} = \\frac{1.547}{3} = 0.516 \\text{ cal/s}\\cdot\\text{cm}\\cdot^\\circ\\text{C} \\]

---

**Step 5: Percentage Error Calculation**

Standard value of Thermal Conductivity for Copper (\\(K_{std}\\)) = \\(0.90 \\text{ cal/s}\\cdot\\text{cm}\\cdot^\\circ\\text{C}\\)

\\[ \\text{Percentage Error} = \\left| \\frac{K_{std} - K_{mean}}{K_{std}} \\right| \\times 100 \\]
\\[ \\text{Percentage Error} = \\left| \\frac{0.90 - 0.516}{0.90} \\right| \\times 100 = \\frac{0.384}{0.90} \\times 100 = 42.67\\% \\]
`

  • Connect the electric bulb in series with the 0-6V DC Regulated Power Supply and the Digital Ammeter.

  • Keep the DC power supply at a very low initial voltage (just enough to get a tiny current reading without glowing the filament).
  • Record the initial small voltage (V0) and current (I0) to calculate the cold resistance of the filament at room temperature (T0 = 300 K): R0 = V0 / I0.

* **Taking Observations for Filament Glowing:**
  • Gradually increase the output voltage of the DC power supply step-by-step so that the bulb filament starts glowing bright.
  • For each step, note down the steady readings of both Digital Voltmeter (V) and Digital Ammeter (I).

* **Determining Resistance & Temperature:**
  • Calculate the hot resistance (Rt) of the filament for each observation set using Rt = V / I.
  • Determine the ratio (Rt / R0) and find the corresponding absolute temperature (T) of the filament using standard resistance-temperature reference charts or formulas.
  • Calculate the total power radiated by the filament using P = V × I.

  • Calculate the slope 'a' of the straight line using a = ΔY / ΔX.
  • Verify if the calculated slope value is close to 4, which confirms Stefan's Law (P ∝ T⁴).

    theory: "Resistors are devices that limit current flow and provide a voltage drop in electrical circuits. Because carbon resistors are physically small, their resistance values in ohms are physically color coded to identify. The color code chart is used for reading standard 4-band and 5-band color-coded values.",

  • Carbon resistor was inserted into the breadboard and two terminals of carbon resistor were connected with Multimeter.

  • The same procedure was repeated for 3 resistors.

* **For Capacitor:**
  • Multimeter was set to Capacitor mode.
  • Capacitor was inserted into breadboard and connected two terminals with multimeter positive and negative.
  • Reading was noted, and the same procedure was repeated for 3 capacitors.

* **For Electric Fuse:**
  • Multimeter was set to continuity mode.
  • Two terminals of electric fuse were connected with Multimeter and Beep sound was observed.

* **For Voltage:**
  • The circuit diagram was made on breadboard using four resistors as shown in diagram with one input voltage.
  • The Multimeter was set to voltage mode, connected in parallel across components, and reading was noted.

* **For Current:**
  • The Multimeter was set to current mode, connected in series with the circuit, and reading was noted.

  • Clean the copper strips and wire terminals using sandpaper to ensure zero contact resistance.

* **Determination of Resistance per Unit Length (ρ):**
  • Replace X and Y with known standard resistances (R and S) whose difference (R - S) is small.
  • Adjust the jockey on the bridge wire to find the null point (zero deflection in Galvanometer) and record the balancing length (l1).
  • Interchange the positions of R and S in the gaps without altering any other connections.
  • Find the new balancing length (l2) for null deflection.
  • Calculate resistance per unit length: ρ = (R - S) / (l2 - l1).

  • Slide the jockey to locate the null point and record the initial balancing length (l1').
  • Interchange the positions of X and Y (put Y in left gap and X in right gap).
  • Relocate the null point on the wire and record the new balancing length (l2').

* **Calculation & Result:**
  • Calculate the value of unknown resistance using the formula: Y = X - ρ × (l2' - l1').
  • Repeat the experiment for 2–3 different values of X to find the mean value of Y.

* **Part A: Phase Relationship Between Current and AC Voltage**

  • **Circuit Setup:** 
    Connect the Audio Frequency Oscillator (AC source) in series with the resistor (R = 100 kΩ) and capacitor (C = 0.1 µF).

  • **CRO Connection:** 
    Connect Channel 1 of the Oscilloscope (CRO) across the input AC voltage source and Channel 2 across the capacitor (Vc).

  • **Frequency Adjustment:** 
    Switch on the AC oscillator and set an initial frequency (e.g., f = 10 Hz). Keep the input voltage constant.

  • **Measuring Voltages & Phase Angle:** 
    Measure the peak-to-peak voltage across the capacitor (Vc) and resistor (VR). Calculate the phase angle using θ = tan⁻¹(Vc / VR).

  • **Repeat Readings:** 
    Vary the AC frequency step-by-step (15 Hz, 20 Hz, 70 Hz, 90 Hz, 100 Hz) and record the corresponding values of Vc and VR.

---

* **Part B: Determination of Time Constant (τ) of the Capacitor**

  • **DC / Square Wave Setup:** 
    Connect the DC power supply / Square wave generator to the RC series network to study the charging phase.

  • **Measuring Maximum Voltage:** 
    Note down the maximum charging voltage (Vmax) across the capacitor on the CRO / Voltmeter.

  • **Finding 63.2% Voltage Level:** 
    Calculate 63.2% of the maximum voltage value (0.632 × Vmax).

  • **Measuring Experimental Time Constant (τ):** 
    Using a stopwatch or the CRO time-base scale, measure the exact time taken by the capacitor to charge from 0V up to 0.632 × Vmax. This time gives the experimental time constant (τexp).

**Given Circuit Components & Values**

* Resistance (\\(R\\)) = \\(100 \\text{ k}\\Omega = 100,000 \\text{ } \\Omega = 10^5 \\text{ } \\Omega\\)
* Capacitance (\\(C\\)) = \\(0.1 \\text{ } \\mu\\text{F} = 0.1 \\times 10^{-6} \\text{ F} = 10^{-7} \\text{ F}\\)

---

**Step 1: Formula Used for Phase Angle (\\(\\theta\\)) Calculation**

The phase difference between voltage across capacitor (\\(V_C\\)) and resistor (\\(V_R\\)) is given by:

\\[ \\theta = \\tan^{-1}\\left(\\frac{V_C}{V_R}\\right) \\]

* **Sample Observation 1 (Frequency \\(f = 10 \\text{ Hz}\\)):**
  Given: \\(V_C = 72.0 \\text{ V}\\), \\(V_R = 0.024 \\text{ V}\\)
  \\[ \\frac{V_C}{V_R} = \\frac{72.0}{0.024} = 3000 \\]
  \\[ \\theta_1 = \\tan^{-1}(3000) = 89.9809^\\circ \\approx 89.98^\\circ \\]

* **Sample Observation 2 (Frequency \\(f = 15 \\text{ Hz}\\)):**
  Given: \\(V_C = 88.0 \\text{ V}\\), \\(V_R = 0.025 \\text{ V}\\)
  \\[ \\frac{V_C}{V_R} = \\frac{88.0}{0.025} = 3520 \\]
  \\[ \\theta_2 = \\tan^{-1}(3520) = 89.9837^\\circ \\approx 89.98^\\circ \\]

* **Sample Observation 6 (Frequency \\(f = 100 \\text{ Hz}\\)):**
  Given: \\(V_C = 113.0 \\text{ V}\\), \\(V_R = 0.038 \\text{ V}\\)
  \\[ \\frac{V_C}{V_R} = \\frac{113.0}{0.038} = 2973.68 \\]
  \\[ \\theta_6 = \\tan^{-1}(2973.68) = 89.9807^\\circ \\approx 89.98^\\circ \\]

---

**Step 2: Theoretical Time Constant (\\(\\tau_{\\text{theo}}\\)) Calculation**

The time constant of an RC circuit is the time required for the capacitor to charge to \\(63.2\\%\\) of its maximum voltage:

\\[ \\tau_{\\text{theo}} = R \\times C \\]
\\[ \\tau_{\\text{theo}} = (10^5 \\text{ } \\Omega) \\times (10^{-7} \\text{ F}) \\]
\\[ \\tau_{\\text{theo}} = 0.01 \\text{ seconds} = 10 \\text{ ms} \\]

---

**Step 3: Experimental Time Constant (\\(\\tau_{\\text{exp}}\\)) Measurement**

* Maximum Input Voltage (\\(V_{\\text{max}}\\)) = \\(10 \\text{ V}\\)
* \\(63.2\\%\\) of Maximum Voltage = \\(0.632 \\times 10 \\text{ V} = 6.32 \\text{ V}\\)
* Time measured on CRO / Oscilloscope to reach \\(6.32 \\text{ V}\\) (\\(\\tau_{\\text{exp}}\\)) = \\(9.8 \\text{ ms} = 0.0098 \\text{ s}\\)
---
**Step 4: Percentage Error Calculation**

\\[ \\text{Percentage Error} = \\left| \\frac{\\tau_{\\text{theo}} - \\tau_{\\text{exp}}}{\\tau_{\\text{theo}}} \\right| \\times 100 \\]
\\[ \\text{Percentage Error} = \\left| \\frac{10 \\text{ ms} - 9.8 \\text{ ms}}{10 \\text{ ms}} \\right| \\times 100 \\]
\\[ \\text{Percentage Error} = \\left( \\frac{0.2}{10} \\right) \\times 100 = 2.0\\% \\]

---
