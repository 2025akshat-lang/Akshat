<body>

    <div class="card">
        <div class="card-content" id="buttons-container">
            <h2>📁 Practical Database</h2>
            <!-- Buttons dynamically load honge yahan -->
        </div>
    </div>

    <script>
        const username = "2025akshat-lang";
        const repo = "Metro-Runner-India";
        const container = document.getElementById("buttons-container");

        // Files to ignore from dynamic listing
        const ignoreFiles = ["index.html", "hub.html"];

        async function fetchHtmlFiles() {
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();

                files.forEach(file => {
                    if (file.name.endsWith('.html') && !ignoreFiles.includes(file.name)) {
                        const btn = document.createElement('a');
                        btn.className = 'glow-btn';
                        btn.href = `https://${username}.github.io/${repo}/${encodeURIComponent(file.name)}`;
                        
                        // Clean file name for display
                        let displayName = decodeURIComponent(file.name)
                            .replace('.html', '')
                            .replace(/[-_]/g, ' ');

                        btn.innerHTML = `<span>${displayName}</span>`;
                        container.appendChild(btn);
                    }
                });
            } catch (error) {
                console.error("Error fetching repository contents:", error);
            }
        }

        fetchHtmlFiles();
    </script>
</body>
