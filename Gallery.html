<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Science Models</title>
<style>
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #0b0f19;
    color: #fff;
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* CARD STYLING MATCHING REFERENCE IMAGE */
  .card {
    background: #0d1117;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0, 229, 255, 0.2);
  }

  .card-thumbnail {
    width: 100%;
    height: 190px;
    position: relative;
    overflow: hidden;
    background: #eef7ff;
  }

  .card-thumbnail svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-content {
    padding: 16px;
    background: #0d1117;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .card-author {
    font-size: 13px;
    color: #94a3b8;
  }

  .badge {
    background: #0284c7;
    color: #ffffff;
    padding: 5px 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.3px;
  }

  /* MODAL POPUP */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .modal-container {
    background: #111827;
    width: 100%;
    max-width: 1000px;
    height: 90vh;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .modal-header {
    padding: 14px 20px;
    background: #1f2937;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: #38bdf8;
  }

  .close-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
  }

  .close-btn:hover {
    background: #dc2626;
  }

  .modal-body {
    flex: 1;
    width: 100%;
    height: 100%;
    background: #000;
  }

  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

  <!-- CARDS GRID -->
  <div class="albums-grid" id="cardsGrid"></div>

  <!-- POPUP MODAL FRAME -->
  <div class="modal-overlay" id="simModal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Simulation</span>
        <button class="close-btn" onclick="closeModal()">✕ Close</button>
      </div>
      <div class="modal-body">
        <iframe id="modalFrame" src=""></iframe>
      </div>
    </div>
  </div>

<script>
  const svgThumbnails = {
    // 1. Water Cycle Graphic
    waterCycle: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="url(#skyGradient)"/>
        <defs>
          <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e0f2fe"/>
            <stop offset="100%" stop-color="#bae6fd"/>
          </linearGradient>
        </defs>
        <circle cx="250" cy="45" r="24" fill="#facc15" opacity="0.9"/>
        <path d="M70 50 C70 40 85 30 100 35 C110 25 130 25 140 35 C150 30 165 40 160 50 C170 60 155 75 140 70 L80 70 C70 70 60 60 70 50 Z" fill="#94a3b8"/>
        <line x1="85" y1="75" x2="80" y2="90" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2 2"/>
        <line x1="100" y1="75" x2="95" y2="90" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2 2"/>
        <line x1="115" y1="75" x2="110" y2="90" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2 2"/>
        <path d="M 180 130 Q 185 105 175 85" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3" fill="none"/>
        <polygon points="175,82 170,90 180,90" fill="#ea580c"/>
        <path d="M0 140 Q 75 135 150 140 T 300 140 V 190 H 0 Z" fill="#0284c7"/>
        <text x="75" y="24" fill="#1e293b" font-size="10" font-weight="bold">Condensation</text>
        <text x="170" y="70" fill="#c2410c" font-size="10" font-weight="bold">Evaporation</text>
      </svg>
    `,

    // Evaporation vs Boiling Graphic
    evapVsBoil: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#0b1329"/>
        <!-- Beaker 1: Evaporation (Surface level) -->
        <rect x="40" y="70" width="80" height="80" rx="4" stroke="#38bdf8" stroke-width="2" fill="none"/>
        <path d="M 40 100 H 120 V 148 H 40 Z" fill="#0284c7" opacity="0.6"/>
        <path d="M 60 95 Q 65 80 60 70" stroke="#ea580c" stroke-width="2" stroke-dasharray="2 2"/>
        <path d="M 100 95 Q 105 80 100 70" stroke="#ea580c" stroke-width="2" stroke-dasharray="2 2"/>
        <text x="45" y="166" fill="#38bdf8" font-size="10" font-weight="bold">Evaporation</text>
        <text x="48" y="60" fill="#94a3b8" font-size="8">Surface Only</text>
        
        <!-- VS Text -->
        <text x="140" y="115" fill="#ef4444" font-size="16" font-weight="bold">VS</text>

        <!-- Beaker 2: Boiling (Bulk + Bubbles) -->
        <rect x="180" y="70" width="80" height="80" rx="4" stroke="#38bdf8" stroke-width="2" fill="none"/>
        <path d="M 180 100 H 260 V 148 H 180 Z" fill="#0284c7" opacity="0.6"/>
        <circle cx="200" cy="130" r="4" fill="#bae6fd"/>
        <circle cx="220" cy="115" r="6" fill="#bae6fd"/>
        <circle cx="240" cy="125" r="5" fill="#bae6fd"/>
        <path d="M 190 155 L 200 148 L 210 155" stroke="#ef4444" stroke-width="2"/>
        <path d="M 230 155 L 240 148 L 250 155" stroke="#ef4444" stroke-width="2"/>
        <text x="200" y="166" fill="#f97316" font-size="10" font-weight="bold">Boiling</text>
        <text x="195" y="60" fill="#94a3b8" font-size="8">Bulk Process</text>
      </svg>
    `,

    // Vacuum Evaporation Graphic
    vacuumEvap: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#09131d"/>
        <path d="M 90 150 V 80 A 60 60 0 0 1 210 80 V 150 Z" stroke="#38bdf8" stroke-width="3" fill="rgba(56, 189, 248, 0.08)"/>
        <rect x="70" y="150" width="160" height="12" rx="4" fill="#334155"/>
        <text x="100" y="32" fill="#38bdf8" font-size="11" font-weight="bold">Low Pressure Chamber</text>
      </svg>
    `,

    chem: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#111827"/>
        <path d="M 120 140 L 140 70 L 140 40 L 160 40 L 160 70 L 180 140 Z" stroke="#38bdf8" stroke-width="3" fill="#1e293b"/>
        <path d="M 125 125 L 175 125 L 180 140 L 120 140 Z" fill="#10b981"/>
        <text x="95" y="30" fill="#10b981" font-size="12" font-weight="bold">Chemical Reaction</text>
      </svg>
    `,

 // 3. PROPERLY ALIGNED DISTILLATION SETUP (FIXED BUG)
    distil: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#111827"/>
        
        <!-- Stand Base & Rod -->
        <rect x="50" y="165" width="40" height="6" fill="#475569"/>
        <line x1="70" y1="50" x2="70" y2="165" stroke="#64748b" stroke-width="3"/>
        
        <!-- Bunsen Burner & Flame -->
        <rect x="62" y="145" width="16" height="20" fill="#334155"/>
        <path d="M 70 145 Q 66 135 70 128 Q 74 135 70 145 Z" fill="#ef4444"/>
        <path d="M 70 145 Q 68 138 70 133 Q 72 138 70 145 Z" fill="#facc15"/>

        <!-- Round Bottom Flask -->
        <circle cx="70" cy="110" r="20" stroke="#38bdf8" stroke-width="2" fill="rgba(56, 189, 248, 0.15)"/>
        <path d="M 65 90 V 65 H 75 V 90" stroke="#38bdf8" stroke-width="2" fill="none"/>
        <path d="M 55 115 A 18 18 0 0 0 85 115 Z" fill="#0284c7"/> <!-- Boiling Liquid -->

        <!-- Thermometer -->
        <line x1="70" y1="52" x2="70" y2="98" stroke="#ef4444" stroke-width="1.5"/>

        <!-- Slanted Condenser Outer Jacket -->
        <path d="M 75 75 L 210 130" stroke="#0284c7" stroke-width="14" opacity="0.4"/>
        <!-- Inner Vapour Tube -->
        <path d="M 75 75 L 210 130" stroke="#38bdf8" stroke-width="3"/>

        <!-- Cooling Water Tubes -->
        <path d="M 190 128 L 195 140" stroke="#0ea5e9" stroke-width="2"/>
        <path d="M 100 80 L 95 68" stroke="#0ea5e9" stroke-width="2"/>

        <!-- Receiving Flask -->
        <path d="M 210 135 L 203 165 H 227 L 220 135 Z" stroke="#38bdf8" stroke-width="2" fill="rgba(56, 189, 248, 0.2)"/>
        <circle cx="215" cy="148" r="1.5" fill="#38bdf8"/> <!-- Drops -->
        <circle cx="215" cy="155" r="1.5" fill="#38bdf8"/>

        <!-- Label Text -->
        <text x="75" y="30" fill="#f97316" font-size="11" font-weight="bold">Distillation Setup</text>
        <text x="125" y="90" fill="#38bdf8" font-size="9">Liebig Condenser</text>
      </svg>
    `,

    crystal: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#090d16"/>
        <polygon points="150,30 200,80 170,150 130,150 100,80" stroke="#818cf8" stroke-width="3" fill="#1e1b4b"/>
        <text x="90" y="175" fill="#818cf8" font-size="11" font-weight="bold">Crystal Lattice Grid</text>
      </svg>
    `
  };

  // UPDATED & CORRECTED ITEMS ARRAY
  const data = [
    { id: 1, title: "Water Cycle Model", author: "Class 9th Science Model", svg: "waterCycle", file: "Water_cycle.html" },
    { id: 2, title: "Evaporation Vs Boiling", author: "Class 9th Science Model", svg: "evapVsBoil", file: "Evaporation_Vs_boiling.html" },
    { id: 3, title: "Distillation Setup Model", author: "Class 9th Science Model", svg: "distil", file: "Distillation_setup.html" },
    { id: 4, title: "Crystallization Process", author: "Class 9th Science Model", svg: "crystal", file: "crystallization.html" },
    { id: 5, title: "Vacuum Evaporation", author: "Class 9th Science Model", svg: "vacuumEvap", file: "vaccum_evaporation.html" },
    { id: 6, title: "Mixture Analysis", author: "Class 9th Science Model", svg: "chem", file: "Mixture.html" }
  ];

  function render() {
    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = data.map(item => `
      <div class="card" onclick="openModal('${item.title}', '${item.file}')">
        <div class="card-thumbnail">
          ${svgThumbnails[item.svg] || svgThumbnails.chem}
        </div>
        <div class="card-content">
          <div class="card-title">${item.title}</div>
          <div class="card-footer">
            <span class="card-author">${item.author}</span>
            <span class="badge">3D Simulation</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function openModal(title, file) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalFrame').src = file;
    document.getElementById('simModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalFrame').src = '';
    document.getElementById('simModal').style.display = 'none';
  }

  render();
</script>
</body>
</html>
