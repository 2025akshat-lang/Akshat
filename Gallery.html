<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Science Models</title>
<style>
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #0b0f19;
    color: #fff;
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* CARD STYLING MATCHING REFERENCE IMAGE */
  .card {
    background: #0d1117;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0, 229, 255, 0.2);
  }

  .card-thumbnail {
    width: 100%;
    height: 190px;
    position: relative;
    overflow: hidden;
    background: #eef7ff;
  }

  .card-thumbnail svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-content {
    padding: 16px;
    background: #0d1117;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .card-author {
    font-size: 13px;
    color: #94a3b8;
  }

  .badge {
    background: #0284c7;
    color: #ffffff;
    padding: 5px 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.3px;
  }

  /* MODAL POPUP (PREVENTS INFINITE RELOAD BUG) */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .modal-container {
    background: #111827;
    width: 100%;
    max-width: 1000px;
    height: 90vh;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .modal-header {
    padding: 14px 20px;
    background: #1f2937;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: #38bdf8;
  }

  .close-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
  }

  .close-btn:hover {
    background: #dc2626;
  }

  .modal-body {
    flex: 1;
    width: 100%;
    height: 100%;
    background: #000;
  }

  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

  <!-- CARDS GRID -->
  <div class="albums-grid" id="cardsGrid"></div>

  <!-- POPUP MODAL FRAME (NO BUG) -->
  <div class="modal-overlay" id="simModal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Simulation</span>
        <button class="close-btn" onclick="closeModal()">✕ Close</button>
      </div>
      <div class="modal-body">
        <iframe id="modalFrame" src=""></iframe>
      </div>
    </div>
  </div>

<script>
  // DETAILED GRAPHICAL SVG THUMBNAILS (MATCHING IMAGE STYLE)
  const svgThumbnails = {
    // 1. Water Cycle / Evaporation Graphic
    waterCycle: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="url(#skyGradient)"/>
        <defs>
          <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e0f2fe"/>
            <stop offset="100%" stop-color="#bae6fd"/>
          </linearGradient>
        </defs>
        <!-- Sun -->
        <circle cx="250" cy="45" r="24" fill="#facc15" opacity="0.9"/>
        <circle cx="250" cy="45" r="30" fill="#fde047" opacity="0.3"/>
        <!-- Clouds -->
        <path d="M70 50 C70 40 85 30 100 35 C110 25 130 25 140 35 C150 30 165 40 160 50 C170 60 155 75 140 70 L80 70 C70 70 60 60 70 50 Z" fill="#94a3b8"/>
        <!-- Rain -->
        <line x1="85" y1="75" x2="80" y2="90" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2 2"/>
        <line x1="100" y1="75" x2="95" y2="90" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2 2"/>
        <line x1="115" y1="75" x2="110" y2="90" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2 2"/>
        <!-- Vapor Arrows -->
        <path d="M 180 130 Q 185 105 175 85" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3" fill="none"/>
        <polygon points="175,82 170,90 180,90" fill="#ea580c"/>
        <path d="M 210 130 Q 215 105 205 85" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3" fill="none"/>
        <polygon points="205,82 200,90 210,90" fill="#ea580c"/>
        <!-- Water Body -->
        <path d="M0 140 Q 75 135 150 140 T 300 140 V 190 H 0 Z" fill="#0284c7"/>
        <path d="M0 150 Q 75 146 150 150 T 300 150 V 190 H 0 Z" fill="#0369a1"/>
        <!-- Text Labels -->
        <text x="75" y="24" fill="#1e293b" font-size="10" font-weight="bold">Condensation</text>
        <text x="40" y="85" fill="#0369a1" font-size="9" font-weight="bold">Precipitation</text>
        <text x="170" y="70" fill="#c2410c" font-size="10" font-weight="bold">Evaporation</text>
        <text x="120" y="170" fill="#ffffff" font-size="11" font-weight="bold">Collection</text>
      </svg>
    `,

    // 2. Biochemistry / DNA Graphic
    bio: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#0f172a"/>
        <circle cx="150" cy="95" r="70" fill="#1e1b4b" opacity="0.6"/>
        <!-- DNA Strand Graphic -->
        <path d="M 60 50 Q 150 95 240 50" stroke="#818cf8" stroke-width="4" fill="none"/>
        <path d="M 60 140 Q 150 95 240 140" stroke="#38bdf8" stroke-width="4" fill="none"/>
        <line x1="90" y1="65" x2="90" y2="125" stroke="#a7f3d0" stroke-width="3"/>
        <line x1="120" y1="80" x2="120" y2="110" stroke="#fef08a" stroke-width="3"/>
        <line x1="150" y1="90" x2="150" y2="100" stroke="#f472b6" stroke-width="3"/>
        <line x1="180" y1="80" x2="180" y2="110" stroke="#a7f3d0" stroke-width="3"/>
        <line x1="210" y1="65" x2="210" y2="125" stroke="#fef08a" stroke-width="3"/>
        <text x="80" y="30" fill="#38bdf8" font-size="12" font-weight="bold">Molecular Structure</text>
      </svg>
    `,

    // 3. Chemistry Setup Graphic
    chem: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#111827"/>
        <path d="M 120 140 L 140 70 L 140 40 L 160 40 L 160 70 L 180 140 Z" stroke="#38bdf8" stroke-width="3" fill="#1e293b"/>
        <path d="M 125 125 L 175 125 L 180 140 L 120 140 Z" fill="#10b981"/>
        <circle cx="145" cy="110" r="3" fill="#a7f3d0"/>
        <circle cx="155" cy="95" r="4" fill="#a7f3d0"/>
        <path d="M 100 150 H 200" stroke="#64748b" stroke-width="4"/>
        <text x="95" y="30" fill="#10b981" font-size="12" font-weight="bold">Chemical Reaction</text>
      </svg>
    `,

    // 4. Distillation Graphic
    distil: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#18181b"/>
        <circle cx="90" cy="120" r="30" stroke="#f97316" stroke-width="3" fill="#27272a"/>
        <path d="M 90 90 V 60 H 160 L 210 110" stroke="#f97316" stroke-width="3" fill="none"/>
        <rect x="150" y="65" width="50" height="30" stroke="#06b6d4" stroke-width="2" fill="none" transform="rotate(35 150 65)"/>
        <path d="M 75 160 L 90 145 L 105 160" stroke="#ef4444" stroke-width="3"/>
        <text x="70" y="30" fill="#f97316" font-size="12" font-weight="bold">Distillation Column</text>
      </svg>
    `,

    // 5. Crystallization Graphic
    crystal: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#090d16"/>
        <polygon points="150,30 200,80 170,150 130,150 100,80" stroke="#818cf8" stroke-width="3" fill="#1e1b4b"/>
        <polygon points="150,30 170,80 130,150" stroke="#c7d2fe" stroke-width="1.5" fill="none"/>
        <line x1="100" y1="80" x2="200" y2="80" stroke="#818cf8" stroke-width="2"/>
        <text x="90" y="175" fill="#818cf8" font-size="11" font-weight="bold">Crystal Lattice Grid</text>
      </svg>
    `,

    // 6. Flower / Biology Graphic
    flower: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#140d1e"/>
        <circle cx="150" cy="90" r="16" fill="#f43f5e"/>
        <circle cx="150" cy="55" r="18" fill="#fb7185" opacity="0.8"/>
        <circle cx="150" cy="125" r="18" fill="#fb7185" opacity="0.8"/>
        <circle cx="115" cy="90" r="18" fill="#fb7185" opacity="0.8"/>
        <circle cx="185" cy="90" r="18" fill="#fb7185" opacity="0.8"/>
        <path d="M 150 125 Q 140 160 150 180" stroke="#22c55e" stroke-width="4" fill="none"/>
        <text x="100" y="30" fill="#f43f5e" font-size="12" font-weight="bold">Plant Cell & Anatomy</text>
      </svg>
    `
  };

  // ITEMS LIST
  const data = [
    { id: 1, title: "Biochemistry Simulation", author: "Class 9th Science Model", svg: "bio", file: "Biochemistry.html" },
    { id: 2, title: "Chemistry Interactive Setup", author: "Class 9th Science Model", svg: "chem", file: "Chemistry.html" },
    { id: 3, title: "Distillation Setup Model", author: "Class 9th Science Model", svg: "distil", file: "Distillation_setup.html" },
    { id: 4, title: "Ultra 3D Water Cycle Visualizer", author: "Class 9th Science Model", svg: "waterCycle", file: "Evaporation_Vs_boiling.html" },
    { id: 5, title: "Fullwa Flower Animation", author: "Class 9th Science Model", svg: "flower", file: "Fullwa.html" },
    { id: 6, title: "Crystallization Process", author: "Class 9th Science Model", svg: "crystal", file: "crystallization.html" },
    { id: 7, title: "Vacuum Evaporation", author: "Class 9th Science Model", svg: "waterCycle", file: "vaccum_evaporation.html" },
    { id: 8, title: "Mixture Analysis", author: "Class 9th Science Model", svg: "chem", file: "Mixture.html" }
  ];

  // RENDER CARDS
  function render() {
    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = data.map(item => `
      <div class="card" onclick="openModal('${item.title}', '${item.file}')">
        <div class="card-thumbnail">
          ${svgThumbnails[item.svg] || svgThumbnails.chem}
        </div>
        <div class="card-content">
          <div class="card-title">${item.title}</div>
          <div class="card-footer">
            <span class="card-author">${item.author}</span>
            <span class="badge">3D Simulation</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  // OPEN MODAL (PREVENTS LOOPS)
  function openModal(title, file) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalFrame').src = file;
    document.getElementById('simModal').style.display = 'flex';
  }

  // CLOSE MODAL
  function closeModal() {
    document.getElementById('modalFrame').src = '';
    document.getElementById('simModal').style.display = 'none';
  }

  render();
</script>
</body>
</html>
