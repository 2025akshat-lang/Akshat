<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Fireworks Experience - Super Smooth</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05020a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .hud {
            position: absolute;
            bottom: 5%;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            z-index: 10;
            pointer-events: none;
            text-transform: uppercase;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body>

    <div class="hud">🎆 Fireworks Show • Click / Tap for Dhamaka!</div>
    <canvas id="fireworksCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const particles = [];
        const MAX_PARTICLES = 250; // Performance Cap to prevent lag
        let flashOpacity = 0;

        // --- Optimized Web Audio API ---
        let audioCtx = null;

        function playExplosionSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            // 1. Sharp Crackle Snap
            const snapBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.04, audioCtx.sampleRate);
            const snapData = snapBuffer.getChannelData(0);
            for (let i = 0; i < snapBuffer.length; i++) {
                snapData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.008));
            }
            const snapNode = audioCtx.createBufferSource();
            snapNode.buffer = snapBuffer;

            const snapFilter = audioCtx.createBiquadFilter();
            snapFilter.type = 'highpass';
            snapFilter.frequency.value = 1000;

            const snapGain = audioCtx.createGain();
            snapGain.gain.setValueAtTime(0.8, now);
            snapGain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);

            snapNode.connect(snapFilter);
            snapFilter.connect(snapGain);
            snapGain.connect(audioCtx.destination);
            snapNode.start(now);

            // 2. Heavy Bass Thump
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);

            oscGain.gain.setValueAtTime(1.0, now);
            oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.22);
        }

        // --- Fast Particle Engine ---
        class FireworkSpark {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.hue = hue;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 9 + 2; 

                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.friction = 0.94;
                this.gravity = 0.15;
                
                this.alpha = 1;
                this.decay = Math.random() * 0.025 + 0.015;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;

                this.x += this.vx;
                this.y += this.vy;

                this.alpha -= this.decay;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);

                ctx.strokeStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function createExplosion(x, y) {
            const baseHue = Math.random() * 360;
            const particleCount = 45; // Balanced particle count

            // If too many particles, remove older ones to save memory
            if (particles.length + particleCount > MAX_PARTICLES) {
                particles.splice(0, particleCount);
            }

            for (let i = 0; i < particleCount; i++) {
                const sparkHue = (baseHue + (Math.random() - 0.5) * 35) % 360;
                particles.push(new FireworkSpark(x, y, sparkHue));
            }

            flashOpacity = 0.12;
            playExplosionSound();
        }

        function animate() {
            // Trail blend
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(5, 2, 10, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Screen flash
            if (flashOpacity > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashOpacity})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                flashOpacity -= 0.04;
            }

            // High-performance additive glow blending
            ctx.globalCompositeOperation = 'lighter';

            // Draw & Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Touch & Click Event Handling
        window.addEventListener('pointerdown', (e) => {
            createExplosion(e.clientX, e.clientY);
        });

        animate();
    </script>
</body>
</html>
