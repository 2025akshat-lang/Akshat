<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Games</title>
<style>
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 20px;
    background-color: #0b0f19;
    color: #fff;
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: #0d1117;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0, 229, 255, 0.2);
  }

  .card-thumbnail {
    width: 100%;
    height: 190px;
    position: relative;
    overflow: hidden;
    background: #eef7ff;
  }

  .card-thumbnail svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-content {
    padding: 16px;
    background: #0d1117;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .card-author {
    font-size: 13px;
    color: #94a3b8;
  }

  .badge {
    background: #16a34a;
    color: #ffffff;
    padding: 5px 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.3px;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .modal-container {
    background: #111827;
    width: 100%;
    max-width: 1000px;
    height: 90vh;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .modal-header {
    padding: 14px 20px;
    background: #1f2937;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: #22c55e;
  }

  .close-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
  }

  .close-btn:hover {
    background: #dc2626;
  }

  .modal-body {
    flex: 1;
    width: 100%;
    height: 100%;
    background: #000;
  }

  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

  <!-- CARDS GRID -->
  <div class="albums-grid" id="cardsGrid"></div>

  <!-- POPUP MODAL FRAME -->
  <div class="modal-overlay" id="simModal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Game</span>
        <button class="close-btn" onclick="closeModal()">✕ Close</button>
      </div>
      <div class="modal-body">
        <iframe id="modalFrame" src=""></iframe>
      </div>
    </div>
  </div>

<script>
  const svgThumbnails = {
    // ABCD Game Graphic
    abcd: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#1e1b4b"/>
        <rect x="35" y="65" width="50" height="60" rx="8" fill="#ef4444"/>
        <text x="52" y="105" fill="#ffffff" font-size="28" font-weight="bold">A</text>
        <rect x="95" y="65" width="50" height="60" rx="8" fill="#22c55e"/>
        <text x="112" y="105" fill="#ffffff" font-size="28" font-weight="bold">B</text>
        <rect x="155" y="65" width="50" height="60" rx="8" fill="#3b82f6"/>
        <text x="172" y="105" fill="#ffffff" font-size="28" font-weight="bold">C</text>
        <rect x="215" y="65" width="50" height="60" rx="8" fill="#facc15"/>
        <text x="232" y="105" fill="#1e1b4b" font-size="28" font-weight="bold">D</text>
        <text x="95" y="35" fill="#a5b4fc" font-size="12" font-weight="bold">ABCD Learning Game</text>
      </svg>
    `,

    // Ludo Board Graphic
    ludo: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#0b0f19"/>
        <rect x="90" y="25" width="60" height="60" fill="#ef4444"/>
        <rect x="150" y="25" width="60" height="60" fill="#22c55e"/>
        <rect x="90" y="85" width="60" height="60" fill="#facc15"/>
        <rect x="150" y="85" width="60" height="60" fill="#3b82f6"/>
        <circle cx="120" cy="55" r="6" fill="#fff"/>
        <circle cx="180" cy="55" r="6" fill="#fff"/>
        <circle cx="120" cy="115" r="6" fill="#fff"/>
        <circle cx="180" cy="115" r="6" fill="#fff"/>
        <rect x="90" y="25" width="120" height="120" stroke="#ffffff" stroke-width="2" fill="none"/>
        <text x="105" y="165" fill="#e2e8f0" font-size="13" font-weight="bold">Ludo</text>
      </svg>
    `,

    // Patakha / Firecracker Graphic
    patakha: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#1a0b1f"/>
        <circle cx="150" cy="90" r="6" fill="#facc15"/>
        <line x1="150" y1="90" x2="150" y2="50" stroke="#f97316" stroke-width="3"/>
        <line x1="150" y1="90" x2="185" y2="65" stroke="#ef4444" stroke-width="3"/>
        <line x1="150" y1="90" x2="200" y2="90" stroke="#22c55e" stroke-width="3"/>
        <line x1="150" y1="90" x2="185" y2="115" stroke="#38bdf8" stroke-width="3"/>
        <line x1="150" y1="90" x2="150" y2="130" stroke="#facc15" stroke-width="3"/>
        <line x1="150" y1="90" x2="115" y2="115" stroke="#ec4899" stroke-width="3"/>
        <line x1="150" y1="90" x2="100" y2="90" stroke="#a78bfa" stroke-width="3"/>
        <line x1="150" y1="90" x2="115" y2="65" stroke="#f97316" stroke-width="3"/>
        <circle cx="150" cy="50" r="3" fill="#facc15"/>
        <circle cx="185" cy="65" r="3" fill="#ef4444"/>
        <circle cx="200" cy="90" r="3" fill="#22c55e"/>
        <circle cx="185" cy="115" r="3" fill="#38bdf8"/>
        <circle cx="150" cy="130" r="3" fill="#facc15"/>
        <circle cx="115" cy="115" r="3" fill="#ec4899"/>
        <circle cx="100" cy="90" r="3" fill="#a78bfa"/>
        <circle cx="115" cy="65" r="3" fill="#f97316"/>
        <text x="95" y="165" fill="#facc15" font-size="13" font-weight="bold">Patakha Blast</text>
      </svg>
    `,

    // Subway Surfer style Graphic
    subwaysurfer: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#0b1329"/>
        <rect x="0" y="140" width="300" height="50" fill="#1e293b"/>
        <line x1="0" y1="150" x2="300" y2="150" stroke="#facc15" stroke-width="2" stroke-dasharray="10 8"/>
        <line x1="0" y1="170" x2="300" y2="170" stroke="#facc15" stroke-width="2" stroke-dasharray="10 8"/>
        <circle cx="150" cy="105" r="12" fill="#fbbf24"/>
        <rect x="140" y="117" width="20" height="28" rx="6" fill="#3b82f6"/>
        <rect x="120" y="145" width="14" height="10" fill="#ef4444"/>
        <rect x="166" y="145" width="14" height="10" fill="#ef4444"/>
        <rect x="230" y="100" width="18" height="45" fill="#64748b"/>
        <text x="90" y="35" fill="#38bdf8" font-size="12" font-weight="bold">Endless Runner Game</text>
      </svg>
    `
  };

  const data = [
    { id: 1, title: "ABCD Game", author: "Akshat Games", svg: "abcd", file: "https://2025akshat-lang.github.io/Akshat/games/Abcd%20game.html" },
    { id: 2, title: "Ludo", author: "Akshat Games", svg: "ludo", file: "https://2025akshat-lang.github.io/Akshat/games/Ludo.html" },
    { id: 3, title: "Patakha Blast", author: "Akshat Games", svg: "patakha", file: "https://2025akshat-lang.github.io/Akshat/games/Patakha2.html" },
    { id: 4, title: "Subway Surfer", author: "Akshat Games", svg: "subwaysurfer", file: "https://2025akshat-lang.github.io/Akshat/games/Subwaysurfer.html" }
  ];

  function render() {
    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = data.map(item => `
      <div class="card" onclick="openModal('${item.title}', '${item.file}')">
        <div class="card-thumbnail">
          ${svgThumbnails[item.svg]}
        </div>
        <div class="card-content">
          <div class="card-title">${item.title}</div>
          <div class="card-footer">
            <span class="card-author">${item.author}</span>
            <span class="badge">Play Game</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function openModal(title, file) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalFrame').src = file;
    document.getElementById('simModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalFrame').src = '';
    document.getElementById('simModal').style.display = 'none';
  }

  render();
</script>
</body>
</html>
