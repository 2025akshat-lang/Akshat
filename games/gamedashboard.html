<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Educational Games Dashboard — Akshat</title>
  <meta name="description" content="Interactive educational science games and pedagogical tools by Akshat.">
  
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://2025akshat-lang.github.io/Akshat/games/gamedashboard.html">
<style>
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: #0b0f19;
    color: #fff;
    overflow-x: hidden;
    width: 100vw;
    min-height: 100vh;
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 8px;
  }

  .card {
    background: #0d1117;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 35px rgba(0, 229, 255, 0.25);
  }

  .card-thumbnail {
    width: 100%;
    height: 180px;
    position: relative;
    overflow: hidden;
    background: #eef7ff;
  }

  .card-thumbnail svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-content {
    padding: 12px 14px;
    background: #0d1117;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .card-author {
    font-size: 12px;
    color: #94a3b8;
  }

  .actions-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .badge {
    background: #16a34a;
    color: #ffffff;
    padding: 5px 10px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.3px;
    text-decoration: none;
    transition: 0.2s;
  }

  .badge:hover {
    background: #15803d;
  }

  .new-tab-btn {
    background: #3b82f6;
    color: #ffffff;
    padding: 5px 8px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 11px;
    text-decoration: none;
    transition: 0.2s;
  }

  .new-tab-btn:hover {
    background: #2563eb;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .modal-container {
    background: #111827;
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: none;
    border: none;
  }

  .modal-header {
    padding: 10px 16px;
    background: #1f2937;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .modal-title {
    font-size: 15px;
    font-weight: 700;
    color: #22c55e;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .modal-new-tab {
    background: #3b82f6;
    color: white;
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    transition: 0.2s;
  }

  .modal-new-tab:hover {
    background: #2563eb;
  }

  .close-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
    transition: 0.2s;
  }

  .close-btn:hover {
    background: #dc2626;
  }

  .modal-body {
    flex: 1;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

  <div class="albums-grid" id="cardsGrid"></div>

  <div class="modal-overlay" id="simModal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Game</span>
        <div class="modal-actions">
          <a id="modalNewTabBtn" href="" target="_blank" class="modal-new-tab">Open in New Tab ↗</a>
          <button class="close-btn" onclick="closeModal()">✕ Close</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="modalFrame" src=""></iframe>
      </div>
    </div>
  </div>

<script>
  const svgThumbnails = {

        <text x="95" y="165" fill="#facc15" font-size="13" font-weight="bold">Patakha Blast</text>

    `,
    metrorunner: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#0b1329"/>
        <rect x="0" y="140" width="300" height="50" fill="#1e293b"/>
        <line x1="0" y1="150" x2="300" y2="150" stroke="#facc15" stroke-width="2" stroke-dasharray="10 8"/>

    chainasta: `

        <circle cx="128" cy="106" r="4.5" fill="#f43f5e" opacity="0.6"/>

        <polygon points="215,65 175,135 255,135" fill="#facc15" stroke="#eab308" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="203" cy="100" r="4.5" fill="#1e1b4b"/>
        <circle cx="227" cy="100" r="4.5" fill="#1e1b4b"/>
        <circle cx="204" cy="98" r="1.5" fill="#ffffff"/>
        <circle cx="228" cy="98" r="1.5" fill="#ffffff"/>
        <circle cx="195" cy="107" r="4" fill="#f43f5e" opacity="0.6"/>
        <circle cx="235" cy="107" r="4" fill="#f43f5e" opacity="0.6"/>
        <path d="M209 108 Q215 116 221 108 Z" fill="#1e1b4b"/>
        <text x="80" y="172" fill="#fde047" font-size="14" font-weight="bold">Chai Nasta Game</text>
      </svg>
    `
  };

  const data = [
    { id: 1, title: "ABCD Game", author: "Akshat Games", svg: "abcd", file: "https://2025akshat-lang.github.io/Akshat/games/Abcd%20game.html" },
    { id: 2, title: "Ludo", author: "Akshat Games", svg: "ludo", file: "https://2025akshat-lang.github.io/Akshat/games/Ludo.html" },
    { id: 3, title: "Patakha Blast", author: "Akshat Games", svg: "patakha", file: "https://2025akshat-lang.github.io/Akshat/games/Patakha2.html" },
    { id: 4, title: "Metro Runner", author: "Akshat Games", svg: "metrorunner", file: "https://2025akshat-lang.github.io/Akshat/games/metrorunner/index.html" },
    { id: 5, title: "Hurdle Race", author: "Akshat Games", svg: "hurdlerace", file: "https://2025akshat-lang.github.io/Akshat/games/Hurdle-Race.html" },
    { id: 6, title: "Chai Nasta", author: "Akshat Games", svg: "chainasta", file: "https://2025akshat-lang.github.io/Akshat/games/Chai_nasta_games.html" }
  ];

  function render() {
    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = data.map(item => `
      <div class="card">
        <div class="card-thumbnail" onclick="openModal('${item.title}', '${item.file}')">
          ${svgThumbnails[item.svg]}
        </div>
        <div class="card-content">
          <div class="card-title">${item.title}</div>
          <div class="card-footer">
            <span class="card-author">${item.author}</span>
            <div class="actions-group">
              <a href="${item.file}" target="_blank" class="new-tab-btn" title="Open in new tab">↗</a>
              <span class="badge" onclick="openModal('${item.title}', '${item.file}')">Play</span>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function openModal(title, file) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalFrame').src = file;
    document.getElementById('modalNewTabBtn').href = file;
    document.getElementById('simModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalFrame').src = '';
    document.getElementById('simModal').style.display = 'none';
  }

  render();
</script>
</body>
</html>
