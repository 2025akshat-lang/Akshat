<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Games Dashboard — Akshat</title>
  <meta name="description" content="Interactive games and fun web experiences by Akshat.">
  
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://2025akshat-lang.github.io/Akshat/games/gamedashboard.html">
<style>
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 32px 24px;
    background-color: #f3f6f5;
    color: #202b29;
    overflow-x: hidden;
    min-height: 100vh;
  }

  .page-header {
    max-width: 1200px;
    margin: 0 auto 24px;
  }

  .page-header h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 600;
    line-height: 1.2;
  }

  .page-header p {
    margin: 8px 0 0;
    color: #64736f;
    line-height: 1.5;
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid #dce5e2;
  }

  .card:hover {
    border-color: #8eaaa3;
    box-shadow: 0 4px 14px rgba(32, 55, 49, 0.08);
  }

  .card-thumbnail {
    width: 100%;
    height: 180px;
    position: relative;
    overflow: hidden;
    background: #e8efec;
  }

  .card-thumbnail svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-content {
    padding: 16px;
    background: #ffffff;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #202b29;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .card-author {
    font-size: 12px;
    color: #64736f;
  }

  .actions-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .badge {
    background: #28675e;
    color: #ffffff;
    padding: 6px 10px;
    border-radius: 6px;
    font-weight: 500;
    font-size: 12px;
    text-decoration: none;
    transition: 0.2s;
  }

  .badge:hover {
    background: #1d514a;
  }

  .new-tab-btn {
    background: #e8f0ed;
    color: #28675e;
    padding: 6px 10px;
    border-radius: 6px;
    font-weight: 500;
    font-size: 12px;
    text-decoration: none;
    transition: 0.2s;
  }

  .new-tab-btn:hover {
    background: #dce9e5;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .modal-container {
    background: #f3f6f5;
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: none;
    border: none;
  }

  .modal-header {
    padding: 10px 16px;
    background: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #dce5e2;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 600;
    color: #28675e;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .modal-new-tab {
    background: #e8f0ed;
    color: #28675e;
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 6px;
    font-weight: 500;
    font-size: 12px;
    transition: 0.2s;
  }

  .modal-new-tab:hover {
    background: #dce9e5;
  }

  .close-btn {
    background: #f0e7e5;
    color: #794c47;
    border: none;
    padding: 5px 12px;
    border-radius: 6px;
    font-weight: 500;
    cursor: pointer;
    font-size: 12px;
    transition: 0.2s;
  }

  .close-btn:hover {
    background: #e7d8d5;
  }

  .modal-body {
    flex: 1;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }

  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

  <header class="page-header">
    <h1>Games</h1>
    <p>Choose a game to play in the window or open it in a new tab.</p>
  </header>

  <div class="albums-grid" id="cardsGrid"></div>

  <div class="modal-overlay" id="simModal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Game</span>
        <div class="modal-actions">
          <a id="modalNewTabBtn" href="" target="_blank" rel="noopener" class="modal-new-tab">Open in new tab</a>
          <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="modalFrame" src=""></iframe>
      </div>
    </div>
  </div>

<script>
  const svgThumbnails = {
    abcd: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#1e1b4b"/>
        <rect x="35" y="65" width="50" height="60" rx="8" fill="#ef4444"/>
        <text x="52" y="105" fill="#ffffff" font-size="28" font-weight="bold">A</text>
        <rect x="95" y="65" width="50" height="60" rx="8" fill="#22c55e"/>
        <text x="112" y="105" fill="#ffffff" font-size="28" font-weight="bold">B</text>
        <rect x="155" y="65" width="50" height="60" rx="8" fill="#3b82f6"/>
        <text x="172" y="105" fill="#ffffff" font-size="28" font-weight="bold">C</text>
        <rect x="215" y="65" width="50" height="60" rx="8" fill="#facc15"/>
        <text x="232" y="105" fill="#1e1b4b" font-size="28" font-weight="bold">D</text>
        <text x="95" y="35" fill="#a5b4fc" font-size="12" font-weight="bold">ABCD Learning Game</text>
      </svg>
    `,
    ludo: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#0b0f19"/>
        <rect x="90" y="25" width="60" height="60" fill="#ef4444"/>
        <rect x="150" y="25" width="60" height="60" fill="#22c55e"/>
        <rect x="90" y="85" width="60" height="60" fill="#facc15"/>
        <rect x="150" y="85" width="60" height="60" fill="#3b82f6"/>
        <circle cx="120" cy="55" r="6" fill="#fff"/>
        <circle cx="180" cy="55" r="6" fill="#fff"/>
        <circle cx="120" cy="115" r="6" fill="#fff"/>
        <circle cx="180" cy="115" r="6" fill="#fff"/>
        <rect x="90" y="25" width="120" height="120" stroke="#ffffff" stroke-width="2" fill="none"/>
        <text x="105" y="165" fill="#e2e8f0" font-size="13" font-weight="bold">Ludo</text>
      </svg>
    `,
    metrorunner: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#0b1329"/>
        <rect x="0" y="140" width="300" height="50" fill="#1e293b"/>
        <line x1="0" y1="150" x2="300" y2="150" stroke="#facc15" stroke-width="2" stroke-dasharray="10 8"/>
        <line x1="0" y1="170" x2="300" y2="170" stroke="#facc15" stroke-width="2" stroke-dasharray="10 8"/>
        <circle cx="150" cy="105" r="12" fill="#fbbf24"/>
        <rect x="140" y="117" width="20" height="28" rx="6" fill="#3b82f6"/>
        <rect x="120" y="145" width="14" height="10" fill="#ef4444"/>
        <rect x="166" y="145" width="14" height="10" fill="#ef4444"/>
        <rect x="230" y="100" width="18" height="45" fill="#64748b"/>
        <text x="90" y="35" fill="#38bdf8" font-size="12" font-weight="bold">Endless Runner Game</text>
      </svg>
    `,
    hurdlerace: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#0f172a"/>
        <rect x="0" y="130" width="300" height="60" fill="#1e293b"/>
        <line x1="0" y1="130" x2="300" y2="130" stroke="#22c55e" stroke-width="4"/>
        <!-- Hurdle 1 -->
        <rect x="120" y="100" width="8" height="30" fill="#ef4444"/>
        <rect x="128" y="100" width="8" height="30" fill="#ffffff"/>
        <rect x="115" y="98" width="26" height="6" fill="#ef4444"/>
        <!-- Hurdle 2 -->
        <rect x="220" y="100" width="8" height="30" fill="#ef4444"/>
        <rect x="228" y="100" width="8" height="30" fill="#ffffff"/>
        <rect x="215" y="98" width="26" height="6" fill="#ef4444"/>
        <!-- Runner/Jumper Stick Figure -->
        <circle cx="70" cy="75" r="8" fill="#facc15"/>
        <line x1="70" y1="83" x2="65" y2="105" stroke="#facc15" stroke-width="3"/>
        <line x1="65" y1="105" x2="50" y2="115" stroke="#facc15" stroke-width="3"/>
        <line x1="65" y1="105" x2="80" y2="110" stroke="#facc15" stroke-width="3"/>
        <line x1="70" y1="90" x2="55" y2="98" stroke="#facc15" stroke-width="3"/>
        <line x1="70" y1="90" x2="85" y2="82" stroke="#facc15" stroke-width="3"/>
        <text x="100" y="35" fill="#facc15" font-size="12" font-weight="bold">Hurdle Race</text>
      </svg>
    `,
    chainasta: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#2a1b3d"/>
        <path d="M95 50 Q102 38 95 28 T95 10" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none"/>
        <path d="M115 45 Q122 33 115 23 T115 5" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none"/>
        <rect x="65" y="75" width="85" height="65" rx="14" fill="#fb923c"/>
        <path d="M150 85 C168 85 168 115 150 115" stroke="#fb923c" stroke-width="7" stroke-linecap="round" fill="none"/>
        <ellipse cx="107" cy="143" rx="55" ry="8" fill="#fdba74"/>
        <circle cx="88" cy="98" r="5" fill="#1e1b4b"/>
        <circle cx="120" cy="98" r="5" fill="#1e1b4b"/>
        <circle cx="90" cy="96" r="1.5" fill="#ffffff"/>
        <circle cx="122" cy="96" r="1.5" fill="#ffffff"/>
        <circle cx="80" cy="106" r="4.5" fill="#f43f5e" opacity="0.6"/>
        <circle cx="128" cy="106" r="4.5" fill="#f43f5e" opacity="0.6"/>
        <path d="M98 106 Q104 114 110 106" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <polygon points="215,65 175,135 255,135" fill="#facc15" stroke="#eab308" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="203" cy="100" r="4.5" fill="#1e1b4b"/>
        <circle cx="227" cy="100" r="4.5" fill="#1e1b4b"/>
        <circle cx="204" cy="98" r="1.5" fill="#ffffff"/>
        <circle cx="228" cy="98" r="1.5" fill="#ffffff"/>
        <circle cx="195" cy="107" r="4" fill="#f43f5e" opacity="0.6"/>
        <circle cx="235" cy="107" r="4" fill="#f43f5e" opacity="0.6"/>
        <path d="M209 108 Q215 116 221 108 Z" fill="#1e1b4b"/>
        <text x="80" y="172" fill="#fde047" font-size="14" font-weight="bold">Chai Nasta Game</text>
      </svg>
    `,
    thargame: `
      <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="190" fill="#1c1917"/>
        <!-- Ground / Offroad Track -->
        <rect x="0" y="135" width="300" height="55" fill="#292524"/>
        <line x1="0" y1="135" x2="300" y2="135" stroke="#f97316" stroke-width="3"/>
        <!-- Spare Wheel at Back -->
        <rect x="65" y="75" width="12" height="32" rx="4" fill="#09090b" stroke="#52525b" stroke-width="2"/>
        <!-- Jeep Body -->
        <rect x="75" y="82" width="145" height="38" rx="6" fill="#dc2626"/>
        <!-- Cabin / Roof -->
        <path d="M82 82 L88 52 L162 52 L172 82 Z" fill="#18181b" stroke="#dc2626" stroke-width="3"/>
        <!-- Windows -->
        <rect x="92" y="57" width="30" height="20" rx="2" fill="#38bdf8" opacity="0.8"/>
        <polygon points="128,57 156,57 163,77 128,77" fill="#38bdf8" opacity="0.8"/>
        <!-- Front Grille & Headlight -->
        <rect x="215" y="86" width="8" height="26" rx="2" fill="#27272a"/>
        <circle cx="220" cy="93" r="4" fill="#fef08a"/>
        <!-- Bumpers -->
        <rect x="70" y="114" width="16" height="8" rx="2" fill="#3f3f46"/>
        <rect x="212" y="114" width="16" height="8" rx="2" fill="#3f3f46"/>
        <!-- Big Off-Road Tyres -->
        <circle cx="105" cy="122" r="18" fill="#09090b" stroke="#71717a" stroke-width="3"/>
        <circle cx="105" cy="122" r="7" fill="#d4d4d8"/>
        <circle cx="190" cy="122" r="18" fill="#09090b" stroke="#71717a" stroke-width="3"/>
        <circle cx="190" cy="122" r="7" fill="#d4d4d8"/>
        <text x="108" y="32" fill="#fca5a5" font-size="14" font-weight="bold">Thar Game 4x4</text>
      </svg>
    `
  };

  const data = [
    { id: 1, title: "ABCD Game", author: "Akshat Games", svg: "abcd", file: "https://2025akshat-lang.github.io/Akshat/games/Abcd%20game.html" },
    { id: 2, title: "Ludo", author: "Akshat Games", svg: "ludo", file: "https://2025akshat-lang.github.io/Akshat/games/Ludo.html" },
    { id: 3, title: "Metro Runner", author: "Akshat Games", svg: "metrorunner", file: "https://2025akshat-lang.github.io/Akshat/games/metrorunner/index.html" },
    { id: 4, title: "Hurdle Race", author: "Akshat Games", svg: "hurdlerace", file: "https://2025akshat-lang.github.io/Akshat/games/Hurdle-Race.html" },
    { id: 5, title: "Chai Nasta", author: "Akshat Games", svg: "chainasta", file: "https://2025akshat-lang.github.io/Akshat/games/Chai_nasta_games.html" },
    { id: 6, title: "Thar Game", author: "Akshat Games", svg: "thargame", file: "https://2025akshat-lang.github.io/Akshat/games/thargame.html" }
  ];

  function render() {
    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = data.map(item => `
      <div class="card">
        <div class="card-thumbnail" onclick="openModal('${item.title}', '${item.file}')">
          ${svgThumbnails[item.svg]}
        </div>
        <div class="card-content">
          <div class="card-title">${item.title}</div>
          <div class="card-footer">
            <span class="card-author">${item.author}</span>
            <div class="actions-group">
              <a href="${item.file}" target="_blank" class="new-tab-btn" title="Open in new tab">↗</a>
              <span class="badge" onclick="openModal('${item.title}', '${item.file}')">Play</span>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function openModal(title, file) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalFrame').src = file;
    document.getElementById('modalNewTabBtn').href = file;
    document.getElementById('simModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalFrame').src = '';
    document.getElementById('simModal').style.display = 'none';
  }

  render();
</script>
</body>
</html>
