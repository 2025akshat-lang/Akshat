<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thomson Plum Pudding Model 3D</title>
<style>
:root{--bg:#f4f1ec;--fg:#1d1b19;--pn:#fffdf9;--bd:#d8d2c8;--ac:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d12;--fg:#ece8e1;--pn:#1b1923;--bd:#3a3646;--ac:#fb923c}}
:root[data-theme="dark"]{--bg:#0e0d12;--fg:#ece8e1;--pn:#1b1923;--bd:#3a3646;--ac:#fb923c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:16px;margin:0}
#info{font-size:12px;opacity:.8}
#cv{flex:1;min-height:0;touch-action:none;cursor:grab}
#cv canvas{display:block;width:100%;height:100%}
details{background:var(--pn);border-top:1px solid var(--bd);max-height:42vh;overflow:auto}
summary{padding:8px 14px;font-weight:600;cursor:pointer}
#p{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;padding:4px 14px 12px}
#p label{display:flex;flex-direction:column;gap:2px;font-size:12px}
#p label.ck{flex-direction:row;align-items:center;gap:6px}
#p input[type=range]{width:100%;accent-color:var(--ac)}
#p input[type=color]{width:100%;height:30px;border:1px solid var(--bd);background:none;padding:0}
#p select{padding:5px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px}
#b{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--fg);border:1px solid var(--bd)}
</style></head><body>
<header><h1>J.J. Thomson — Plum Pudding Model (1904)</h1><span id="info"></span></header>
<div id="cv"></div>
<details open><summary>Controls</summary><div id="p"></div></details>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cv=document.getElementById('cv'),P=document.getElementById('p'),info=document.getElementById('info');
const PRE={melon:{sc:'#e3283f',ec:'#1b1410',es:.12,op:.9,gl:0,n:18,R:2.5},atom:{sc:'#ff4d6d',ec:'#38bdf8',es:.16,op:.35,gl:.8,n:14,R:2.5}};
const S=Object.assign({look:'melon',sp:1,mode:'vibrate',wire:false,auto:true,cut:true},PRE.melon);
const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
r.localClippingEnabled=true;r.setPixelRatio(Math.min(devicePixelRatio,2));cv.appendChild(r.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);let Z=9;
sc.add(new THREE.AmbientLight(0xffffff,.8));sc.add(new THREE.HemisphereLight(0xffffff,0x555555,.4));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(5,6,7);sc.add(dl);
const g=new THREE.Group();g.rotation.x=-.15;sc.add(g);
const clip=new THREE.Plane(new THREE.Vector3(0,0,-1),0);
function rindTex(){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');
 x.fillStyle='#5aa63a';x.fillRect(0,0,1024,512);const w=1024/14;
 for(let i=0;i<14;i++){const L=[],R=[];
  for(let y=0;y<=512;y+=8){const o=i*w+Math.sin(y*.06+i*2)*9+(Math.random()-.5)*7;L.push([o,y]);R.push([o+w*.55+Math.sin(y*.09+i)*7+(Math.random()-.5)*7,y])}
  x.beginPath();x.moveTo(...L[0]);L.forEach(q=>x.lineTo(...q));R.reverse().forEach(q=>x.lineTo(...q));x.closePath();x.fillStyle=i%2?'#1b5b2b':'#24702f';x.fill()}
 for(let k=0;k<2500;k++){x.fillStyle='rgba(255,255,255,.05)';x.fillRect(Math.random()*1024,Math.random()*512,2,2)}
 return new THREE.CanvasTexture(c)}
function discTex(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
 const ring=(f,col)=>{x.fillStyle=col;x.beginPath();x.arc(256,256,256*f,0,7);x.fill()};
 ring(1,'#2a6e2f');ring(.95,'#eef3c4');
 const q=x.createRadialGradient(256,256,0,256,256,225);q.addColorStop(0,'#ff8696');q.addColorStop(1,'#d91e3a');x.fillStyle=q;x.beginPath();x.arc(256,256,225,0,7);x.fill();
 x.strokeStyle='rgba(255,225,230,.25)';for(let i=0;i<40;i++){const a=Math.random()*6.28;x.beginPath();x.moveTo(256,256);x.lineTo(256+Math.cos(a)*220,256+Math.sin(a)*220);x.stroke()}
 return new THREE.CanvasTexture(c)}
// flesh = positive charge sphere
const sm=new THREE.MeshPhysicalMaterial({color:S.sc,transparent:true,opacity:S.op,roughness:.35,depthWrite:false});
const sphere=new THREE.Mesh(new THREE.SphereGeometry(1,64,48),sm);sphere.renderOrder=1;g.add(sphere);
const rm=new THREE.MeshStandardMaterial({map:rindTex(),roughness:.35});
const rind=new THREE.Mesh(new THREE.SphereGeometry(1,64,48),rm);g.add(rind);
const pm=new THREE.MeshStandardMaterial({color:0xeef3c4,roughness:.6,side:THREE.DoubleSide});
const pale=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),pm);g.add(pale);
const dm=new THREE.MeshBasicMaterial({map:discTex(),transparent:true,opacity:.6,depthWrite:false,side:THREE.DoubleSide});
const disc=new THREE.Mesh(new THREE.CircleGeometry(1,64),dm);disc.renderOrder=2;g.add(disc);
const wm=new THREE.MeshBasicMaterial({color:S.sc,wireframe:true,transparent:true,opacity:.28});
const wire=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),wm);g.add(wire);
const am=new THREE.MeshBasicMaterial({color:S.sc,transparent:true,opacity:.12,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false});
const aura=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),am);g.add(aura);
// electrons = seeds
const eg=new THREE.SphereGeometry(1,24,16);
const em=new THREE.MeshStandardMaterial({color:S.ec,emissive:S.ec,roughness:.25});
const tex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),q=x.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=q;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const hm=new THREE.SpriteMaterial({map:tex,color:S.ec,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true});
const E=[];
const rnd=()=>{let v;do{v=new THREE.Vector3(Math.random()*2-1,Math.random()*2-1,Math.random()*2-1)}while(v.lengthSq()>1);return v.multiplyScalar(.72)};
function build(){
  E.forEach(e=>g.remove(e.m));E.length=0;
  for(let i=0;i<S.n;i++){
    let best,bd=-1;
    for(let k=0;k<12;k++){const c=rnd();let d=9;E.forEach(e=>d=Math.min(d,c.distanceTo(e.h)));if(d>bd){bd=d;best=c}}
    const m=new THREE.Mesh(eg,em),h=new THREE.Sprite(hm);m.add(h);g.add(m);
    m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
    E.push({m,sp:h,h:best,p:best.clone(),ph:Math.random()*6.28,ax:rnd().normalize(),w:(Math.random()*.8+.4)*(Math.random()<.5?-1:1),v:rnd().normalize().multiplyScalar(.35)});
  }
  ap();
}
function ap(){
  const mel=S.look==='melon';
  sm.color.set(S.sc);wm.color.set(S.sc);am.color.set(S.sc);
  em.color.set(S.ec);em.emissive.set(mel?'#000000':S.ec);hm.color.set(S.ec);
  sm.opacity=S.op;hm.opacity=Math.min(1,S.gl*.7);am.opacity=.04+S.gl*.1;em.emissiveIntensity=.3+S.gl*.6;
  const pl=S.cut?[clip]:[];
  [sm,am,wm,rm,pm,em].forEach(m=>{m.clippingPlanes=pl;m.needsUpdate=true});
  sm.side=S.cut?THREE.DoubleSide:THREE.FrontSide;
  rind.visible=pale.visible=mel;disc.visible=mel&&S.cut;aura.visible=!mel;wire.visible=S.wire;
  E.forEach(e=>{
    if(mel)e.m.scale.set(S.es*.6,S.es*1.25,S.es*.45);else e.m.scale.setScalar(S.es);
    e.sp.visible=S.gl>0&&!mel;e.sp.scale.setScalar(5)});
  info.textContent=mel?'Laal gooda = positive charge (+'+S.n+')  |  Kaale beej = electrons (−'+S.n+')  |  Net = 0 ✓':'Sphere: +'+S.n+'  |  Electrons: −'+S.n+'  |  Net charge: 0 ✓';
}
let T=0,pulse=0,ex=0,AT=0;const clock=new THREE.Clock(),tmp=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const raw=Math.min(clock.getDelta(),.05),dt=raw*S.sp;T+=dt;
  pulse=Math.max(0,pulse-raw*.45);ex=Math.max(0,ex-raw*.5);
  const mel=S.look==='melon',k=1+Math.sin(performance.now()/1000*14)*.1*pulse*pulse,R=S.R*k;
  sphere.scale.setScalar(R*(mel?.88:1));rind.scale.setScalar(R);pale.scale.setScalar(R*.95);disc.scale.setScalar(R);
  wire.scale.setScalar(R*1.002);aura.scale.setScalar(R*1.12);
  clip.normal.set(0,0,-1).applyQuaternion(g.quaternion);clip.constant=0;
  const f=1+Math.sin(ex*Math.PI)*2.4;
  E.forEach(e=>{
    if(S.mode==='vibrate'){const a=T*3+e.ph;e.p.set(e.h.x+Math.sin(a)*.05,e.h.y+Math.sin(a*1.3+1)*.05,e.h.z+Math.sin(a*.8+2)*.05)}
    else if(S.mode==='orbit'){e.p.copy(e.h).applyAxisAngle(e.ax,T*e.w)}
    else if(S.mode==='drift'){e.p.addScaledVector(e.v,dt);if(e.p.length()>.8){e.p.setLength(.8);tmp.copy(e.p).normalize();e.v.reflect(tmp)}}
    else e.p.copy(e.h);
    e.m.position.copy(e.p).multiplyScalar(R*f);
  });
  if(S.auto){if(S.cut){AT+=raw;g.rotation.y+=Math.cos(AT*.6)*.42*raw}else g.rotation.y+=raw*.35}
  r.render(sc,cam);
}
const ptr=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;
  const o=ptr.get(e.pointerId);
  if(ptr.size===1){g.rotation.y+=(e.clientX-o[0])*.008;g.rotation.x+=(e.clientY-o[1])*.008}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)Z=Math.min(18,Math.max(4,Z*pd/d));pd=d;fit()}
});
const up=e=>{ptr.delete(e.pointerId);pd=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();Z=Math.min(18,Math.max(4,Z*(1+e.deltaY*.001)));fit()},{passive:false});
function fit(){cam.position.z=Z/Math.min(1,cam.aspect*1.1)}
function rs(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();fit()}
new ResizeObserver(rs).observe(cv);
function row(l,el,c){const d=document.createElement('label');if(c)d.className=c;d.append(document.createTextNode(l));if(c)d.prepend(el);else d.append(el);P.append(d)}
function ui(){
  P.innerHTML='';
  const lk=document.createElement('select');[['melon','Real Watermelon 🍉'],['atom','Atom model (glowing)']].forEach(([v,t])=>lk.add(new Option(t,v)));lk.value=S.look;
  lk.onchange=()=>{Object.assign(S,{look:lk.value},PRE[lk.value]);ui();build()};row('Look',lk);
  [['Beej/Electrons ki sankhya','n',1,60,1],['Beej/Electron size','es',.05,.4,.01],['Tarbooj/Sphere radius','R',1.5,3.5,.1],['Gooda transparency','op',.05,1,.01],['Speed','sp',0,3,.1],['Glow effect','gl',0,1.5,.05]].forEach(([l,k,a,b,s])=>{
    const i=document.createElement('input');i.type='range';i.min=a;i.max=b;i.step=s;i.value=S[k];
    i.oninput=()=>{S[k]=+i.value;k==='n'?build():ap()};row(l,i)});
  [['Gooda / positive sphere color','sc'],['Beej / electron color','ec']].forEach(([l,k])=>{
    const i=document.createElement('input');i.type='color';i.value=S[k];i.oninput=()=>{S[k]=i.value;ap()};row(l,i)});
  const se=document.createElement('select');
  [['vibrate','Vibrate (jagah par kaampna)'],['orbit','Orbit (ghoomna)'],['drift','Random drift'],['still','Still (ruka hua)']].forEach(([v,t])=>se.add(new Option(t,v)));
  se.value=S.mode;se.onchange=()=>{S.mode=se.value;E.forEach(e=>e.p.copy(e.h))};row('Electron motion',se);
  [['Wireframe','wire'],['Auto-rotate','auto'],['Kata hua (cut) view','cut']].forEach(([l,k])=>{
    const i=document.createElement('input');i.type='checkbox';i.checked=S[k];i.onchange=()=>{S[k]=i.checked;ap()};row(l,i,'ck')});
  const bx=document.createElement('div');bx.id='b';P.append(bx);
  const btn=(t,fn,c)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=fn;bx.append(b)};
  btn('Pulse effect',()=>{pulse=1});btn('Explode & return',()=>{ex=1});btn('Shuffle',build,'s');btn('Reset',()=>location.reload(),'s');
}
ui();build();rs();loop();
</script>
</body></html>
