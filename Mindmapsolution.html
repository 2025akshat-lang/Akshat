<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Solution Mind Map</title>
    <!-- D3.js Library for smooth Interactive Tree Graphics -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Glassmorphism Title Header */
        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header h1 {
            font-size: 1.2rem;
            color: #66fcf1;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 0.8rem;
            color: #45a29e;
            margin-top: 4px;
        }

        /* Node Custom Styling */
        .node circle {
            cursor: pointer;
            stroke-width: 3px;
            transition: all 0.3s ease;
        }

        .node text {
            font-size: 12px;
            fill: #fff;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: 500;
        }

        .node text.hi {
            fill: #ffbd59;
            font-weight: bold;
        }

        /* Glowing Links between nodes */
        .link {
            fill: none;
            stroke: #1f2833;
            stroke-width: 2px;
            transition: stroke 0.5s ease;
        }

        .link.active {
            stroke: #45a29e;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧪 Solution (विलयन) Mind Map</h1>
        <p>💡 Kisi bhi node par tap/click karke use open ya close kar</p>
    </div>

    <svg id="mindmap" width="100%" height="100%"></svg>

    <script>
        // Mind Map Data Structure
        const treeData = {
            name: "SOLUTION", hi: "विलयन",
            children: [{
                name: "HOMOGENEOUS MIXTURE", hi: "समांगी मिश्रण",
                children: [
                    { name: "SOLUTE", hi: "विलेय" },
                    {
                        name: "SOLVENT", hi: "विलायक",
                        children: [{
                            name: "AMOUNT / PROPORTION", hi: "मात्रा / अनुपात",
                            children: [{
                                name: "of SOLUTE & SOLVENT", hi: "विलेय एवं विलायक का",
                                children: [{
                                    name: "CONCENTRATION", hi: "सांद्रता",
                                    children: [
                                        {
                                            name: "QUALITATIVE", hi: "गुणात्मक",
                                            children: [
                                                { name: "DILUTE SOLUTION", hi: "तनु विलयन" },
                                                { name: "CONCENTRATED SOLUTION", hi: "सांद्र विलयन" }
                                            ]
                                        },
                                        {
                                            name: "QUANTITATIVE", hi: "मात्रात्मक",
                                            children: [{
                                                name: "EXPRESSION OF CONCENTRATION", hi: "सांद्रता की मात्रात्मक अभिव्यक्ति",
                                                children: [{
                                                    name: "PERCENTAGE", hi: "प्रतिशत",
                                                    children: [
                                                        {
                                                            name: "MASS BY MASS %", hi: "द्रव्यमान %",
                                                            children: [{ name: "MASS OF SOLUTE", hi: "विलेय का द्रव्यमान" }]
                                                        },
                                                        {
                                                            name: "VOLUME BY VOLUME %", hi: "आयतन %",
                                                            children: [{ name: "VOLUME OF SOLUTE", hi: "विलेय का आयतन" }]
                                                        }
                                                    ]
                                                }]
                                            }]
                                        }
                                    ]
                                }]
                            }]
                        }]
                    },
                    {
                        name: "ORS EXAMPLE", hi: "ORS का उदाहरण",
                        children: [{
                            name: "SOLUBILITY", hi: "विलेयता",
                            children: [{
                                name: "MAXIMUM AMOUNT OF SOLUTE", hi: "विलेय की अधिकतम मात्रा",
                                children: [{
                                    name: "FIXED AMOUNT OF SOLVENT AT TEMP", hi: "निश्चित ताप पर विलायक",
                                    children: [
                                        {
                                            name: "UNSATURATED SOLUTION", hi: "असंतृप्त विलयन",
                                            children: [{ name: "MORE SOLUTE CAN DISSOLVE", hi: "अधिक विलेय घुल सकता है" }]
                                        },
                                        {
                                            name: "SATURATED SOLUTION", hi: "संतृप्त विलयन",
                                            children: [
                                                { name: "NO MORE SOLUTE CAN DISSOLVE", hi: "अधिक विलेय नहीं घुल सकता" },
                                                {
                                                    name: "TEMPERATURE", hi: "तापमान",
                                                    children: [{ name: "SOLUBILITY CHANGES", hi: "विलेयता में परिवर्तन" }]
                                                }
                                            ]
                                        }
                                    ]
                                }]
                            }]
                        }]
                    }
                ]
            }]
        };

        // Canvas Setup
        const width = window.innerWidth;
        const height = window.innerHeight;
        let i = 0, duration = 500, root;

        const treemap = d3.tree().size([height - 100, width - 300]);

        const svg = d3.select("#mindmap")
            .call(d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            }))
            .append("g");

        const g = svg.append("g").attr("transform", "translate(100,0)");

        root = d3.hierarchy(treeData, d => d.children);
        root.x0 = height / 2;
        root.y0 = 0;

        // Start with all children COLLAPSED
        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }
        
        // Collapse root's children initially
        if (root.children) {
            root.children.forEach(collapse);
        }

        update(root);

        function update(source) {
            const treeData = treemap(root);
            const nodes = treeData.descendants();
            const links = treeData.descendants().slice(1);

            nodes.forEach(d => { d.y = d.depth * 180; });

            // Nodes Updating
            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .on('click', click);

            // Chamchamaati Glow and Circles
            nodeEnter.append('circle')
                .attr('class', 'node-circle')
                .attr('r', 1e-6)
                .style("fill", d => d._children ? "#ff007f" : "#00f2fe")
                .style("stroke", "#fff")
                .style("filter", "drop-shadow(0px 0px 8px #00f2fe)");

            // English Text
            nodeEnter.append('text')
                .attr("dy", "-0.3em")
                .attr("x", d => d.children || d._children ? -15 : 15)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name);

            // Hindi Text
            nodeEnter.append('text')
                .attr("class", "hi")
                .attr("dy", "1.2em")
                .attr("x", d => d.children || d._children ? -15 : 15)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.hi);

            // Transition Nodes to Position
            const nodeUpdate = nodeEnter.merge(node);

            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            nodeUpdate.select('circle.node-circle')
                .attr('r', 10)
                .style("fill", d => d._children ? "#ff007f" : "#00f2fe")
                .style("filter", d => d._children ? "drop-shadow(0px 0px 10px #ff007f)" : "drop-shadow(0px 0px 8px #00f2fe)")
                .attr('cursor', 'pointer');

            // Remove Exiting Nodes
            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();

            nodeExit.select('circle').attr('r', 1e-6);

            // Links Updating
            const link = g.selectAll('path.link')
                .data(links, d => d.id);

            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', d => {
                    const o = { x: source.x0, y: source.y0 };
                    return diagonal(o, o);
                });

            const linkUpdate = linkEnter.merge(link);

            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => diagonal(d, d.parent))
                .attr("class", "link active");

            link.exit().transition()
                .duration(duration)
                .attr('d', d => {
                    const o = { x: source.x, y: source.y };
                    return diagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });

            // Curved Line Math
            function diagonal(s, d) {
                return `M ${s.y} ${s.x}
                        C ${(s.y + d.y) / 2} ${s.x},
                          ${(s.y + d.y) / 2} ${d.x},
                          ${d.y} ${d.x}`;
            }

            // Click Handler to Expand/Collapse
            function click(event, d) {
                if (d.children) {
                    d._children = d.children;
                    d.children = null;
                } else {
                    d.children = d._children;
                    d._children = null;
                }
                update(d);
            }
        }
    </script>
</body>
</html>
