<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solutions Mind Map - Grade 8 NCERT</title>
    <!-- D3.js Library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism Title Header */
        .header {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            text-align: center;
            z-index: 10;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header h1 {
            font-size: 1.1rem;
            color: #66fcf1;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.75rem;
            color: #45a29e;
            margin-top: 2px;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Node Styling */
        .node circle {
            cursor: pointer;
            stroke-width: 2px;
            transition: all 0.3s ease;
        }

        .node text {
            font-size: 11px;
            fill: #ffffff;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            font-weight: 500;
        }

        .node text.hi {
            fill: #ffbd59;
            font-weight: 600;
        }

        /* Glowing Links */
        .link {
            fill: none;
            stroke: #1f2833;
            stroke-width: 2px;
            transition: stroke 0.5s ease;
        }

        .link.active {
            stroke: #45a29e;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧪 Solutions (Curiosity - Grade 8)</h1>
        <p>💡 Tap nodes to expand • Drag/Pinch to Pan & Zoom</p>
    </div>

    <div id="canvas-container">
        <svg id="mindmap" width="100%" height="100%"></svg>
    </div>

    <script>
        // Exact NCERT Grade 8 Curiosity Data
        const treeData = {
            name: "SOLUTIONS", hi: "विलयन",
            children: [
                {
                    name: "1. COMPONENTS", hi: "घटक",
                    children: [
                        { name: "SOLUTE", hi: "विलेय (Dissolved)" },
                        { name: "SOLVENT", hi: "विलायक (Dissolves)" }
                    ]
                },
                {
                    name: "2. PROPORTIONS", hi: "अनुपात",
                    children: [
                        { name: "ORS SOLUTION", hi: "ORS घोल" },
                        { name: "PESTICIDES", hi: "कीटनाशक" }
                    ]
                },
                {
                    name: "3. CONCENTRATION", hi: "सांद्रता (%)",
                    children: [
                        {
                            name: "% MASS/MASS", hi: "द्रव्यमान %",
                            children: [
                                { name: "Formula: (m_solute/m_soln)×100", hi: "Milk Powder, Food Labels" }
                            ]
                        },
                        {
                            name: "% MASS/VOL", hi: "द्रव्यमान-आयतन %",
                            children: [
                                { name: "Formula: (m_solute/v_soln)×100", hi: "5% Glucose, 0.9% Saline" }
                            ]
                        },
                        {
                            name: "% VOL/VOL", hi: "आयतन %",
                            children: [
                                { name: "Formula: (v_solute/v_soln)×100", hi: "Perfumes, 5% Vinegar" }
                            ]
                        }
                    ]
                },
                {
                    name: "4. SOLUBILITY", hi: "विलेयता",
                    children: [
                        { name: "SATURATED", hi: "संतृप्त विलयन" },
                        {
                            name: "TEMP EFFECT", hi: "तापमान प्रभाव",
                            children: [
                                { name: "Solids: Temp ↑ = Sol ↑", hi: "ठोस: ताप ↑ विलेयता ↑" },
                                { name: "Gases: Temp ↑ = Sol ↓", hi: "गैस: ताप ↑ विलेयता ↓" }
                            ]
                        },
                        { name: "SOLUBILITY CURVE", hi: "विलेयता वक्र"
                        },
                                                { name: "unsaturated solution",
                                                hi:
           "असंतृप्त विलयन"                                   
                        }
                    ]
                }
            ]
        };

        const container = document.getElementById('canvas-container');
        const width = container.clientWidth;
        const height = container.clientHeight;
        let i = 0, duration = 400, root;

        // Expanded Horizontal space (1400px) so nodes won't collide horizontally
        const treeWidth = 1400; 
        const treemap = d3.tree().size([treeWidth, height - 250]);

        const svg = d3.select("#mindmap");
        const g = svg.append("g");

        // Pan and Zoom Handler
        const zoom = d3.zoom()
            .scaleExtent([0.2, 2.5])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        root = d3.hierarchy(treeData, d => d.children);
        root.x0 = treeWidth / 2;
        root.y0 = 0;

        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }
        
        if (root.children) {
            root.children.forEach(collapse);
        }

        // Center view on load
        svg.call(zoom.transform, d3.zoomIdentity.translate((width - treeWidth) / 2, 90).scale(0.75));

        update(root);

        function update(source) {
            const treeData = treemap(root);
            const nodes = treeData.descendants();
            const links = treeData.descendants().slice(1);

            // Generous vertical depth gap
            nodes.forEach(d => { d.y = d.depth * 130; });

            const node = g.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => `translate(${source.x0},${source.y0})`)
                .on('click', click);

            nodeEnter.append('circle')
                .attr('class', 'node-circle')
                .attr('r', 1e-6)
                .style("fill", d => d._children ? "#ff007f" : "#00f2fe")
                .style("stroke", "#fff")
                .style("filter", "drop-shadow(0px 0px 8px #00f2fe)");

            nodeEnter.append('text')
                .attr("dy", "-0.8em")
                .attr("text-anchor", "middle")
                .text(d => d.data.name);

            nodeEnter.append('text')
                .attr("class", "hi")
                .attr("dy", "1.4em")
                .attr("text-anchor", "middle")
                .text(d => d.data.hi);

            const nodeUpdate = nodeEnter.merge(node);

            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => `translate(${d.x},${d.y})`);

            nodeUpdate.select('circle.node-circle')
                .attr('r', 8)
                .style("fill", d => d._children ? "#ff007f" : "#00f2fe")
                .style("filter", d => d._children ? "drop-shadow(0px 0px 10px #ff007f)" : "drop-shadow(0px 0px 8px #00f2fe)");

            const nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => `translate(${source.x},${source.y})`)
                .remove();

            nodeExit.select('circle').attr('r', 1e-6);

            const link = g.selectAll('path.link')
                .data(links, d => d.id);

            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', d => {
                    const o = { x: source.x0, y: source.y0 };
                    return verticalDiagonal(o, o);
                });

            const linkUpdate = linkEnter.merge(link);

            linkUpdate.transition()
                .duration(duration)
                .attr('d', d => verticalDiagonal(d, d.parent))
                .attr("class", "link active");

            link.exit().transition()
                .duration(duration)
                .attr('d', d => {
                    const o = { x: source.x, y: source.y };
                    return verticalDiagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });

            function verticalDiagonal(s, d) {
                return `M ${s.x} ${s.y}
                        C ${s.x} ${(s.y + d.y) / 2},
                          ${d.x} ${(s.y + d.y) / 2},
                          ${d.x} ${d.y}`;
            }

            function click(event, d) {
                if (d.children) {
                    d._children = d.children;
                    d.children = null;
                } else {
                    d.children = d._children;
                    d._children = null;
                }
                update(d);
            }
        }
    </script>
</body>
</html>
